# Not listed in kustomization.yaml on purpose: applying it would overwrite the
# operator-filled Secrets on every `apply -k`. It documents the five Secrets
# the egress broker, the nodes and the api half read, and how to mint their
# contents.
#
#   NS=agentenv-system
#   # A CA that signs leaf certificates for intercepted names and the
#   # broker's own server certificate. It carries no nameConstraints: the same
#   # CA signs `CN=aenv-egress` with a `*.svc` SAN, so an excluded set covering
#   # the cluster suffixes would invalidate that certificate, and a permitted
#   # set cannot enumerate the public domains rules may name. What bounds the
#   # leaves is the broker: it signs only a name a rule already matched, under
#   # a per-sandbox mint budget (`ca.mints_per_sandbox_per_minute`).
#   openssl ecparam -name prime256v1 -genkey -noout -out ca.key
#   openssl req -x509 -new -key ca.key -sha256 -days 3650 -subj "/CN=AgentENV Egress CA" \
#     -addext "basicConstraints=critical,CA:TRUE" \
#     -addext "keyUsage=critical,keyCertSign,cRLSign" \
#     -out ca.crt
#   kubectl -n $NS create secret generic egress-ca --from-file=ca.crt --from-file=ca.key
#
#   # The broker's server certificate, for the Service name nodes dial.
#   openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out tls.key
#   openssl req -new -key tls.key -subj "/CN=aenv-egress" \
#     -addext "subjectAltName=DNS:aenv-egress,DNS:aenv-egress.$NS.svc" -out tls.csr
#   openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 -sha256 \
#     -copy_extensions copy -out tls.crt
#   kubectl -n $NS create secret generic egress-server --from-file=tls.crt --from-file=tls.key
#
#   # The HMAC key runtimes sign identity headers with; nodes read the same key.
#   head -c 32 /dev/urandom | base64 -w0 > key
#   kubectl -n $NS create secret generic egress-hmac --from-file=key
#
#   # Two Vault tokens, one per process, because the two need disjoint
#   # capabilities: the broker only ever reads, and the api half only ever
#   # writes (`SecretsBackend` has no read). One token carrying both would let
#   # a compromised broker write itself a grant for any name.
#   vault policy write aenv-egress-reader - <<'HCL'
#   path "aenv/data/secrets/*" { capabilities = ["read"] }
#   path "aenv/data/grants/*"  { capabilities = ["read"] }
#   HCL
#   vault policy write aenv-secrets-writer - <<'HCL'
#   path "aenv/data/secrets/*"     { capabilities = ["create", "update"] }
#   path "aenv/data/grants/*"      { capabilities = ["create", "update"] }
#   path "aenv/metadata/secrets/*" { capabilities = ["delete"] }
#   path "aenv/metadata/grants/*"  { capabilities = ["delete"] }
#   HCL
#   # `aenv` above is [secrets.vault].mount / vault.mount; change both if the
#   # mount is not the default.
#
#   # The broker's read-only token.
#   vault token create -policy=aenv-egress-reader -field=token > token
#   kubectl -n $NS create secret generic egress-vault --from-file=token
#
#   # The api half's writer token. A separate Secret so the broker's Pod never
#   # mounts it, read as an environment variable rather than a file because
#   # that is what [secrets.vault].token binds to.
#   kubectl -n $NS create secret generic secrets-vault-writer \
#     --from-literal=token="$(vault token create -policy=aenv-secrets-writer -field=token)"
#
#   # Then switch the nodes and the api half on. AENV_EGRESS_BROKER_MODE and
#   # AENV_SECRETS_BACKEND are both read once at process startup, and patching
#   # a ConfigMap changes no pod template (the generators run with
#   # `disableNameSuffixHash: true`), so each side needs its own restart.
#   kubectl -n $NS patch configmap egress-broker-config --type merge \
#     -p '{"data":{"AENV_EGRESS_BROKER_MODE":"remote"}}'
#   kubectl -n $NS patch configmap secrets-store-config --type merge \
#     -p '{"data":{"AENV_SECRETS_BACKEND":"vault","AENV_SECRETS_VAULT_ADDR":"https://vault.vault.svc:8200"}}'
#   kubectl -n $NS rollout restart ds/agentenv-node deploy/agentenv-api
#   # `make k8s-redeploy` is the same restart for all four workloads, with the
#   # rollout waits.
#
# Rotating the HMAC key is adding the new value to `key` on the broker side
# under a second file name listed in hmac.key_files, rolling the nodes onto
# it, then removing the old one. Rotating the CA is appending the new
# certificate to ca.crt (nodes hand the whole bundle to guests) before any
# leaf is signed by it. Rotating either Vault token is `vault token create`
# against the same policy, `kubectl create secret --dry-run=client | kubectl
# apply -f -`, and a restart of the Pod that reads it.
apiVersion: v1
kind: Secret
metadata:
  name: egress-ca
type: Opaque
stringData:
  ca.crt: "PEM certificate, see above"
  ca.key: "PEM private key, see above"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-server
type: Opaque
stringData:
  tls.crt: "PEM certificate chain for aenv-egress, see above"
  tls.key: "PKCS#8 PEM private key, see above"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-hmac
type: Opaque
stringData:
  key: "random bytes, see above"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-vault
type: Opaque
stringData:
  token: "a Vault token that only reads secrets and grants, see above"
---
# The api half's token, mounted by agentenv-api-deployment.yaml alone.
apiVersion: v1
kind: Secret
metadata:
  name: secrets-vault-writer
type: Opaque
stringData:
  token: "a Vault token that only writes secrets and grants, see above"
