# 阶段 4/Stage E: the `agentenv-scheduler` ServiceAccount this file used to
# also declare is deleted along with the Go scheduler — no Pod references it
# any more. `agentenv-api` keeps its own identity below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentenv-api
---
# The broker DaemonSet's own identity. Its projected token, audience
# `aenv-api`, is what the api half's internal endpoints check; it grants
# nothing on the Kubernetes API and no Role binds it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aenv-egress
