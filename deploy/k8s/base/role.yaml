# The name is history, not a mistake: the workload it was written for
# (`agentenv-scheduler`) no longer exists, but renaming a Role that
# rolebinding.yaml's RoleBinding still points at by name is not free on a live
# cluster (RoleBinding.roleRef is immutable, so a rename means delete-then-
# recreate and a real, if brief, permission gap). See rolebinding.yaml's own
# comment for the full reasoning.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentenv-scheduler-discovery
rules:
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
# Cluster-scoped, and it has to be: `TokenReview` is a non-namespaced
# subresource of the authentication API, so no Role can grant it.
#
# `create` on `tokenreviews` is the narrowest permission that answers "is this
# token genuine, and whose is it" — it reads nothing and mutates nothing. It is
# what the internal endpoints the egress broker calls establish a caller's node
# with; without it those endpoints answer 503 and no broker is issued an
# intermediate. The `pods` `get` they also need is already in the namespaced
# Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentenv-api-token-review
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
