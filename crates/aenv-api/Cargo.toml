[package]
name = "aenv-api"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
name = "aenv_api"
path = "src/lib.rs"

[[bin]]
name = "aenv-api"
path = "src/bin/aenv-api.rs"

# 🔴 The operator tool, in this crate because the snapshot catalog is
# PostgreSQL and this is the half that holds the only `[pg]` pool. It used to
# live in `aenv-node` and read the object-storage catalog directly; there is no
# object-storage catalog any more. Excluded from the Docker image and the
# install packages — `make build-snapshot-image` is how it is built.
[[bin]]
name = "aenv-snapshot-image"
path = "src/bin/aenv-snapshot-image.rs"

[dependencies]
aenv-core = { path = "../.." }
# 🔴 The only cipher in the workspace, and deliberately not the ambient
# openssl: a typed nonce and an AAD that the API refuses to let you forget
# are what keep `[secrets.pg]`'s envelope from being wrong in the two ways
# that matter. See `src/secrets/envelope.rs`.
aes-gcm = "0.10"
agentenv-observability = { path = "../observability" }
anyhow = "1.0.100"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "openssl-tls"] }
libc = "0.2"
metrics = "0.24"
# The same openssl `kube`'s TLS already links, used directly here to issue
# the node intermediates. It is not a second TLS stack, and `aenv-api` never
# terminates TLS with it.
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Runtime-query API only (`sqlx::query`/`query_as`), never the `query!`
# compile-time macros: those need either a live database or an offline cache at
# build time, which would leak into CI and Docker builds. See `src/pg/mod.rs`
# and the root manifest's own note, which this entry was moved from.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "json", "chrono", "derive"] }
# 🔴 A normal dependency, not a dev one: `aenv-snapshot-image` materializes the
# blobs it hands `regctl` under a temporary directory.
tempfile = "3.22.0"
thiserror = "2.0.18"
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.14.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = "1"

[dev-dependencies]
# Driving the internal router with `oneshot`, so the endpoint tests need no
# port and no server task.
tower = { version = "0.5.2", features = ["util"] }
aenv-core = { path = "../..", features = ["test-support"] }
# A dev dependency, not a normal one: the only HTTP client this crate makes is
# the one its resolve-endpoint tests drive the endpoint with.
reqwest = { version = "0.13", features = ["json"] }
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
