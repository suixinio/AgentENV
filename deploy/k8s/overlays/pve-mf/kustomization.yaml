apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The pve-mf cluster (PVE host `pve-mf`, k3s on 10.1.0.200/10.1.0.201).
#
# It differs from `overlays/default` in two respects. First, the registry this
# cluster's images and user images come from. `base` ships neutral,
# do-nothing-safe defaults in two places that `deploy/k8s/run.sh`'s
# IMAGE_REGISTRY rewrite deliberately does not touch — that rewrite only
# retags the three `agentenv-*` images built from this tree — and this
# overlay supplies this cluster's real, plain-HTTP registry
# (`10.1.0.201:5000`) for both:
#
#   * base/redis.yaml's `image:`, an upstream image (`redis:7.4.10-alpine`,
#     unqualified — pulled straight from docker.io in base) that this
#     cluster instead needs mirrored into its own registry; the `images:`
#     transformer below re-points it.
#   * base/config/regctl.json, which base ships with an empty `hosts` map,
#     and which is what tells `regctl` that this one registry speaks plain
#     HTTP. It is a configMapGenerator *file*, so an overlay replaces the
#     whole generator rather than patching a field.
#
# Second, brokered egress is switched on here: the nodes dial the broker in
# remote mode, and the api half keeps secret values in its own PostgreSQL
# (`[secrets].backend = "postgres"`), which the broker resolves against. Six
# Secrets from `aenv-egress-secrets.example.yaml` must exist before the first
# apply: the four every brokered deployment needs, plus `agentenv-secrets-key`
# (the master key) and `egress-resolver` (the bearer both halves hold).
#
# 🔴 Losing `agentenv-secrets-key` loses every stored value. It is not in the
# database's own Secret and a database backup cannot recover it.
#
# `vault-dev.yaml` stays applied as the rollback target. Going back is one
# ConfigMap key and one patch:
#
#   NS=agentenv-system
#   kubectl -n $NS patch configmap secrets-store-config --type merge \
#     -p '{"data":{"AENV_SECRETS_BACKEND":"vault","AENV_SECRETS_VAULT_ADDR":"http://vault-dev:8200"}}'
#   # plus AENV_EGRESS_VAULT_ADDR back on the broker in place of
#   # AENV_EGRESS_RESOLVER_URL below, and then, because a dev-mode Vault holds
#   # its state in memory, the reader token has to be re-issued against it:
#   READER=$(kubectl -n $NS get secret egress-vault -o jsonpath='{.data.token}' | base64 -d)
#   kubectl -n $NS exec -i deploy/vault-dev -- vault policy write aenv-egress-reader - <<'HCL'
#   path "aenv/data/secrets/*" { capabilities = ["read"] }
#   path "aenv/data/grants/*"  { capabilities = ["read"] }
#   HCL
#   kubectl -n $NS exec deploy/vault-dev -- \
#     vault token create -id="$READER" -policy=aenv-egress-reader -period=768h
#
# Every value written since the switch stays in PostgreSQL and is not in that
# Vault, so a rollback is a rollback of the code path, not of the data.
#
# Everything else, including the /var/lib/aenv hostPath, matches
# `overlays/default`. The `agentenv-runtime-secrets` Secret is likewise NOT
# generated here for the reason that overlay spells out at length: one
# committed seed would be the same seed on every cluster that applied it.
# Create it once, before the first apply.

namespace: agentenv-system

resources:
  - ../../base
  - vault-dev.yaml

configMapGenerator:
  - name: regctl-config
    behavior: replace
    files:
      - config.json=regctl.json
  - name: egress-broker-config
    behavior: merge
    literals:
      - AENV_EGRESS_BROKER_MODE=remote
  - name: secrets-store-config
    behavior: merge
    literals:
      - AENV_SECRETS_BACKEND=postgres
      # Still set, and unread while the backend is postgres: it is what the
      # rollback above puts back into service.
      - AENV_SECRETS_VAULT_ADDR=http://vault-dev:8200

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: redis
    newName: 10.1.0.201:5000/redis

patches:
  - target:
      kind: DaemonSet
      name: agentenv-node
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /var/lib/aenv
  # The credential source. Only one of AENV_EGRESS_RESOLVER_URL and
  # AENV_EGRESS_VAULT_ADDR belongs here: with both, the broker uses the
  # resolver, ignores [vault] and says so once a startup — a warning that
  # would then sit in the log forever describing a configuration nobody chose.
  - target:
      kind: Deployment
      name: aenv-egress
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AENV_EGRESS_RESOLVER_URL
          value: http://agentenv-api:8000/internal
  # base lets the broker reach a Vault in the `vault` namespace; this cluster's
  # dev Vault runs beside the broker. Kept for the rollback: while the backend
  # is postgres the broker never dials it. The api half's own 8000 is already
  # in base.
  - target:
      kind: NetworkPolicy
      name: aenv-egress
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: vault-dev
          ports:
            - port: 8200
              protocol: TCP
