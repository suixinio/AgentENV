# The egress broker's configuration, mounted from the `aenv-egress-config`
# ConfigMap. Paths name the volumes the broker DaemonSet mounts.
metrics_listen = "0.0.0.0:9103"
# The deadline for the identity frame. Nothing on a connection is admitted
# until it arrives, so this bounds the work an unadmitted peer can hold open.
admission_timeout_ms = 10000
# Connections held at once; the excess is closed at accept, not queued.
max_connections = 4096
# Connections one sandbox holds at once, inside the limit above.
per_sandbox_connections = 256
# How long SIGTERM lets live sessions finish before the process stops waiting.
# Keep it under the pod's termination grace period, 30s by default.
shutdown_drain_secs = 25

[listen]
# The node-local socket aenv-node connects to. Both DaemonSets mount the
# directory as the same hostPath, and the broker recreates the socket on every
# start.
socket_path = "/run/aenv-egress/broker.sock"
# The uid aenv-node runs as. A connection from any other non-root process on
# this machine is closed before its header is read; this is not a boundary
# against root, which can reach the socket whatever its mode says.
peer_uid = 0

[ca]
# This node's intermediate, issued by the api half against this Pod's own
# projected token. 🔴 Guests trust the *root*, never this intermediate: a
# sandbox pauses on one node and resumes on another, and a process that loaded
# its trust store once carries it across the move.
#
# A broker that cannot reach the issuer does not refuse to start — it serves
# the passthrough path and closes matched names, which is one node degraded
# rather than one node down. `cert_path` and `key_path` are the other shape,
# for a stack with no api half to ask (see deploy/docker/config).
issuer_url = "http://agentenv-api:8000/internal"
issuer_token_file = "/var/run/secrets/aenv/api/token"
leaf_ttl_secs = 86400
cache_capacity = 4096
mints_per_sandbox_per_minute = 60

[upstream]
# The cluster's Service and Pod CIDRs. These are absolute: unlike the built-in
# private ranges, no per-handler allowed_cidrs reopens them, so this is where a
# range nothing may ever reach belongs. k3s defaults; change them with the
# cluster.
denied_cidrs = ["10.42.0.0/16", "10.43.0.0/16"]

[resolver]
# Where the broker resolves credentials. Unset leaves it without a source and
# every marker answers 502. With [secrets].backend = "postgres" this is the
# api half itself:
#   url = "http://agentenv-api:8000/internal"
# The NetworkPolicy has to admit whatever it names.
# The same projected token the issuer endpoint checks. Read on every call:
# kubelet rotates a projected token in place, well inside a broker's uptime.
# While the api half still accepts the shared bearer
# (`[secrets].legacy_bearer_until`), `/etc/aenv-egress/resolver/token` works
# here too — and a caller presenting it is scoped to no node.
token_file = "/var/run/secrets/aenv/api/token"
timeout_ms = 5000
# How long a resolved credential is reused. It bounds how long a revocation
# takes to bite, and it is the only bound there is: this half cannot reach a
# broker to tell it, so a revoked grant is noticed on the next lookup.
cache_ttl_secs = 10
cache_capacity = 4096

[handlers]
# The identity-echo handler; leave off outside smoke tests.
echo = false

[handlers.tcp]
# The byte relay for `tcp` endpoint declarations. An enabled handler with an
# empty allowed_cidrs reaches nothing: the operator names where declarations
# may point, and no sandbox input can widen it.
#
# A range named here is reached even when it is private, which is the point —
# the upstream is the operator's choice, not the guest's, so neither the
# built-in private ranges nor the sandbox's own egress policy bounds it. What
# it still cannot reach is the broker's own host, the link-local range that
# carries cloud metadata, and everything in [upstream].denied_cidrs.
enabled = false
allowed_cidrs = []

[handlers.postgres]
# Terminates the guest's Postgres startup exchange and authenticates upstream
# with the credential the endpoint declaration names. The guest's DSN carries a
# placeholder user and password that are never used. allowed_cidrs bounds where
# a credential may point and reads exactly as [handlers.tcp]'s above; empty
# means the handler reaches nothing. A tenant database on a private address
# belongs here.
enabled = false
allowed_cidrs = []

[audit]
# One JSON line per brokered request on stdout, under the `egress.audit`
# tracing target, plus the security and handshake events that are not
# requests. Metadata only: a header the broker injected is recorded by name,
# never by value, and the query string is not recorded at all. `none` turns
# the whole trail off, including the security events — a deployment that sets
# it is saying it collects them somewhere else.
level = "metadata"
