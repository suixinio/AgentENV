syntax = "proto3";

package scheduler.v1;

option go_package = "agentenv/services/api/proto;schedulerv1";

service Scheduler {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc LookupNode(LookupNodeRequest) returns (LookupNodeResponse);
  rpc RecordAssignment(RecordAssignmentRequest) returns (RecordAssignmentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportSandboxEvent(ReportSandboxEventRequest) returns (ReportSandboxEventResponse);
  rpc ListObservedNodes(ListObservedNodesRequest) returns (ListObservedNodesResponse);
  rpc ListP2pPeers(ListP2pPeersRequest) returns (ListP2pPeersResponse);
  rpc RecordP2pArtifact(RecordP2pArtifactRequest) returns (RecordP2pArtifactResponse);
  rpc ForgetP2pArtifact(ForgetP2pArtifactRequest) returns (ForgetP2pArtifactResponse);
  rpc LookupP2pArtifact(LookupP2pArtifactRequest) returns (LookupP2pArtifactResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);
  rpc ListRegistrySandboxes(ListRegistrySandboxesRequest) returns (ListRegistrySandboxesResponse);
}

message Node {
  string node_id = 1;
  string endpoint = 2;
}

// ScheduleRequestHint carries structured information parsed from the incoming
// request so the scheduler can make a more informed placement decision. Only
// request types that benefit from scheduling hints are represented; other
// requests omit the hint entirely.
message ScheduleRequestHint {
  oneof kind {
    NewColdSandboxHint new_cold_sandbox = 1;
    NewSandboxHint new_sandbox = 2;
  }
}

// NewColdSandboxHint describes a POST /sandboxes-cold request.
message NewColdSandboxHint {
  uint32 cpu_count = 1;
  uint64 memory_mb = 2;
  // OCI image references involved in the cold start: the rootfs image plus any
  // attached-drive images.
  repeated string images = 3;
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 4;
}

// NewSandboxHint describes a POST /sandboxes request.
message NewSandboxHint {
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 1;
}

message ScheduleRequest {
  reserved 1;  // formerly: string hint = 1
  ScheduleRequestHint hint = 2;
}

message ScheduleResponse {
  Node node = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message LookupNodeRequest {
  string sandbox_id = 1;
}

// SandboxLocation says how the scheduler arrived at the node it names, which is
// what decides whether that node is known to hold the sandbox or has merely
// been chosen to rebuild it.
//
// The distinction matters to the caller: a node that already holds the sandbox
// also holds its binding, while a node that was picked or pinned holds neither
// and has to have the assignment recorded against it as soon as it answers.
enum SandboxLocation {
  // The scheduler did not classify this answer. Only an older scheduler
  // produces it; it is equivalent to BOUND, since that is all a scheduler
  // without the registry could ever answer.
  SANDBOX_LOCATION_UNSPECIFIED = 0;
  // A node is known to hold the sandbox — from its binding, from the roster it
  // reported in its last heartbeat, or from a registry row that names it as
  // the holder.
  SANDBOX_LOCATION_BOUND = 1;
  // The registry has the sandbox paused with its snapshot published, so any
  // node can rebuild it. The node named here is a placement decision, taken
  // with origin_node_id as a soft preference so the layers already on that
  // machine get reused when it can still take work.
  SANDBOX_LOCATION_PLACED = 2;
  // The registry has the sandbox parked on origin_node_id with no snapshot in
  // shared storage (publishing, or local_only after a failed upload). The only
  // copy is on that machine's disk, so the answer is that node or nothing.
  SANDBOX_LOCATION_PINNED = 3;
}

message LookupNodeResponse {
  Node node = 1;
  SandboxLocation location = 2;
  // The node that holds the sandbox's local artifacts, as the registry records
  // it. Carried whenever the answer came from a registry row — for PLACED it is
  // the preference the placement was taken against, which may or may not be the
  // node above.
  string origin_node_id = 3;
}

message RecordAssignmentRequest {
  string sandbox_id = 1;
  Node node = 2;
}

message RecordAssignmentResponse {}

message MachineInfo {
  string cpu_family = 1;
  string cpu_model = 2;
  string cpu_model_name = 3;
  string cpu_architecture = 4;
  string cpu_config_json = 5;
}

message DiskMetric {
  string mount_point = 1;
  string device = 2;
  string filesystem_type = 3;
  uint64 used_bytes = 4;
  uint64 total_bytes = 5;
}

// NodeStatus describes the effective state of a node as derived by the
// scheduler from its discovery state and heartbeat history.
//
//   active  + heartbeat OK      → READY        — accepts new sandboxes
//   active  + no heartbeat      → CONNECTING    — discovered but not yet confirmed
//   active  + heartbeat timeout → UNHEALTHY     — heartbeat lost
//   lingering + heartbeat OK    → LINGERING     — terminating, draining existing work
//   lingering + no heartbeat    → CONNECTING    — terminating, never confirmed
//   lingering + heartbeat timeout → UNHEALTHY   — terminating, heartbeat lost
//
// DRAINING is different in kind from the rows above: it is not derived, it is
// what the node itself reports after being isolated through its own admin API.
// A node reports it while it is still perfectly healthy, so it never overrides
// a derived status — LINGERING and UNHEALTHY both win over it, because a pod
// that is going away, or a node that stopped answering, is the stronger fact.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_READY = 1;
  NODE_STATUS_CONNECTING = 2;
  NODE_STATUS_UNHEALTHY = 3;
  NODE_STATUS_LINGERING = 4;
  // Node-reported isolation: serving existing sandboxes, refusing new work.
  NODE_STATUS_DRAINING = 5;
}

message NodeSnapshot {
  NodeStatus status = 1;
  uint32 allocated_cpu = 2;
  uint64 allocated_memory_bytes = 3;
  uint32 cpu_percent = 4;
  uint32 cpu_count = 5;
  uint64 memory_used_bytes = 6;
  uint64 memory_total_bytes = 7;
  repeated DiskMetric disks = 8;
  uint32 sandbox_count = 9;
  uint32 sandbox_starting_count = 10;
  uint64 create_successes = 11;
  uint64 create_fails = 12;
  int64 reported_at_unix_ms = 13;
  // Paused-sandbox resource accounting. These are *not* included in
  // sandbox_count, allocated_cpu, or allocated_memory_bytes — those report the
  // active running set only. Paused sandboxes have released their VM-side
  // CPU / memory but still own persisted state on the node, so the scheduler
  // can use these fields (together with the active fields) to apply
  // "including paused" capacity limits.
  uint32 paused_sandbox_count = 14;
  uint32 paused_allocated_cpu = 15;
  uint64 paused_allocated_memory_bytes = 16;
}

message P2pEndpoint {
  string backend = 1;
  string address = 2;
}

message ObservedNode {
  string node_id = 1;
  string endpoint = 2;
  string cluster_id = 3;
  string service_instance_id = 4;
  string version = 5;
  string commit = 6;
  MachineInfo machine_info = 7;
  NodeSnapshot snapshot = 8;
  int64 last_seen_unix_ms = 9;
}

message HeartbeatRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  string version = 4;
  string commit = 5;
  MachineInfo machine_info = 6;
  NodeSnapshot snapshot = 7;
  repeated string sandbox_ids = 8;
  P2pEndpoint p2p_endpoint = 9;
}

message HeartbeatResponse {
  string cpu_config_json = 1;
}

enum SandboxEventType {
  SANDBOX_EVENT_TYPE_UNSPECIFIED = 0;
  SANDBOX_EVENT_TYPE_CREATE = 1;
  SANDBOX_EVENT_TYPE_DELETE = 2;
  SANDBOX_EVENT_TYPE_PAUSE = 3;
  SANDBOX_EVENT_TYPE_RESUME = 4;
  // Fork events are reported once per child sandbox; sandbox_id and requested
  // resources refer to the child sandbox, not the source sandbox.
  SANDBOX_EVENT_TYPE_FORK = 5;
}

message SandboxEvent {
  string sandbox_id = 1;
  SandboxEventType event_type = 2;
  uint32 requested_cpu = 3;
  uint64 requested_memory_bytes = 4;
  uint64 requested_disk_bytes = 5;
}

message ReportSandboxEventRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  repeated SandboxEvent events = 4;
}

message ReportSandboxEventResponse {}

message ListObservedNodesRequest {
  string cluster_id = 1;
}

message ListObservedNodesResponse {
  repeated ObservedNode nodes = 1;
}

message P2pPeer {
  string node_id = 1;
  P2pEndpoint endpoint = 2;
}

message ListP2pPeersRequest {
  string cluster_id = 1;
  string backend = 2;
  string exclude_node_id = 3;
}

message ListP2pPeersResponse {
  repeated P2pPeer peers = 1;
}

message RecordP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message RecordP2pArtifactResponse {}

message ForgetP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message ForgetP2pArtifactResponse {}

message LookupP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string exclude_node_id = 4;
}

message LookupP2pArtifactResponse {
  repeated P2pPeer peers = 1;
}

message GetNodeRequest {
  string node_id = 1;
  string cluster_id = 2;
}

message GetNodeResponse {
  ObservedNode node = 1;
}

message UnregisterNodeRequest {
  string node_id = 1;
  string service_instance_id = 2;
}

message UnregisterNodeResponse {}

// RegistrySandbox is one row of the node-owned `paused_sandboxes` table, read
// only. The scheduler never writes this table; every value here is what the
// nodes agreed on among themselves.
message RegistrySandbox {
  string sandbox_id = 1;
  string cluster_id = 2;
  // One of publishing, paused, resuming, local_only, running. Carried as a
  // string rather than an enum because the set is pinned by a CHECK constraint
  // the nodes own: a value this build has not heard of has to survive the trip
  // to an operator's screen, not be flattened to UNSPECIFIED.
  string state = 3;
  int64 generation = 4;
  // The node holding the local artifacts. A claim deliberately leaves this
  // pointing at the previous holder, so it is not the answer to "who owns this
  // row now" — holder_node_id is.
  string origin_node_id = 5;
  // The node bringing the sandbox back up. Only set while state is resuming.
  string claimed_by_node_id = 6;
  // Empty while publishing, and while local_only after a failed upload.
  string snapshot_id = 7;
  int64 paused_at_unix_ms = 8;
  int64 updated_at_unix_ms = 9;
  // 0 means the column is NULL, which the nodes treat as already expired.
  int64 lease_expires_at_unix_ms = 10;
  // 0 means the column is NULL, which never matches a reclaim condition.
  int64 sandbox_expires_at_unix_ms = 11;
  // The node this row makes authoritative: claimed_by_node_id when resuming,
  // origin_node_id otherwise. Derived, not stored.
  string holder_node_id = 12;
}

message ListRegistrySandboxesRequest {
  // Optional exact-match filter on state.
  string state = 1;
  // Optional filter on holder_node_id.
  string node_id = 2;
  // 0 means no limit.
  int32 page_size = 3;
  // The next_page_token of the previous response.
  string page_token = 4;
}

message ListRegistrySandboxesResponse {
  repeated RegistrySandbox sandboxes = 1;
  // Empty when the last page has been returned.
  string next_page_token = 2;
  // The database clock the rows were read against. Every lease field above is
  // only meaningful relative to this, never to the reader's own clock.
  int64 database_now_unix_ms = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// PausedRegistry: the paused-sandbox registry, served by whoever owns the
// database instead of by every node against it directly.
//
// The five methods here cover thirteen operations on the node side. The
// narrowing is deliberate: a wire contract shaped like the node's own trait
// would make "the node decides" a cross-process contract, and the next stage
// begins by deleting that. What survives the next stage is shaped like this.
//
// Every request carries cluster_id and node_id. The node scopes each statement
// rather than the connection, and one cluster reaching another's sandboxes is a
// case its tests cover; making the scope implicit here is how that property
// gets lost.
//
// 🔴 No method may answer a failure with an empty result. A sandbox missing
// from GetSandboxes means the row does not exist, and the caller deletes local
// artifacts on the strength of that. Anything that went wrong is an RPC error.
// ─────────────────────────────────────────────────────────────────────────────
service PausedRegistry {
  // Reads rows in bulk. All-or-nothing: any backend failure is an error, never
  // a shorter map. Carries no metadata — no bulk consumer reads it.
  rpc GetSandboxes(GetSandboxesRequest) returns (GetSandboxesResponse);

  // Moves a sandbox between states. Covers begin_pause, complete_pause,
  // mark_local_only, mark_running, release_claim and remove.
  rpc TransitionSandbox(TransitionSandboxRequest) returns (TransitionSandboxResponse);

  // Takes a sandbox for a resume, deciding on the server which of the three
  // cases applies. Carries metadata, for the one row it answers with.
  rpc AcquireSandbox(AcquireSandboxRequest) returns (AcquireSandboxResponse);

  // Extends the lease on everything a node reports holding.
  rpc RenewNodeLease(RenewNodeLeaseRequest) returns (RenewNodeLeaseResponse);

  // Frees what a previous process on the same machine was holding.
  rpc ReleaseNodeHoldings(ReleaseNodeHoldingsRequest) returns (ReleaseNodeHoldingsResponse);
}

// RegistryEntry is one row, without metadata.
message RegistryEntry {
  string sandbox_id = 1;
  string cluster_id = 2;
  // One of publishing, paused, resuming, local_only, running.
  //
  // A string rather than an enum because the table's CHECK constraint is the
  // source of truth and it belongs to whoever migrates the database. A value
  // this build has not heard of has to reach an operator's screen intact
  // rather than flatten into UNSPECIFIED alongside a genuinely absent one.
  string state = 3;
  int64 generation = 4;
  // The node holding the local artifacts. A claim deliberately leaves this
  // pointing at the previous holder, so it is not the answer to "who owns this
  // row now" while state is resuming — claimed_by_node_id is.
  string origin_node_id = 5;
  // Set only while state is resuming.
  string claimed_by_node_id = 6;
  // Empty while publishing, and after a publish that failed.
  string snapshot_id = 7;
  // 🔴 Microseconds, not nanoseconds and not seconds. PostgreSQL stores
  // timestamptz to the microsecond and the node's clock type is nanosecond, so
  // nanoseconds would round-trip a write as a silently truncated read; seconds
  // would make two transitions within the same second unorderable.
  int64 paused_at_unix_micros = 8;
  int64 updated_at_unix_micros = 9;
}

message GetSandboxesRequest {
  string cluster_id = 1;
  repeated string sandbox_ids = 2;
}

message GetSandboxesResponse {
  // Only the sandboxes that have rows. An id that was asked for and is absent
  // from `sandboxes` *and present in* `covered_sandbox_ids` has no row.
  repeated RegistryEntry sandboxes = 1;
  // 🔴 The ids this answer actually covers — every id the server looked up,
  // whether or not it found a row.
  //
  // "All-or-nothing" is the contract, but the caller could not check it: a
  // truncated page, a partial stream or a chunk loop that dropped its tail all
  // look exactly like "those ids have no rows", and the caller's response to
  // "no row" is to tear down a running sandbox and delete its local artifacts.
  // So the coverage travels explicitly and the caller asserts it before
  // treating any absence as authority to delete.
  //
  // An older server leaves this empty; a caller that wants the assertion must
  // treat empty as "not asserted" rather than as "covered nothing".
  repeated string covered_sandbox_ids = 2;
  // The database's own clock, from the same statement that read the rows.
  //
  // Lease arithmetic on a row must not use the reading process's wall clock —
  // that is the mistake `Listing` already carries `now` to avoid. Zero from an
  // older server means "not supplied", not "the epoch".
  int64 now_unix_micros = 3;
}

// TransitionKind is which of the node-side operations this is.
enum TransitionKind {
  TRANSITION_KIND_UNSPECIFIED = 0;
  // Records that a pause has started. Carries metadata and the lease TTL;
  // answers with the generation to quote and the snapshot this pause orphaned.
  TRANSITION_KIND_BEGIN_PAUSE = 1;
  // Publishes the snapshot a pause produced. Requires expect_generation.
  TRANSITION_KIND_COMPLETE_PAUSE = 2;
  // Records that the snapshot never reached the repository. Requires
  // expect_generation.
  TRANSITION_KIND_MARK_LOCAL_ONLY = 3;
  // Records that a sandbox is live on this node. Never creates a row.
  TRANSITION_KIND_MARK_RUNNING = 4;
  // Hands a claimed sandbox back unresumed. Requires expect_generation.
  TRANSITION_KIND_RELEASE_CLAIM = 5;
  // Deletes the row. Requires expect_generation.
  TRANSITION_KIND_REMOVE = 7;
  // Deprecated: the unconditional delete. Refused by this build.
  //
  // It was the whole interface's one unguarded destructive write: the caller
  // read the row, decided it was not live elsewhere, and then deleted it, with
  // the decision and the delete in two statements. A node that had just come
  // back from a partition and had not reconciled yet would take that path
  // against a sandbox already resumed somewhere else, and the delete would
  // succeed, silently, taking the snapshot with it. Guarding it in the caller
  // was exactly the "the node decides" shape phase 2 exists to remove.
  TRANSITION_KIND_REMOVE_UNCONDITIONAL = 6 [deprecated = true];
}

message TransitionSandboxRequest {
  string cluster_id = 1;
  string sandbox_id = 2;
  string node_id = 3;
  TransitionKind kind = 4;
  // Required on the four conditional transitions — complete_pause,
  // mark_local_only, release_claim and remove — and refused on the rest.
  //
  // Four, not five: mark_running's predicate is on state and holder, never on
  // generation, so quoting one at it would suggest a guarantee it does not
  // give. (begin_pause creates or takes over a row and has nothing to quote.)
  //
  // remove joined this list in D11. See TRANSITION_KIND_REMOVE_UNCONDITIONAL.
  optional int64 expect_generation = 5;
  // 🔴 Raw JSON bytes, passed through untouched. Not google.protobuf.Struct:
  // that reorders keys, collapses integers into doubles, and normalises what it
  // does not recognise, and the type on the other side does not reject unknown
  // fields — so a field lost in translation is lost silently.
  bytes metadata_json = 6;
  // 🔴 The lease TTL belongs to the node, not to this service. The node renews
  // on its own cadence and its configuration enforces that the TTL leaves room
  // for two missed renewals; a TTL chosen here instead would expire rows
  // underneath a node that is renewing exactly as it was told to. So it travels
  // with every transition that stamps a lease — which is all of them except
  // remove.
  int64 lease_ttl_millis = 7;
  // complete_pause only.
  string snapshot_id = 8;
}

message TransitionSandboxResponse {
  // begin_pause only: the generation to quote when finishing.
  int64 generation = 1;
  // begin_pause only: the snapshot this pause replaced, empty when there was
  // none. Nothing references it once the pause completes.
  string previous_snapshot_id = 2;
  // mark_running only: whether the cluster tracks this sandbox and now names
  // this node as its holder. False means there is no row, which is what a
  // sandbox that has never been paused looks like — not an error.
  //
  // Kept for rollout compatibility; mark_running_outcome says which of the two
  // false cases this is. Equal to (outcome == MARK_RUNNING_OUTCOME_ADOPTED).
  bool tracked = 3;
  // remove only: whether the delete matched. False means the generation quoted
  // was not the row's any more — somebody else has moved it since this caller
  // last read it — which is not an error: the row this caller meant to delete
  // is already gone.
  bool removed = 4;
  // mark_running only. See MarkRunningOutcome.
  MarkRunningOutcome mark_running_outcome = 5;
  // release_claim only: whether the release matched a row.
  //
  // False means the generation quoted was stale, and centrally that is the
  // *only* remaining signal of it — the node used to see the zero-row update
  // itself. Not an error: the claim this caller meant to release is no longer
  // this caller's.
  bool matched = 6;
}

// MarkRunningOutcome splits the two facts the `tracked` bool ran together.
//
// store.go says it plainly: "the difference between 'not tracked' and
// 'somebody else's' — and the caller needs both". Before phase 2 the node read
// the row back to tell them apart; centrally that re-read happens on the
// server, so the distinction has to cross the wire or it is lost.
enum MarkRunningOutcome {
  MARK_RUNNING_OUTCOME_UNSPECIFIED = 0;
  // No row. What a sandbox that has never been paused looks like.
  MARK_RUNNING_OUTCOME_UNTRACKED = 1;
  // There was a row, and it now names this node as the holder.
  MARK_RUNNING_OUTCOME_ADOPTED = 2;
  // There was a row and it belongs to another node, which is still holding it.
  // The caller is running a sandbox the cluster says is somewhere else.
  MARK_RUNNING_OUTCOME_HELD_ELSEWHERE = 3;
}

message AcquireSandboxRequest {
  string cluster_id = 1;
  string sandbox_id = 2;
  string node_id = 3;
  // A successful claim stamps a fresh lease; see TransitionSandboxRequest.
  int64 lease_ttl_millis = 4;
}

message AcquiredSandbox {
  RegistryEntry entry = 1;
  // Raw JSON bytes; see TransitionSandboxRequest.metadata_json.
  bytes metadata_json = 2;
  // 🔴 What the row said *before* the claim moved it to resuming, read in the
  // same statement rather than off the returned row — RETURNING hands back the
  // row as the update left it, so reading state there always says resuming.
  //
  // publishing or local_only here means the claim overrode a node that never
  // finished uploading: the sandbox comes back one snapshot behind and the work
  // since then is gone. That is the one event on this path an operator has to
  // be able to find, so it is carried explicitly rather than inferred.
  string previous_state = 3;
}

message AcquireOriginRef {
  // Under not_ready: the node whose local artifacts are the only copy.
  // Under conflict + LIVE_ELSEWHERE: the node holding the live sandbox.
  // Under conflict + CLAIM_LOST: the node that took the claim from this caller.
  string origin_node_id = 1;
  // Set on conflict only; UNSPECIFIED under not_ready and from older servers.
  ConflictReason reason = 2;
}

// ConflictReason splits the two situations a bare conflict ran together.
//
// They call for opposite responses — one means "route the resume to that node",
// the other means "this caller lost a race and must not touch the sandbox" —
// and the central placement decision in phase 3 has to make the same
// distinction from the same field.
enum ConflictReason {
  CONFLICT_REASON_UNSPECIFIED = 0;
  // The sandbox is live on origin_node_id. Nobody may take it.
  CONFLICT_REASON_LIVE_ELSEWHERE = 1;
  // This caller held the claim and no longer does.
  CONFLICT_REASON_CLAIM_LOST = 2;
}

message AcquireSandboxResponse {
  oneof outcome {
    // The caller owns it and must resume it or release the claim.
    AcquiredSandbox claimed = 1;
    // No row: unknown to the cluster.
    AcquireNotFound not_found = 2;
    // Still uploading, so only the origin node can serve this resume.
    AcquireOriginRef not_ready = 3;
    // Live elsewhere, or a claim this caller lost.
    AcquireOriginRef conflict = 4;
  }
}

message AcquireNotFound {}

message HeldSandbox {
  string sandbox_id = 1;
  // When this sandbox is currently due to end. Absent means it was asked never
  // to expire, which is not the same as unknown: reclamation leaves it alone
  // forever.
  optional int64 expires_at_unix_micros = 2;
}

message RenewNodeLeaseRequest {
  string cluster_id = 1;
  string node_id = 2;
  repeated HeldSandbox held = 3;
  int64 lease_ttl_millis = 4;
  // How often this node renews. Reported so the invariant that owns both
  // numbers — a TTL must survive two missed renewals, i.e. ttl >= 3*interval —
  // can be checked somewhere. The node enforces it locally on its own config,
  // but a node built against a different default, or a config that drifted
  // between the two knobs, produces a TTL nothing here could question.
  //
  // 🔴 Reported, not enforced: a disagreement is logged and counted, never
  // refused. Refusing would turn one node's config drift into that node's
  // sandboxes silently expiring — the exact outcome the invariant protects
  // against. Zero means an older node that does not report it.
  int64 reconcile_interval_millis = 5;
}

message RenewNodeLeaseResponse {
  uint64 renewed = 1;
}

message ReleaseNodeHoldingsRequest {
  string cluster_id = 1;
  string node_id = 2;
}

message ReleaseNodeHoldingsResponse {
  // Handed back to the cluster as paused, recoverable from the snapshot they
  // name.
  uint64 released = 1;
  // Deleted because no snapshot was ever published for them, so nothing remains
  // to rebuild the sandbox from.
  uint64 discarded = 2;
}
