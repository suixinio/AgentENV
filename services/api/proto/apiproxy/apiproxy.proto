syntax = "proto3";

package agentenv.apiproxy.v1;

option go_package = "agentenv/services/api/proto/apiproxy;apiproxyv1";

// The one thing the data plane asks the control plane for.
//
// 🔴 **One RPC, and it stays one RPC.** The gateway is a router: it resolves a
// sandbox to a node and forwards bytes. The only question it cannot answer from
// its own projection is "this sandbox is paused — wake it", and that is a
// decision, so it belongs to the API half. Everything else the gateway needs it
// already has. A second method here would be the beginning of the gateway
// asking the control plane to decide things on the request path, which is the
// arrangement this split exists to end.
//
// 🔴 **A separate file from `scheduler.proto` and a separate directory.** Both
// ends of this one are ours, but unlike `node.proto` this one has a Go consumer
// — the gateway — so it is on `services/Makefile`'s `PROTO_SRC` as well as on
// `build.rs`. The subdirectory is not decoration: `paths=source_relative` writes
// the generated Go next to the source, and Go allows one package per directory,
// so a second `option go_package` in `services/api/proto/` would not compile.
// # Metadata, in both directions
//
// Two things travel outside the messages, both copied from e2b's shape
// (`proxy_grpc.go` reads its tokens off gRPC metadata, not off proto fields):
//
// | key | direction | meaning |
// |---|---|---|
// | `x-agentenv-target-port` | request | the port the data-plane request was for; decides whether this is envd traffic |
// | `x-access-token` | request | the caller's envd access token; checked for `secure` sandboxes |
// | `x-agentenv-resume-refusal` | response trailer | why a `FAILED_PRECONDITION` refusal happened |
// | `x-agentenv-resume-origin-node` | response trailer | the node a pinned refusal named |
//
// 🔴 **The refusal reason is a trailer, not a status detail.** `Status::with_details`
// on the Rust side writes raw bytes into `grpc-status-details-bin`, and Go's
// `status.Details()` expects that trailer to hold a marshalled `google.rpc.Status`
// — so the two do not meet, and the reason would arrive as an undecodable blob
// on the only consumer that needs it. `node.proto` uses details because both of
// its ends are Rust.
//
// 🔴 **Two `FAILED_PRECONDITION` reasons, and they are not interchangeable.**
// A caller that cannot tell them apart backs off wrongly in one direction or the
// other:
//
// | reason | means | how long |
// |---|---|---|
// | `transition_in_progress` | somebody else is mid-operation on this sandbox | a moment; retry |
// | `auto_resume_disabled` | the sandbox's row forbids traffic-triggered wake-ups | until a user resumes it explicitly |
//
// 🔴 Neither means "try another node": a paused sandbox is a snapshot row any
// node can rebuild, and it is the api half that places the rebuild.
service SandboxResumeService {
  // Wakes a paused sandbox and says where it woke up.
  //
  // Idempotent in the way that matters: a sandbox that is already running is a
  // success carrying that sandbox's node and incarnation, not a conflict. The
  // gateway's caller is a user request that wants to reach the sandbox, and two
  // requests arriving together must both be able to.
  rpc ResumeSandbox(SandboxResumeRequest) returns (SandboxResumeResponse);
}

message SandboxResumeRequest {
  string sandbox_id = 1;
}

message SandboxResumeResponse {
  // The node the sandbox is running on now.
  string node_id = 1;

  // Where to send the request that triggered this wake-up, so the gateway does
  // not have to look the node up a second time.
  //
  // 🔴 May be empty, and empty is not an error. A single-node deployment has no
  // placement source to name an address, and a caller that treated "" as an
  // address would proxy to nowhere. The gateway resolves the node itself when
  // this is empty — see `resume.Client` for the three-state read.
  string node_address = 2;

  // The incarnation this wake-up produced, for the gateway's execution fencing.
  //
  // 🔴 Present precisely because the alternative is a fencing gap: the request
  // that caused this resume is about to be forwarded, and without an
  // incarnation to expect, that first request is the one request in a sandbox's
  // life that travels unfenced.
  string execution_id = 3;
}
