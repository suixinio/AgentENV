apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-gateway
  labels:
    app.kubernetes.io/name: agentenv-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-gateway
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: gateway
          image: agentenv-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /config/gateway.json
          ports:
            - name: http
              containerPort: 8080
            # The gateway has always served Prometheus metrics on its own
            # listener; without this and the matching Service port nothing
            # could scrape them.
            - name: metrics
              containerPort: 9102
          env:
            - name: GATEWAY_SANDBOX_PROXY_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: sandbox-proxy-config
                  key: SANDBOX_PROXY_DOMAINS
                  optional: true
            # The shared secret the gateway stamps on every request it forwards
            # to a node, so the node can tell control-plane traffic from
            # anything that reached it another way.
            #
            # 🔴 The same Secret the DaemonSet mounts, but a different key in
            # it, and that is the whole reason the ordering below is
            # expressible at all. Injection has to be switched on *first* and
            # switched off *last*: a node whose gate is open while the gateway
            # is not stamping refuses every platform request. If both sides
            # read the same key, creating the Secret would switch both on at
            # once and the ordering would be a sentence in a runbook with
            # nothing behind it. So the gateway reads `token` and the node's
            # volume projects `node-gate-token` (see the `items:` block on the
            # DaemonSet's control-plane-token volume).
            #
            # Rolling out is therefore "create the Secret with `token` only,
            # roll the gateway, verify it stamps, *then* add
            # `node-gate-token`"; rolling back is "set `node-gate-token` to the
            # empty string, then stop stamping". 🔴 The two values must be the
            # same credential — derive the second from the first rather than
            # retyping it, since a typo there is every platform request 403.
            #
            # optional: an absent Secret leaves the value empty, the gateway
            # stamps nothing, and the node's gate stays open — which is the
            # state this ships in.
            - name: GATEWAY_CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentenv-control-plane-token
                  key: token
                  optional: true
            # 🔴 Off at first contact, on purpose, and this is why the setting
            # has to be here at all: the code's default is `enforce`, and the
            # release sequence requires the gateway to go out injecting the
            # token while refusing nothing. Without this the deployment cannot
            # express the step it is supposed to be at.
            #
            # See the scheduler Deployment for why the environment carries these
            # alongside the mounted config file.
            - name: GATEWAY_ROUTING_EXECUTION_FENCING
              valueFrom:
                configMapKeyRef:
                  name: execution-fencing-config
                  key: GATEWAY_ROUTING_EXECUTION_FENCING
                  optional: true
            # Where the routing projection lives, for the gateway to read
            # directly. The same Redis the scheduler writes to (redis.yaml), and
            # the same reasoning as SCHEDULER_REDIS_ADDR: a Service name is not
            # a credential, so it is a plain value rather than a Secret ref.
            #
            # 🔴 Set here from the start, while the read switch below is still
            # `off`, and that ordering is not optional. The gateway refuses to
            # start with `projection_read` on and no address — deliberately, so
            # that a switch reporting as on can never be doing nothing — which
            # means turning the switch on *first* is a CrashLoop, not a
            # degraded read. With the switch off this value is inert: the
            # gateway builds no client at all and never opens a connection, so
            # carrying it costs nothing and removes the ordering hazard from
            # the flip entirely.
            - name: GATEWAY_REDIS_ADDR
              value: agentenv-redis:6379
            # Whether the gateway may answer a sandbox route out of the routing
            # projection instead of asking the api half's resume RPC.
            #
            # 🔴 Starts `off`, and unlike the fencing switches above the *code*
            # defaults to off as well, so a cluster that rolled this image
            # without asking for projection reads does not acquire them at the
            # next pod restart. The read side is paired with the api half's
            # `[binding_store].arbitration` staying in its enforcing mode; see
            # services/shared/config for why. Nothing enforces the pairing; it
            # is an operational rule.
            #
            # As with the fencing switches, the ConfigMap carries the release's
            # starting value and this environment variable exists so a
            # rollback is `kubectl set env` — which rolls the deployment and is
            # loud — rather than an edit to a mounted file, which would not take
            # effect at all until something restarted the pod anyway.
            - name: GATEWAY_ROUTING_PROJECTION_READ
              valueFrom:
                configMapKeyRef:
                  name: routing-projection-config
                  key: GATEWAY_ROUTING_PROJECTION_READ
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: gateway-config
              mountPath: /config/gateway.json
              subPath: gateway.json
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-k8s-config
