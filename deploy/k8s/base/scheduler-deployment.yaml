apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-scheduler
  labels:
    app.kubernetes.io/name: agentenv-scheduler
spec:
  # 🔴 One replica, and it stays one. The registry write surface would be safe
  # with more — every statement it runs is a single conditional write, so two
  # writers cannot corrupt each other — but this process is more than that
  # surface. Bindings now live in Redis (see SCHEDULER_REDIS_ADDR below and
  # redis.yaml), but observed-node state and the P2P artifact index are still
  # per-process memory, so a second full replica would still serve half the
  # cluster from an empty copy of both. Redis is the prerequisite for scaling
  # out, not the act of it: the replicas it unlocks are `--query-only` ones,
  # which serve LookupNode and nothing else, and adding them is a different
  # change from this one.
  #
  # What is fixed here is the window, not the count: since phase 2 this process
  # is a hard dependency of every node's renewals, pauses and resumes, and how
  # long it is absent during an upgrade was left entirely to the default
  # rolling-update behaviour — which takes the only Pod down first.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the replacement before retiring the incumbent. The two overlap for
      # a few seconds and that is fine for the registry: both run the same
      # single-statement conditional writes, and the new one's restart grace
      # window withholds exactly the decisions a just-started process must not
      # make. Taking the old one down first instead leaves a gap in which every
      # node's registry call fails.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-scheduler
    spec:
      serviceAccountName: agentenv-scheduler
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: scheduler
          image: agentenv-scheduler:latest
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /config/scheduler.json
          env:
            # Where the sandbox-to-node bindings live. Set, they go to the
            # Redis in redis.yaml; unset, they stay in this process's memory
            # and every rollout of this Deployment drops the whole routing
            # table, which the data plane pays for as 503s until heartbeats
            # refill it. Measured on the dev cluster across paired rollout
            # restarts of this Deployment, one running sandbox, probes at 3/s:
            # unset, a contiguous 2.3-3.3s window of 503 on the sandbox proxy
            # path; set, zero 503s in the same probe.
            #
            # 🔴 What it does NOT buy: bindings still carry `binding_ttl`
            # (30s by default). A scheduler absent for longer than that loses
            # them from Redis too, and the failure that follows is worse than
            # the 503 — for the ~13s until a heartbeat re-seeds the binding,
            # LookupNode answers NOT_FOUND and the gateway returns 404 for a
            # sandbox that is up and healthy. Redis shortens the window that
            # rollouts open; it does not make the routing table durable.
            #
            # 🔴 Control plane only. This address must never be handed to the
            # `agentenv-node` DaemonSet: nodes reach the binding store through
            # the scheduler's gRPC surface and giving them a direct line to the
            # shared store is the same mistake as the registry DSN that was
            # taken off the nodes in phase 3.
            #
            # A plain value rather than a Secret ref because it is a Service
            # name, not a credential — this Redis has no password and is
            # reachable only inside the cluster (see the note in redis.yaml).
            # Adding `requirepass` means moving this to a Secret in the same
            # change.
            - name: SCHEDULER_REDIS_ADDR
              value: agentenv-redis:6379
            # Read-only DSN for the node-owned `paused_sandboxes` table. It
            # carries credentials, so it never goes near the ConfigMap.
            #
            # `optional: true` is not decoration: a cluster that does not run a
            # registry database has no such Secret, and the scheduler has to
            # come up there exactly as it always did. An empty DSN switches the
            # whole feature off.
            - name: SCHEDULER_REGISTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: agentenv-postgres
                  key: dsn
                  optional: true
            # Scopes every registry read to one cluster, and — once the write
            # surface is on — every write and the reclamation timer with it.
            #
            # 🔴 The same ConfigMap key the DaemonSet reads `AENV_CLUSTER_ID`
            # from, on purpose: this value only means anything if both sides
            # hold the same one, and neither can detect that they do not. It
            # used to come from a key on the `agentenv-postgres` Secret that
            # nothing ever created, which is how a fresh cluster got a write
            # surface that was permanently cold with a single error line to
            # explain it. A cluster id is a name, not a credential, so it has
            # no business being in a Secret in the first place.
            #
            # Left optional: absent, the read surface widens to every row in
            # the database and the write surface stays registered and cold
            # answering UNAVAILABLE. Both are deliberate — a missing value must
            # not take routing, discovery and bindings down with it — which is
            # exactly why the value is carried by the base layer rather than by
            # an object somebody has to remember to create. `/healthz` reports
            # the id in use, so "configured" can be told from "assumed".
            - name: SCHEDULER_REGISTRY_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-identity-config
                  key: CLUSTER_ID
                  optional: true
            # The two halves of the incarnation work that can be switched off,
            # each named for the half it governs.
            #
            # 🔴 Two settings and not one. `write_fencing` guards the registry's
            # SQL predicates — the half whose failure lets a superseded VM
            # publish a stale snapshot over a live one and then delete the
            # snapshot the live one is running from. `execution_arbitration`
            # guards binding arbitration — the half whose failure sends traffic
            # to whichever node reported last. A single switch would let one
            # panicked flip turn off a half nobody meant to, and only one of the
            # two announces itself in traffic.
            #
            # The ConfigMap under them carries the release's *starting* values;
            # these environment variables exist so the rollback is a
            # `kubectl set env` rather than an edit to a mounted file, which is
            # the difference between seconds and a ConfigMap round trip during
            # an incident. Both are read once at start-up, so either way is a
            # rollout — the environment simply wins.
            - name: SCHEDULER_REGISTRY_WRITE_FENCING
              valueFrom:
                configMapKeyRef:
                  name: execution-fencing-config
                  key: SCHEDULER_REGISTRY_WRITE_FENCING
                  optional: true
            - name: SCHEDULER_ROUTING_EXECUTION_ARBITRATION
              valueFrom:
                configMapKeyRef:
                  name: execution-fencing-config
                  key: SCHEDULER_ROUTING_EXECUTION_ARBITRATION
                  optional: true
            # The scheduler's half of the routing projection's write side:
            # whether a node's TTL budget is honoured, whether a heartbeat may
            # leave an existing deadline alone, and whether a pause or delete
            # event removes a record instead of being logged and dropped.
            #
            # 🔴 `off` here is not "the new code is inactive" — it is the whole
            # of the old behaviour, and it has to stay reachable in one flip:
            # every record goes back to binding_ttl within one heartbeat, with
            # no rollback logic of its own to run, because the path a rollback
            # takes is the branch that shipped before this.
            #
            # 🔴 Turning it on and off is safe in either order with respect to
            # the gateway's GATEWAY_ROUTING_PROJECTION_AUTHORITATIVE, and that
            # is by design: scheduler-first means a resume's record is installed
            # by the heartbeat repair path up to 5s late with the right TTL;
            # gateway-first means one redundant write carrying a TTL this
            # process ignores. Neither intermediate state is a new system.
            - name: SCHEDULER_ROUTING_PROJECTION_AUTHORITATIVE
              valueFrom:
                configMapKeyRef:
                  name: routing-projection-config
                  key: SCHEDULER_ROUTING_PROJECTION_AUTHORITATIVE
                  optional: true
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9101
          readinessProbe:
            exec:
              command:
                - /grpc_health_probe
                - -addr=127.0.0.1:9090
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /grpc_health_probe
                - -addr=127.0.0.1:9090
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: scheduler-config
              mountPath: /config/scheduler.json
              subPath: scheduler.json
              readOnly: true
      volumes:
        - name: scheduler-config
          configMap:
            name: scheduler-k8s-config
