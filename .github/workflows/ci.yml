name: AENV CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.rs"
      - "tests/fixtures/**"
      - "Makefile"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/install.sh"
      - "scripts/run-with-capabilities.sh"
      - "scripts/tests/setup-ublk-access.sh"
      - "scripts/tests/verify-capability-runner.sh"
      - "scripts/tests/verify-install-service.sh"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
  push:
    paths:
      - "**.rs"
      - "tests/fixtures/**"
      - "Makefile"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/install.sh"
      - "scripts/run-with-capabilities.sh"
      - "scripts/tests/setup-ublk-access.sh"
      - "scripts/tests/verify-capability-runner.sh"
      - "scripts/tests/verify-install-service.sh"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          components: rustfmt
          install_ci_deps: "false"
      - name: Formatting
        run: make fmt

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
        with:
          components: clippy
      - name: Clippy
        run: make clippy

  unit-tests:
    # Ubuntu 24.04's Linux 6.17 kernel can crash in ublk ADD_DEV.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
      - name: Configure ublk test host
        run: sudo scripts/tests/setup-ublk-access.sh "$(id -un)" "$(id -gn)"
      - name: Unit tests
        run: make test-unit PROFILE=debug

  # The paused-sandbox registry decides which node may bring a sandbox back, and
  # every one of those decisions is a SQL predicate — which row a statement
  # matches, and which it deliberately does not. None of it can be checked
  # without a real database, so this job exists to give it one.
  #
  # It is its own job rather than a step in unit-tests because `make test-unit`
  # builds only the lib target and cannot reach `tests/paused_registry.rs`. That
  # is how these tests came to be in the tree without any workflow running them.
  paused-registry-tests:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: aenv_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-ci-setup
      - name: Paused registry tests
        env:
          AENV_PAUSED_REGISTRY_TEST_DSN: postgres://postgres:verify@127.0.0.1:5432/aenv_registry
        # The target sets AENV_PAUSED_REGISTRY_TEST_REQUIRED itself, so a DSN
        # that goes missing here fails the job instead of skipping the file.
        run: make test-paused-registry
