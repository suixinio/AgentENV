syntax = "proto3";

package scheduler.v1;

option go_package = "agentenv/services/api/proto;schedulerv1";

service Scheduler {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc LookupNode(LookupNodeRequest) returns (LookupNodeResponse);
  rpc RecordAssignment(RecordAssignmentRequest) returns (RecordAssignmentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportSandboxEvent(ReportSandboxEventRequest) returns (ReportSandboxEventResponse);
  rpc ListObservedNodes(ListObservedNodesRequest) returns (ListObservedNodesResponse);
  rpc ListP2pPeers(ListP2pPeersRequest) returns (ListP2pPeersResponse);
  rpc RecordP2pArtifact(RecordP2pArtifactRequest) returns (RecordP2pArtifactResponse);
  rpc ForgetP2pArtifact(ForgetP2pArtifactRequest) returns (ForgetP2pArtifactResponse);
  rpc LookupP2pArtifact(LookupP2pArtifactRequest) returns (LookupP2pArtifactResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);
  rpc ListRegistrySandboxes(ListRegistrySandboxesRequest) returns (ListRegistrySandboxesResponse);
}

message Node {
  string node_id = 1;
  string endpoint = 2;
}

// ScheduleRequestHint carries structured information parsed from the incoming
// request so the scheduler can make a more informed placement decision. Only
// request types that benefit from scheduling hints are represented; other
// requests omit the hint entirely.
message ScheduleRequestHint {
  oneof kind {
    NewColdSandboxHint new_cold_sandbox = 1;
    NewSandboxHint new_sandbox = 2;
  }
}

// NewColdSandboxHint describes a POST /sandboxes-cold request.
message NewColdSandboxHint {
  uint32 cpu_count = 1;
  uint64 memory_mb = 2;
  // OCI image references involved in the cold start: the rootfs image plus any
  // attached-drive images.
  repeated string images = 3;
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 4;
}

// NewSandboxHint describes a POST /sandboxes request.
message NewSandboxHint {
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 1;
}

message ScheduleRequest {
  reserved 1;  // formerly: string hint = 1
  ScheduleRequestHint hint = 2;
}

message ScheduleResponse {
  Node node = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message LookupNodeRequest {
  string sandbox_id = 1;
}

// SandboxLocation says how the scheduler arrived at the node it names, which is
// what decides whether that node is known to hold the sandbox or has merely
// been chosen to rebuild it.
//
// The distinction matters to the caller: a node that already holds the sandbox
// also holds its binding, while a node that was picked or pinned holds neither
// and has to have the assignment recorded against it as soon as it answers.
enum SandboxLocation {
  // The scheduler did not classify this answer. Only an older scheduler
  // produces it; it is equivalent to BOUND, since that is all a scheduler
  // without the registry could ever answer.
  SANDBOX_LOCATION_UNSPECIFIED = 0;
  // A node is known to hold the sandbox — from its binding, from the roster it
  // reported in its last heartbeat, or from a registry row that names it as
  // the holder.
  SANDBOX_LOCATION_BOUND = 1;
  // The registry has the sandbox paused with its snapshot published, so any
  // node can rebuild it. The node named here is a placement decision, taken
  // with origin_node_id as a soft preference so the layers already on that
  // machine get reused when it can still take work.
  SANDBOX_LOCATION_PLACED = 2;
  // The registry has the sandbox parked on origin_node_id with no snapshot in
  // shared storage (publishing, or local_only after a failed upload). The only
  // copy is on that machine's disk, so the answer is that node or nothing.
  SANDBOX_LOCATION_PINNED = 3;
}

message LookupNodeResponse {
  Node node = 1;
  SandboxLocation location = 2;
  // The node that holds the sandbox's local artifacts, as the registry records
  // it. Carried whenever the answer came from a registry row — for PLACED it is
  // the preference the placement was taken against, which may or may not be the
  // node above.
  string origin_node_id = 3;
}

message RecordAssignmentRequest {
  string sandbox_id = 1;
  Node node = 2;
}

message RecordAssignmentResponse {}

message MachineInfo {
  string cpu_family = 1;
  string cpu_model = 2;
  string cpu_model_name = 3;
  string cpu_architecture = 4;
  string cpu_config_json = 5;
}

message DiskMetric {
  string mount_point = 1;
  string device = 2;
  string filesystem_type = 3;
  uint64 used_bytes = 4;
  uint64 total_bytes = 5;
}

// NodeStatus describes the effective state of a node as derived by the
// scheduler from its discovery state and heartbeat history.
//
//   active  + heartbeat OK      → READY        — accepts new sandboxes
//   active  + no heartbeat      → CONNECTING    — discovered but not yet confirmed
//   active  + heartbeat timeout → UNHEALTHY     — heartbeat lost
//   lingering + heartbeat OK    → LINGERING     — terminating, draining existing work
//   lingering + no heartbeat    → CONNECTING    — terminating, never confirmed
//   lingering + heartbeat timeout → UNHEALTHY   — terminating, heartbeat lost
//
// DRAINING is different in kind from the rows above: it is not derived, it is
// what the node itself reports after being isolated through its own admin API.
// A node reports it while it is still perfectly healthy, so it never overrides
// a derived status — LINGERING and UNHEALTHY both win over it, because a pod
// that is going away, or a node that stopped answering, is the stronger fact.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_READY = 1;
  NODE_STATUS_CONNECTING = 2;
  NODE_STATUS_UNHEALTHY = 3;
  NODE_STATUS_LINGERING = 4;
  // Node-reported isolation: serving existing sandboxes, refusing new work.
  NODE_STATUS_DRAINING = 5;
}

message NodeSnapshot {
  NodeStatus status = 1;
  uint32 allocated_cpu = 2;
  uint64 allocated_memory_bytes = 3;
  uint32 cpu_percent = 4;
  uint32 cpu_count = 5;
  uint64 memory_used_bytes = 6;
  uint64 memory_total_bytes = 7;
  repeated DiskMetric disks = 8;
  uint32 sandbox_count = 9;
  uint32 sandbox_starting_count = 10;
  uint64 create_successes = 11;
  uint64 create_fails = 12;
  int64 reported_at_unix_ms = 13;
  // Paused-sandbox resource accounting. These are *not* included in
  // sandbox_count, allocated_cpu, or allocated_memory_bytes — those report the
  // active running set only. Paused sandboxes have released their VM-side
  // CPU / memory but still own persisted state on the node, so the scheduler
  // can use these fields (together with the active fields) to apply
  // "including paused" capacity limits.
  uint32 paused_sandbox_count = 14;
  uint32 paused_allocated_cpu = 15;
  uint64 paused_allocated_memory_bytes = 16;
}

message P2pEndpoint {
  string backend = 1;
  string address = 2;
}

message ObservedNode {
  string node_id = 1;
  string endpoint = 2;
  string cluster_id = 3;
  string service_instance_id = 4;
  string version = 5;
  string commit = 6;
  MachineInfo machine_info = 7;
  NodeSnapshot snapshot = 8;
  int64 last_seen_unix_ms = 9;
}

message HeartbeatRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  string version = 4;
  string commit = 5;
  MachineInfo machine_info = 6;
  NodeSnapshot snapshot = 7;
  repeated string sandbox_ids = 8;
  P2pEndpoint p2p_endpoint = 9;
}

message HeartbeatResponse {
  string cpu_config_json = 1;
}

enum SandboxEventType {
  SANDBOX_EVENT_TYPE_UNSPECIFIED = 0;
  SANDBOX_EVENT_TYPE_CREATE = 1;
  SANDBOX_EVENT_TYPE_DELETE = 2;
  SANDBOX_EVENT_TYPE_PAUSE = 3;
  SANDBOX_EVENT_TYPE_RESUME = 4;
  // Fork events are reported once per child sandbox; sandbox_id and requested
  // resources refer to the child sandbox, not the source sandbox.
  SANDBOX_EVENT_TYPE_FORK = 5;
}

message SandboxEvent {
  string sandbox_id = 1;
  SandboxEventType event_type = 2;
  uint32 requested_cpu = 3;
  uint64 requested_memory_bytes = 4;
  uint64 requested_disk_bytes = 5;
}

message ReportSandboxEventRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  repeated SandboxEvent events = 4;
}

message ReportSandboxEventResponse {}

message ListObservedNodesRequest {
  string cluster_id = 1;
}

message ListObservedNodesResponse {
  repeated ObservedNode nodes = 1;
}

message P2pPeer {
  string node_id = 1;
  P2pEndpoint endpoint = 2;
}

message ListP2pPeersRequest {
  string cluster_id = 1;
  string backend = 2;
  string exclude_node_id = 3;
}

message ListP2pPeersResponse {
  repeated P2pPeer peers = 1;
}

message RecordP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message RecordP2pArtifactResponse {}

message ForgetP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message ForgetP2pArtifactResponse {}

message LookupP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string exclude_node_id = 4;
}

message LookupP2pArtifactResponse {
  repeated P2pPeer peers = 1;
}

message GetNodeRequest {
  string node_id = 1;
  string cluster_id = 2;
}

message GetNodeResponse {
  ObservedNode node = 1;
}

message UnregisterNodeRequest {
  string node_id = 1;
  string service_instance_id = 2;
}

message UnregisterNodeResponse {}

// RegistrySandbox is one row of the node-owned `paused_sandboxes` table, read
// only. The scheduler never writes this table; every value here is what the
// nodes agreed on among themselves.
message RegistrySandbox {
  string sandbox_id = 1;
  string cluster_id = 2;
  // One of publishing, paused, resuming, local_only, running. Carried as a
  // string rather than an enum because the set is pinned by a CHECK constraint
  // the nodes own: a value this build has not heard of has to survive the trip
  // to an operator's screen, not be flattened to UNSPECIFIED.
  string state = 3;
  int64 generation = 4;
  // The node holding the local artifacts. A claim deliberately leaves this
  // pointing at the previous holder, so it is not the answer to "who owns this
  // row now" — holder_node_id is.
  string origin_node_id = 5;
  // The node bringing the sandbox back up. Only set while state is resuming.
  string claimed_by_node_id = 6;
  // Empty while publishing, and while local_only after a failed upload.
  string snapshot_id = 7;
  int64 paused_at_unix_ms = 8;
  int64 updated_at_unix_ms = 9;
  // 0 means the column is NULL, which the nodes treat as already expired.
  int64 lease_expires_at_unix_ms = 10;
  // 0 means the column is NULL, which never matches a reclaim condition.
  int64 sandbox_expires_at_unix_ms = 11;
  // The node this row makes authoritative: claimed_by_node_id when resuming,
  // origin_node_id otherwise. Derived, not stored.
  string holder_node_id = 12;
}

message ListRegistrySandboxesRequest {
  // Optional exact-match filter on state.
  string state = 1;
  // Optional filter on holder_node_id.
  string node_id = 2;
  // 0 means no limit.
  int32 page_size = 3;
  // The next_page_token of the previous response.
  string page_token = 4;
}

message ListRegistrySandboxesResponse {
  repeated RegistrySandbox sandboxes = 1;
  // Empty when the last page has been returned.
  string next_page_token = 2;
  // The database clock the rows were read against. Every lease field above is
  // only meaningful relative to this, never to the reader's own clock.
  int64 database_now_unix_ms = 3;
}
