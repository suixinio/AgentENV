[package]
name = "aenv-core"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = [
    ".",
    "adev",
    "crates/aenv",
    "crates/aenv-api",
    "crates/aenv-egress",
    "crates/aenv-node",
    "crates/benchmarks",
    "crates/e2e-tests",
    "crates/linux-cap",
    "crates/observability",
    "crates/object-store-operator",
    "crates/test-support",
    "crates/shell-util",
    "crates/warm-pool",
    "src/api/generated",
    "src/custom_extension_api/generated",
    "thirdparty/firecracker-client",
    "thirdparty/envd",
    "storage/util",
    "storage/overlaybd",
    "storage/ublk",
    "storage/ublk-daemon",
]

[workspace.package]
version = "0.1.2"

[lib]
name = "aenv_core"
path = "src/lib.rs"

[features]
vendored-openssl = ["dep:openssl-sys", "openssl-sys/vendored"]
# 🔴 Test scaffolding this crate's *siblings* need, and that nothing ships.
#
# `aenv-node` and `aenv-api` are separate crates now, so their tests are not
# `cfg(test)` in here: anything of this crate's that only a test uses —
# `p2p::mock`, `logging::capture`, `RunnableSnapshot::mock`, the ACR fake
# registry — is invisible to them unless it is compiled unconditionally.
# Compiling it unconditionally would put a fake registry server in the
# shipped binary, so it goes behind this instead, enabled from those crates'
# `[dev-dependencies]` only. Cargo's v2 resolver does not unify a
# dev-dependency's features into a normal build, so `cargo build` is
# unaffected.
test-support = []

[dev-dependencies]
# 🔴 A dev-dependency on this crate itself, and the only way to say "turn
# `test-support` on when *this* crate is the one under test". Without it,
# `cargo test -p aenv-core` resolves a different feature set than
# `cargo test -p aenv-core -p aenv-node` does (the siblings' dev-dependencies
# ask for the feature), and cargo rebuilds the entire dependency graph a
# second time whenever a developer alternates between the two.
aenv-core = { path = ".", features = ["test-support"] }
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies]
envd = { version = "0.1.0", path = "thirdparty/envd" }
custom_extension_client = { version = "0.1.0", path = "src/custom_extension_api/generated" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
opendal = { version = "0.55.0", features = ["services-s3"] }
object-store-operator = { path = "crates/object-store-operator" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tower = "0.5.2"
anyhow = "1.0.100"
tempfile = "3.22.0"
nix = { version = "0.31", features = ["sched", "mount", "fs", "signal", "user", "resource", "uio", "socket", "net"] }
libc = "0.2"
ipnetwork = "0.21"
futures = "0.3"
tonic = "0.14.2"
tonic-prost = "0.14.2"
prost = "0.14.3"
prost-types = "0.14.3"
thiserror = "2.0.18"
uuid = { version = "1", features = ["serde", "v7"] }
toml = "0.9.11"
confique = { version = "0.4.0", features = ["toml"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
agentenv-observability = { path = "crates/observability" }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
agentenv_http_server = { path = "src/api/generated" }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = [
    "cookie",
    "query",
    "typed-header",
] }
bytes = "1"
headers = "0.4"
http = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2.5"
clap = { version = "4", features = ["derive"] }
shell-util = { path = "crates/shell-util" }
linux-cap = { path = "crates/linux-cap" }
warm-pool = { path = "crates/warm-pool" }
dashmap = "6.1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
semver = "1"
iroh = { version = "=1.0.0-rc.0" }
iroh-blobs = { version = "=0.101.0" }
rand = "0.10"
zeroize = "1"
openssl-sys = { version = "0.9", optional = true }
redis = { version = "1.6.0", features = ["tokio-comp", "script", "connection-manager"] }
# `src/node_registry/kubernetes_discovery.rs` runs the EndpointSlice/Pod
# informers that seed `aenv-api`'s node registry. `kube`'s default TLS backend
# is rustls; `openssl-tls` (backed by `hyper-openssl`) is selected explicitly
# instead, for the same reason
# `crates/aenv-api`'s `sqlx` entry picks `tls-native-tls`: `reqwest` already
# resolves to native-tls/openssl by default, and a second TLS stack in the same
# binary is exactly what that comment argues against. `crates/aenv` is the
# documented exception that uses rustls on purpose; this is not it. `v1_34`
# pins a specific Kubernetes API generation rather than tracking `k8s-openapi`'s
# `latest` feature, matching how Firecracker/kernel versions are pinned in
# `config/deps_manifest.toml` rather than floated.
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "openssl-tls"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

