apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentenv-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - redis.yaml
  - scheduler-service.yaml
  - scheduler-deployment.yaml
  - scheduler-pdb.yaml
  - gateway-service.yaml
  - gateway-deployment.yaml
  - agentenv-headless-service.yaml
  - agentenv-ublk-daemon-metrics-service.yaml
  - agentenv-daemonset.yaml
  # The deciding half (阶段 3a). Listed here so it is part of what `kustomize
  # build` renders and therefore part of any drift baseline — but 🔴 introduced
  # to a live cluster with `kubectl apply -f` on these three files alone
  # (`_sd-impl-phase3-role.md` §10.2 step 3). They are pure additions and
  # intersect none of the cluster's known drift; a full `apply -k` does, and
  # silently.
  - agentenv-api-deployment.yaml
  - agentenv-api-service.yaml
  - agentenv-api-pdb.yaml

configMapGenerator:
  # 🔴 The cluster's own name, in one place because two sides have to agree on
  # it and neither can tell that they do not. The node stamps this id on every
  # paused-sandbox row it writes; the scheduler scopes every registry read,
  # every registry write and the reclamation timer to it. Set them apart and
  # nothing fails: the scheduler simply serves a cluster that has no rows, and
  # the rows the nodes are writing are reclaimed by nobody.
  #
  # It is not a credential — it is a name — so it belongs here rather than in
  # the Secret it used to be read from, where nothing created it and the write
  # surface came up cold on every fresh cluster with one error line to say so.
  #
  # Keep it in step with `[node_identity].cluster_id` in config/default.toml,
  # which is what a node falls back to if this ConfigMap is ever missing.
  # `services/shared/config` has a test that fails if the two drift apart.
  - name: cluster-identity-config
    literals:
      - CLUSTER_ID=00000000-0000-0000-0000-000000000000
  # 🔴 config/agentenv.toml is NOT in this repository, and that is deliberate.
  # `deploy/k8s/run.sh` copies the whole of deploy/k8s into a temp directory and
  # writes it there from config/default.toml (run.sh:30) before invoking
  # kustomize, so the node's TOML and the repo's own default can never be two
  # different files. That is also why editing this ConfigMap in a live cluster
  # is undone by the next apply — see the note on AENV_PAUSED_REGISTRY_BACKEND
  # in agentenv-daemonset.yaml, and the one on [orchestrator.paused_registry]
  # in config/default.toml.
  #
  # Consequence: `kubectl kustomize deploy/k8s/base` fails on a clean checkout,
  # and always has — this tree is not a kustomize entry point. Render or apply
  # through `make k8s-render` / `make k8s-apply` (or `bash deploy/k8s/run.sh
  # render|apply|delete`), which also selects an overlay; base is only ever
  # consumed as `resources: [../../base]` from one of them.
  - name: agentenv-k8s-config
    files:
      - config/agentenv.toml
  - name: scheduler-k8s-config
    files:
      - config/scheduler.json
  - name: gateway-k8s-config
    files:
      - config/gateway.json
  - name: sandbox-proxy-config
    literals:
      - SANDBOX_PROXY_DOMAINS=
  # The three switches of the incarnation work, in one place because the
  # release sequence flips them one at a time and an operator has to be able to
  # see all three at once.
  #
  # 🔴 They are three settings, not one. "Is fencing off" has no single answer:
  #   · SCHEDULER_REGISTRY_WRITE_FENCING guards the registry's SQL predicates
  #     — the half whose failure loses a workspace;
  #   · SCHEDULER_ROUTING_EXECUTION_ARBITRATION guards binding arbitration
  #     — the half whose failure routes to whichever node reported last;
  #   · GATEWAY_ROUTING_EXECUTION_FENCING guards the gateway's refusal.
  # Merging any two would let one panicked flip switch off a half nobody meant
  # to, and two of the three failures are silent.
  #
  # The values here are the *starting* state of the release, not the end state.
  # The code defaults to the end state — a default of "observe" would leave
  # clusters parked there with nobody aware they were never flipped — so the
  # caution belongs here and in the runbook, where somebody is watching.
  - name: execution-fencing-config
    literals:
      # A3 is on from the moment the scheduler carrying it starts: it is the
      # reason the release exists, and the rows it protects are the ones that
      # cannot be reconstructed.
      - SCHEDULER_REGISTRY_WRITE_FENCING=true
      # Arbitration starts by observing. It is flipped to `enforce` once
      # heartbeat_legacy_roster_total has reached zero — while it has not, some
      # node is still too old to report incarnations and arbitration would be
      # refusing writes it cannot judge.
      - SCHEDULER_ROUTING_EXECUTION_ARBITRATION=observe
      # The gateway goes out injecting the control-plane token and refusing
      # nothing. It moves to `observe` only after the node-side gate has been
      # switched on and verified, and to `enforce` after that.
      - GATEWAY_ROUTING_EXECUTION_FENCING=off
  # The routing projection's three switches — two logical ones, split across two
  # processes, so three environment variables. Kept apart from the fencing
  # ConfigMap above because they belong to a different change and are flipped on
  # a different day; an operator reading either one should see one release.
  #
  # 🔴 All three start `off`, and here the code agrees with the ConfigMap
  # instead of contradicting it. The three above default to their end state
  # because a cluster parked in `observe` was the failure that release feared.
  # These are the opposite case: switching the write side on gives
  # ReportSandboxEvent — which every node is already sending — the power to
  # delete routing records, so a cluster that rolled the image without asking
  # for it would acquire that at the next pod restart. `off` is the only safe
  # code default, and the ConfigMap simply says so out loud.
  #
  # Order to flip them in: the two write-side switches first, in either order,
  # then the read switch. Rolling back is `kubectl set env` on the Deployment,
  # which rolls it and is loud — editing this ConfigMap in a live cluster does
  # nothing until something restarts the pods, and is undone by the next apply.
  #
  # 🔴 GATEWAY_ROUTING_PROJECTION_READ additionally requires
  # GATEWAY_REDIS_ADDR to be set on the gateway Deployment (it is, from the
  # start) and requires SCHEDULER_ROUTING_EXECUTION_ARBITRATION above to be
  # anything other than `off`.
  - name: routing-projection-config
    literals:
      - SCHEDULER_ROUTING_PROJECTION_AUTHORITATIVE=off
      - GATEWAY_ROUTING_PROJECTION_AUTHORITATIVE=off
      - GATEWAY_ROUTING_PROJECTION_READ=off
  # 阶段 3a, in two keys: which upstream the gateway sends user-facing REST to,
  # and who wakes a paused sandbox the routing projection has no answer for.
  #
  # 🔴 This ConfigMap *is* 3a's switch, and its rollback. Both keys ship empty,
  # which is today's behaviour exactly: REST fans out to whichever node the
  # scheduler names, and that node wakes the sandbox itself. Turning 3a on is
  # putting `http://agentenv-api:8000` and `agentenv-api:8002` here (or, for one
  # gateway at a time, `kubectl set env`); rolling it back is emptying them
  # again and rolling the gateway — seconds, and **the DaemonSet is not
  # touched**, which is the entire reason 3a exists as a separate step from 3b
  # (`_sd-impl-phase3-role.md` §11.1, §11.2).
  #
  # 🔴 The empty values in `config/gateway.json` are load-bearing, not
  # decoration. An environment variable set to the empty string is *ignored* by
  # the config loader — that is what makes `kubectl set env FOO=` a clear rather
  # than a set — so the off position always comes from the mounted file. Turn 3a
  # on here or with `set env`; never by editing `resume_addr` /
  # `rest_upstream_addr` in gateway.json to a real address, because then no
  # environment value can turn it off again and the rollback becomes a manifest
  # edit under incident pressure. `services/shared/config` has a test that
  # pins both halves of this.
  - name: api-upstream-config
    literals:
      - GATEWAY_REST_UPSTREAM_ADDR=
      - GATEWAY_RESUME_ADDR=
  # 🔴 There was a third switch here — node-service-config, carrying
  # AENV_NODE_SERVICE_ENABLED — and it is gone rather than set to `false`. It
  # was meant to let `--role all` serve the node sandbox service, but nothing in
  # the Rust tree ever read the variable, and HEAD decides against that design
  # outright (`only_the_split_roles_bind_a_second_listener` in
  # `src/bin/server.rs`). Because it was read by every node in the fleet, the
  # runbooks costed flipping it at a serial DaemonSet roll with a drain per
  # machine — paid for a behaviour change that could not happen. Its absence is
  # scanned for by `no_manifest_sets_a_node_service_gate_nothing_reads`
  # (`src/cfg.rs`); `deploy/k8s/base/agentenv-daemonset.yaml` carries the long
  # form of why. Giving the api half a machine to drive is a `--role node`
  # DaemonSet, not a ConfigMap key.

  # 阶段 2c's two knobs: which catalog the node writes, and which one it reads.
  #
  # 🔴 These values are the cluster's *current, verified* state, not an off
  # position waiting to be flipped. Both halves have been running
  # `both`/`postgres` since 2c was accepted; they simply were not in this
  # repository, having been set with `kubectl set env` on the live objects. That
  # made every `apply -k` a silent rollback: the literal env disappears, the
  # process falls back to `[snapshot.catalog]`'s `object_store`/`object_store`
  # (src/cfg.rs), and the cluster ends up reading two different catalogs — the
  # AgentENV halves from object storage, the scheduler from PostgreSQL — with
  # nothing failing anywhere. Reads of a store that has the rows and reads of a
  # store that does not both answer; one of them answers "no such snapshot", and
  # callers delete artifacts and refuse resumes on absence.
  #
  # So writing `off` here would not be the cautious choice, it would *be* the
  # bug: the first apply after it would perform exactly the regression this
  # ConfigMap exists to stop.
  #
  # 🔴 Environment, not `config/agentenv.toml`, for the reason
  # AENV_PAUSED_REGISTRY_BACKEND is: `deploy/k8s/run.sh` overwrites that file
  # from config/default.toml on every apply (run.sh:30), so a cluster that said
  # this in the ConfigMap would lose it on the next one. `src/cfg.rs` carries the
  # same note on the two `env =` attributes.
  #
  # 🔴 They are two keys and they roll separately — adding the second copy and
  # starting to trust it are different decisions with different ways back — and
  # only some pairs are legal. `AppConfig::validate_snapshot_catalog` refuses
  # write=object_store with read=postgres (reading a table nothing writes) at
  # startup rather than correcting it. That refusal is also what makes the
  # `optional: true` on both references safe: lose this whole ConfigMap and both
  # keys fall back together to object_store/object_store, which is legal and
  # merely old; lose only WRITE and the pair is illegal and the Pod says so.
  # There is no way to lose one of these quietly in the dangerous direction.
  #
  # Rolling back is `read`, then `write`, in that order, and never the reverse:
  # object storage stays a complete copy for as long as `write` says `both`.
  #
  # 🔴 One-time cost on the cluster that is already running these out of band:
  # the next `apply -k` there does not merge, it is **rejected**. The live
  # objects carry these as `value:` literals that no `last-applied-configuration`
  # mentions, so the three-way merge keeps the literal and adds the reference,
  # and an env var holding both `value` and `valueFrom` fails API validation.
  # That is the loud direction and it costs nothing to be in, but it does not
  # clear itself. Clear it with one in-place patch per workload, replacing each
  # literal entry with the reference below, and then apply — do **not** reach for
  # `kubectl set env …-` to delete the literals first, because that rolls both
  # halves onto the object_store defaults for the length of the roll, which is
  # the outage this ConfigMap exists to prevent.
  - name: snapshot-catalog-config
    literals:
      - AENV_SNAPSHOT_CATALOG_WRITE=both
      - AENV_SNAPSHOT_CATALOG_READ=postgres

images:
  - name: agentenv-gateway
    newName: agentenv-gateway
    newTag: latest
  - name: agentenv-scheduler
    newName: agentenv-scheduler
    newTag: latest
  - name: agentenv-runtime
    newName: agentenv-runtime
    newTag: latest

generatorOptions:
  disableNameSuffixHash: true
