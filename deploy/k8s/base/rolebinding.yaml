# 阶段 4/Stage E: the `agentenv-scheduler-discovery` RoleBinding this file
# used to also declare (binding `role.yaml`'s `agentenv-scheduler-discovery`
# Role to the now-deleted `agentenv-scheduler` ServiceAccount) is removed
# along with the Go scheduler. The Role itself stays — reused below by
# `agentenv-api`'s own binding, and its name outlived the workload it was
# originally written for the same way `agentenv-nodes` (the headless
# Service) did.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentenv-api-discovery
subjects:
  - kind: ServiceAccount
    name: agentenv-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentenv-scheduler-discovery
