apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agentenv-node
  labels:
    app.kubernetes.io/name: agentenv-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-node
  # 🔴 maxSurge must stay 0 (the DaemonSet default, made explicit here because
  # correctness depends on it). A node releases the sandboxes its previous
  # process died holding by node identity, at startup, on the premise that the
  # previous process on this machine is gone — which is exactly what "old pod
  # fully terminated before the new one starts" guarantees. Surging the two
  # pods together breaks that premise: the new pod would hand the old pod's
  # still-running sandboxes to whoever resumes them next, and both copies would
  # then diverge from the same snapshot.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-node
    spec:
      terminationGracePeriodSeconds: 3600
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: agentenv
          image: agentenv-runtime:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AENV_CONFIG_PATH
              value: /workspace/config/agentenv.toml
            - name: AENV_SANDBOX_ACCESS_TOKEN_HASH_SEED
              valueFrom:
                secretKeyRef:
                  name: agentenv-runtime-secrets
                  key: sandbox-access-token-hash-seed
                  optional: true
            # Both halves of the cluster-wide paused-sandbox registry are
            # optional so a cluster that has not set it up still starts: with
            # neither of them the node keeps the `local` backend from
            # config/default.toml and pauses stay node-local.
            #
            # 🔴 The backend is selected here rather than in the ConfigMap.
            # `deploy/k8s/run.sh` overwrites config/agentenv.toml from
            # config/default.toml on every apply, so a ConfigMap edit would be
            # undone by the next `make k8s-apply` — silently, and in the
            # direction that loses cross-node recovery. Set this key to
            # "central" in an overlay patch; the scheduler endpoint below is the
            # only other thing that backend needs, and the node carries no
            # database credentials of its own.
            - name: AENV_PAUSED_REGISTRY_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: paused-registry-config
                  key: AENV_PAUSED_REGISTRY_BACKEND
                  optional: true
            - name: AENV_VIRTUALIZATION_MODE
              value: "kvm"
            - name: API_ADDR
              value: "0.0.0.0:8000"
            - name: AENV_UBLK_DAEMON_BINARY_PATH
              value: /usr/local/bin/uvm-ublk-daemon
            - name: AENV_UBLK_DAEMON_METRICS_LISTEN_ADDR
              value: "0.0.0.0:9103"
            # The cluster's name for the machine, not the pod's. This ID is
            # what a paused sandbox's registry row records as its holder and
            # what the node must still match to renew that row's lease; a pod
            # name changes on every pod recreation, so a restarted node would
            # stop matching its own rows and the leases on every sandbox parked
            # on it would lapse for good. Must stay in step with the scheduler's
            # discovery, which names nodes the same way.
            - name: AENV_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The cluster this node's registry rows belong to, read from the
            # same ConfigMap key the scheduler scopes its registry to. A node
            # stamping one cluster id while the scheduler serves and reclaims
            # another is not an error anywhere: the rows are written, and then
            # nobody the node talks to can see them.
            #
            # Optional because a node falls back to `[node_identity].cluster_id`
            # in config/default.toml, which carries the same value — the
            # ConfigMap is where a deployment changes it, the file is what it
            # changes from.
            - name: AENV_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-identity-config
                  key: CLUSTER_ID
                  optional: true
            - name: AENV_OBSERVABILITY_SCHEDULER_REPORT_ENABLED
              value: "true"
            - name: AENV_OBSERVABILITY_SCHEDULER_ENDPOINT
              value: http://agentenv-scheduler:9090
            # Where the control-plane credential is read from, re-read while
            # the process runs. 🔴 Mounted as a volume, never as a
            # secretKeyRef environment variable: kubelet refreshes volumes and
            # does not refresh env, and this node's graceful shutdown pauses
            # every sandbox it holds — so a rollback that needs a restart is a
            # rollback nobody will reach for.
            - name: AENV_API_CONTROL_PLANE_TOKEN_FILE
              value: /etc/agentenv/control-plane/token
            - name: AENV_SANDBOX_PROXY_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: sandbox-proxy-config
                  key: SANDBOX_PROXY_DOMAINS
                  optional: true
          ports:
            - name: http
              containerPort: 8000
            - name: ublk-metrics
              containerPort: 9103
          resources:
            requests:
              # Kubernetes derives oom_score_adj from requests.memory:
              #   oom_score_adj = 1000 - 1000 * (requests.memory / node_capacity)
              # Without this, requests.memory defaults to 0 and oom_score_adj is
              # set to 1000, the same as firecracker child processes, offering no
              # protection. Setting some value ensures the agentenv container gets an
              # oom_score_adj well below 1000, so it is killed after firecracker
              # child processes (whose oom_score_adj we explicitly set to 1000) when
              # the host runs out of memory. Change this value accordingly.
              memory: 8Gi
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - "-c"
                  - |
                    # Stop taking new sandboxes first. The pod is already
                    # Terminating, so the scheduler's discovery will drop it
                    # too, but that is an outside signal on its own clock —
                    # this one is immediate, and it is the one the node itself
                    # acts on when deciding whether to serve a resume.
                    # X-Admin-Token, not X-API-Key: the node status endpoint is
                    # declared with AdminApiKeyAuth, and a key sent under the
                    # wrong header is a 401 that the || below would swallow.
                    # 🔴 The control-plane credential travels with it. This
                    # script is itself a caller of the node's REST API, and its
                    # failures are swallowed by the || below — so a missing
                    # header here does not fail loudly, it just silently stops
                    # draining, and sandboxes keep landing on a node that is
                    # going away.
                    CONTROL_PLANE_TOKEN="$(cat /etc/agentenv/control-plane/token 2>/dev/null | head -n1)"
                    curl -sf -X POST -H 'X-Admin-Token: preStop' \
                      -H "x-agentenv-control-plane: ${CONTROL_PLANE_TOKEN}" \
                      -H 'Content-Type: application/json' \
                      -d '{"status":"draining"}' \
                      "http://localhost:8000/nodes/${AENV_NODE_ID}" \
                      && echo "preStop: node set to draining" \
                      || echo "preStop: failed to drain node, continuing"
                    echo "preStop: waiting for sandboxes to drain..."
                    while true; do
                      # GET /sandboxes is exempt from the gate (the gateway's
                      # cluster listing fans out to it without the credential),
                      # but send it anyway: the exemption is a property of the
                      # gate's list, not of this caller.
                      count=$(curl -sf -H 'X-API-Key: preStop' \
                        -H "x-agentenv-control-plane: ${CONTROL_PLANE_TOKEN}" \
                        http://localhost:8000/sandboxes | jq 'length') || count=""
                      if [ -z "$count" ]; then
                        echo "preStop: failed to query sandbox count, retrying..."
                        sleep 3
                        continue
                      fi
                      echo "preStop: $count sandbox(es) remaining"
                      if [ "$count" = "0" ]; then
                        echo "preStop: all sandboxes drained, exiting"
                        break
                      fi
                      sleep 3
                    done
            postStart:
              exec:
                command:
                  - /bin/sh
                  - "-c"
                  - |
                    # cgroup v2: disable group OOM kill for this container's cgroup.
                    # By default Kubernetes sets memory.oom.group=1, which means
                    # the entire cgroup (including the agentenv server) is killed
                    # whenever any process inside it is OOM-killed. Setting it to 0
                    # makes the OOM killer target individual processes, so a
                    # firecracker child being killed does not take down the server.
                    CGROUP="$(awk -F: '/^0::/{print $3}' /proc/self/cgroup)"
                    echo 0 > /sys/fs/cgroup/$CGROUP/memory.oom.group
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: agentenv-config
              mountPath: /workspace/config/agentenv.toml
              subPath: agentenv.toml
              readOnly: true
            - name: host-dev
              mountPath: /dev
            - name: control-plane-token
              mountPath: /etc/agentenv/control-plane
              readOnly: true
      volumes:
        - name: workspace
          hostPath:
            path: /var/lib/aenv
            type: DirectoryOrCreate
        - name: agentenv-config
          configMap:
            name: agentenv-k8s-config
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        # optional: an absent Secret mounts nothing, the node reads no
        # credential, and the gate stays off — which is the state this ships in.
        # Enabling the gate is writing this Secret; rolling it back is emptying
        # it. Neither restarts the pod.
        - name: control-plane-token
          secret:
            secretName: agentenv-control-plane-token
            optional: true
