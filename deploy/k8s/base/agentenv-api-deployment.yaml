# The deciding half of the split control plane: user-facing REST, sandbox
# ownership, placement. Same image as the node DaemonSet, told which half it is
# by `--role api` (`src/role.rs`).
#
# 🔴 This is the workload 阶段 3a brings up while the DaemonSet stays on
# `--role all`. Bringing it up is not what turns 3a on — the gateway's
# `rest_upstream_addr` is (see gateway-deployment.yaml). That separation is the
# whole of 3a's rollback story: an api Deployment that is running but that
# nothing is pointed at costs two idle pods, and pointing the gateway back at
# the nodes is one value change and a gateway roll, seconds, without touching
# the DaemonSet. 3b — the DaemonSet moving to `--role node` — is the expensive
# one to reverse, and nothing here may borrow from it
# (`_sd-impl-phase3-role.md` §11.1, §11.2).
#
# 🔴 `--role api` assembles now (`src/bin/server.rs::assemble_api`): the cluster
# metadata store, the remote backend factory and both gRPC listeners are wired.
# What it still refuses, and refuses loudly rather than half-doing, is a cold
# create (`POST /sandboxes-cold`) and resuming a paused sandbox whose capture
# lives on a machine this replica cannot ask to reopen it. Everything the
# gateway is pointed at in 3a works; those two are why 3a is a shadow rollout
# rather than the end of the split.
#
# 🔴 Building a template (`POST /v2/templates/{id}/builds/{id}`) is no longer
# on that list in code — `run_the_build_on_a_node` dispatches it to a node
# instead of refusing at the door — but it still cannot succeed in 3a as
# deployed here: dispatching needs a node serving `NodeSandboxService`, which
# is `--role node`, and 3a deliberately keeps the DaemonSet on `--role all`
# (see the 3b note above). This Deployment answering the build route is
# necessary and not sufficient; it starts working the moment 3b flips the
# DaemonSet, with no change to this file.
#
# 🔴 It also has one precondition no other workload in this tree has: the
# `agentenv-runtime-secrets` Secret must carry `sandbox-access-token-hash-seed`,
# because the reference below is `optional: false`. On a cluster without it the
# Pods stop at CreateContainerConfigError instead of starting. That is the
# intended behaviour and the reason is under the env var itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-api
  labels:
    app.kubernetes.io/name: agentenv-api
spec:
  # Two, because the point of this half is that no single replica owns a
  # sandbox: the ledger is in Redis and any replica can answer for any sandbox.
  # One replica would make every restart a control-plane outage while proving
  # none of that.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-api
    spec:
      # 🔴 60, not the DaemonSet's 3600. That number buys a node time to pause
      # and persist every sandbox it is running; this half runs none. Copying it
      # would make every api rollout take an hour to finish for no reason at
      # all, and would hide a hung shutdown behind a wait nobody watches.
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          # Preferred and not required: a single-node dev cluster must still be
          # able to place both replicas, and a hard rule there leaves one
          # Pending forever with the second replica's whole point — surviving
          # the loss of one machine — unavailable anyway.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: agentenv-api
      containers:
        - name: agentenv
          # 🔴 The same image as agentenv-daemonset.yaml, deliberately. One
          # binary, two roles: an api image that could drift from the node image
          # would mean the node gRPC contract has two sides built from two
          # commits, and nothing would report it.
          image: agentenv-runtime:latest
          imagePullPolicy: IfNotPresent
          # 🔴 The role travels as an argument rather than as AENV_ROLE, and the
          # asymmetry with the DaemonSet is intentional. `--role` wins over the
          # environment (`ServerRole::resolve`), so a Pod that must never be
          # anything else says so where an env edit cannot reach — and this Pod
          # must never be anything else: `--role all` here would run
          # `require_runtime_capabilities` and reach for /dev/kvm on a container
          # that has neither. The role that has to stay flippable is the
          # DaemonSet's (3b's rollback), and that one is not set here.
          args:
            - --role
            - api
          env:
            - name: AENV_CONFIG_PATH
              value: /workspace/config/agentenv.toml
            # 🔴 optional: false, and this is the one place in the tree where a
            # missing key must stop a Pod from starting.
            #
            # envd access tokens are HMAC(seed, sandbox_id). With no seed
            # configured the process invents a node-local one, which is
            # survivable for a single machine and silently corrupting for a
            # replicated half: replica A mints a token, the user holds it,
            # replica B derives a different one on the next GET or the next
            # resume, and the user's token stops working with no error, no log
            # and no metric anywhere (`_sd-impl-phase3-role.md` §9.2). A Pod
            # that will not start is the only failure mode of that fault that
            # anybody sees.
            #
            # The same Secret and the same key the DaemonSet reads, so one value
            # covers the cluster. `optional: true` there is deliberate and stays
            # that way: a single-node deployment with a generated seed works.
            - name: AENV_SANDBOX_ACCESS_TOKEN_HASH_SEED
              valueFrom:
                secretKeyRef:
                  name: agentenv-runtime-secrets
                  key: sandbox-access-token-hash-seed
                  optional: false
            # Where this replica's own ledger of active sandboxes lives.
            #
            # 🔴 Written out here rather than read from a ConfigMap the way the
            # node reads its paused-registry backend, because the two choices
            # are not alike. A node may legitimately be `local`/`in_memory` —
            # its records describe the machine it is on. An api replica may not:
            # `in_memory` would give each replica a private opinion about
            # sandboxes the others also answer for. `--role api` refuses to
            # start on `in_memory` rather than starting like that, and these two
            # lines are what it wants instead.
            - name: AENV_ORCHESTRATOR_STORE_BACKEND
              value: "redis"
            # 🔴 The one place in this tree that carries shared-store addressing
            # into an AgentENV process, and it is on purpose that it is this
            # workload. §0's second hard constraint of the split proposal:
            # the `node` role holds no shared-storage credentials. Every machine
            # that runs user code would otherwise hold the address and the
            # credentials of the cluster's ledger. Do not copy this line, or
            # AENV_ORCHESTRATOR_STORE_REDIS_URL in any form, into
            # agentenv-daemonset.yaml.
            #
            # The same Redis the scheduler's bindings and the gateway's routing
            # projection use (redis.yaml), under a key prefix of its own
            # (`agentenv:api`) that the store refuses to start with if it
            # overlaps `agentenv:scheduler:bindings:*`.
            - name: AENV_ORCHESTRATOR_STORE_REDIS_URL
              value: redis://agentenv-redis:6379
            # The cluster-wide registry of paused sandboxes, which this half
            # arbitrates: it claims rows, renews their leases, reconciles them
            # and discards them. `central` reaches it through the scheduler, so
            # no database credential lands here either.
            #
            # Not a configMapKeyRef, for the same reason as the store above: the
            # node's copy of this key may fall back to `local` and still be
            # correct, and this one may not. An api replica running a node-local
            # paused registry would arbitrate a registry only it can see.
            - name: AENV_PAUSED_REGISTRY_BACKEND
              value: "central"
            # 阶段 2c, the same two keys and the same ConfigMap the DaemonSet
            # reads. See the note on snapshot-catalog-config in
            # kustomization.yaml.
            #
            # 🔴 A configMapKeyRef here rather than the literals this half uses
            # for AENV_ORCHESTRATOR_STORE_BACKEND and
            # AENV_PAUSED_REGISTRY_BACKEND above, and the difference is real:
            # those two are settings where the api half's correct value differs
            # from the node's, so writing them out here says so. This pair is
            # the opposite — the two halves must hold the *same* value, and the
            # moment they can be edited apart somebody will edit one. The whole
            # cluster answers snapshot lookups from one catalog or it has a
            # split nothing reports.
            #
            # These were added to the live Deployment with `kubectl set env` when
            # 3a went out, which is why they are being written down now: until
            # they were in this file, the api half's copy of 2c's end state
            # survived exactly until the next `apply -k`.
            - name: AENV_SNAPSHOT_CATALOG_WRITE
              valueFrom:
                configMapKeyRef:
                  name: snapshot-catalog-config
                  key: AENV_SNAPSHOT_CATALOG_WRITE
                  optional: true
            - name: AENV_SNAPSHOT_CATALOG_READ
              valueFrom:
                configMapKeyRef:
                  name: snapshot-catalog-config
                  key: AENV_SNAPSHOT_CATALOG_READ
                  optional: true
            # Which durable snapshot repository this half reads and writes, and
            # where the half of its configuration that cannot be in this
            # repository comes from. Both keys, both workloads, one ConfigMap —
            # see the note on snapshot-storage-config in kustomization.yaml.
            #
            # 🔴 The same value as the DaemonSet, and a configMapKeyRef rather
            # than a literal for that reason: an api replica that resolved
            # snapshots from a different repository than the nodes would answer
            # "no such snapshot" for artifacts that are sitting in the bucket.
            #
            # 🔴 `optional: true` on both, and the pair is safe to lose
            # *together*: the overlay path goes unset, the backend falls back to
            # `config/agentenv.toml`'s `posix_fs`, and the Pod starts on an
            # empty local store. That is the one silent direction, and it takes
            # losing the whole ConfigMap. Losing either key alone is loud —
            # backend without the overlay refuses to start for want of
            # `[backend.oss]`, overlay without the backend still says `oss` in
            # the overlay file itself.
            - name: AENV_SNAPSHOT_REPOSITORY_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: snapshot-storage-config
                  key: AENV_SNAPSHOT_REPOSITORY_BACKEND
                  optional: true
            - name: AENV_CONFIG_OVERLAY_PATH
              valueFrom:
                configMapKeyRef:
                  name: snapshot-storage-config
                  key: AENV_CONFIG_OVERLAY_PATH
                  optional: true
            # The two node-local disk budgets, in GiB, read from a ConfigMap
            # because `config/agentenv.toml` does not survive an apply and
            # because they are sized for the smallest root disk in the fleet
            # (96 GiB on aenv-master-01), not for this machine. Losing them
            # falls back to config/default.toml's 100/100, which on that disk is
            # a budget the GC can never reach — see the note on
            # image-cache-config in kustomization.yaml.
            - name: AENV_IMAGE_CACHE_CAPACITY_GB
              valueFrom:
                configMapKeyRef:
                  name: image-cache-config
                  key: AENV_IMAGE_CACHE_CAPACITY_GB
                  optional: true
            - name: AENV_IMAGE_CACHE_REMOTE_BLOCKS_MAX_SIZE_GB
              valueFrom:
                configMapKeyRef:
                  name: image-cache-config
                  key: AENV_IMAGE_CACHE_REMOTE_BLOCKS_MAX_SIZE_GB
                  optional: true
            - name: API_ADDR
              value: "0.0.0.0:8000"
            # The data plane's wake-up surface (ResumeSandbox), which the
            # gateway's cold path calls when the routing projection has no
            # answer. Set explicitly at its own default so the containerPort
            # below has a visible source and the two cannot drift.
            #
            # 🔴 Nothing binds this listener yet — `api::grpc::serve` is written
            # and uncalled in every role — so until that lands the gateway's
            # `resume_addr` pointed here gets a connection refused, which the
            # resume client reads as VerdictUndecided and falls back to the
            # scheduler. That is the safe direction: latency, not availability.
            - name: AENV_API_GRPC_ADDR
              value: "0.0.0.0:8002"
            # The port this half dials a machine's node sandbox service on.
            #
            # 🔴 A port and not an address, and no Service name anywhere: the
            # host comes from the scheduler, which names a node as
            # `http://<pod ip>:8000` off the agentenv-nodes EndpointSlice
            # (`kubernetes_discovery.go`). This half substitutes this port into
            # that answer, so the dial is Pod to Pod. A ClusterIP Service in
            # front of the node service would load-balance calls that are each
            # addressed to one named machine — a create meant for node-a
            # arriving at node-b, silently.
            #
            # Set explicitly at its own default so it can be compared against
            # AENV_NODE_SERVICE_ADDR on the DaemonSet. The two disagreeing is
            # this half dialling a closed port on every machine in the fleet,
            # and there is a test that reads both files.
            - name: AENV_NODE_SERVICE_PORT
              value: "8001"
            # 🔴 The replica's identity, and it must be the Pod's name rather
            # than the machine's.
            #
            # This half releases, renews and reconciles paused-registry rows by
            # node identity, and the rows are keyed by the machine that holds
            # the sandbox. An api replica reporting `spec.nodeName` would share
            # an identity with the node DaemonSet Pod on that same machine, and
            # its startup pass would release that machine's live holdings out
            # from under it — the same family of fault as two servers sweeping
            # one host, reached by a different mistake.
            - name: AENV_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The same cluster name both sides of the registry read. See the
            # note on this ConfigMap in kustomization.yaml.
            - name: AENV_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-identity-config
                  key: CLUSTER_ID
                  optional: true
            # 🔴 false. A heartbeat reports a machine — its CPU, its memory, the
            # sandboxes on it — and this replica is not one. Reporting itself
            # would put a node in the scheduler's table that can never run
            # anything, and the scheduler would place sandboxes on it.
            #
            # Set explicitly even though `false` is the code default: this is a
            # line somebody would otherwise copy from the DaemonSet, where it is
            # `true`, without noticing what it means here.
            - name: AENV_OBSERVABILITY_SCHEDULER_REPORT_ENABLED
              value: "false"
            # Still needed, and not for heartbeats: the `central` paused
            # registry above speaks to the scheduler over this endpoint.
            - name: AENV_OBSERVABILITY_SCHEDULER_ENDPOINT
              value: http://agentenv-scheduler:9090
            # Where this half's control-plane credential is read from, re-read
            # while the process runs. A volume rather than a secretKeyRef for
            # the reason the DaemonSet gives: kubelet refreshes volumes and does
            # not refresh env.
            #
            # 🔴 A key of its own (`api-gate-token`), not the node's. One Secret
            # carries the gateway's stamp under `token` and each gate's copy
            # under its own key, so that creating or extending the Secret lights
            # one participant at a time. Projecting the node's key here would
            # mean the step that opens the node's gate also opens this one — and
            # if the gateway were not yet stamping, that single act would refuse
            # every REST request in the cluster at once.
            - name: AENV_API_CONTROL_PLANE_TOKEN_FILE
              value: /etc/agentenv/control-plane/token
            # The domain sandbox URLs are built from. Not node state: this half
            # answers `GET /sandboxes/{id}`, and `sandbox.domain` in that answer
            # comes from this value. An api half without it answers `null` and
            # every SDK client builds the wrong URL.
            - name: AENV_SANDBOX_PROXY_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: sandbox-proxy-config
                  key: SANDBOX_PROXY_DOMAINS
                  optional: true
            # 🔴 AENV_STARTUP_RECLAIM_ENABLED is deliberately absent, here and
            # everywhere else in this tree. It makes a process sweep the host
            # for another process's leftover VMs, which is sound for `--role
            # node` — where it defaults to on — and destructive anywhere two
            # servers can share a machine. This half has no host to sweep.
          ports:
            - name: http
              containerPort: 8000
            # The wake-up surface. Named `grpc` rather than `resume` because it
            # is the whole gRPC listener of this half, of which ResumeSandbox is
            # today the only method.
            - name: grpc
              containerPort: 8002
            # 🔴 No metrics port. This half serves Prometheus on `/metrics` of
            # the HTTP port above (`src/api/server.rs`), unlike the gateway and
            # the scheduler which have listeners of their own — and unlike the
            # node, whose second port belongs to the ublk daemon this half does
            # not run.
          resources:
            requests:
              # 🔴 Unmeasured. A control-plane process that proxies and talks to
              # Redis, sized so it is not BestEffort — the failure this guards
              # is an api Pod being the first thing evicted from a machine whose
              # node Pod has asked for 8Gi. Revise from real numbers once this
              # half has served traffic; do not read these as measurements.
              cpu: 100m
              memory: 512Mi
            # No limits, deliberately. A CPU limit on a request-proxying process
            # turns a busy moment into throttling that looks like an upstream
            # being slow, and this half is on the path of every REST call.
          securityContext:
            # 🔴 The inverse of the DaemonSet's `privileged: true`, and stated
            # rather than left out. This half touches no /dev/kvm, creates no
            # network namespace and opens no ublk device; `ServerRole` is what
            # keeps it from constructing any of that, and this is the deployment
            # saying the same thing in the place a reader of the manifest looks.
            # If either statement is ever wrong, the Pod fails loudly here
            # instead of quietly acquiring a privilege it was never meant to
            # hold.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            # 60s. The node's 240s covers downloading Firecracker, the kernel
            # and the tools drive, and priming a VMM pool; this half does none
            # of it and a slow start here is a fault rather than a warm-up.
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: agentenv-config
              mountPath: /workspace/config/agentenv.toml
              subPath: agentenv.toml
              readOnly: true
            # The tracked, credential-free half of `[backend.oss]`, from the
            # same ConfigMap as the file above. 🔴 A `subPath` mount, which
            # kubelet never refreshes — editing the ConfigMap changes nothing
            # until the Pod is replaced.
            - name: agentenv-config
              mountPath: /workspace/config/oss-overlay.toml
              subPath: oss-overlay.toml
              readOnly: true
            # The credentials, and the only place in this tree they come from.
            - name: backend-credentials
              mountPath: /etc/agentenv/backend
              readOnly: true
            - name: scratch
              mountPath: /workspace/env
            - name: control-plane-token
              mountPath: /etc/agentenv/control-plane
              readOnly: true
      volumes:
        # 🔴 The config ConfigMap, an emptyDir and one projected Secret key —
        # and nothing else. In particular **no `hostPath: /var/lib/aenv` and no
        # `hostPath: /dev`**, both of which the DaemonSet has and both of which
        # would hand this half write access to a machine's local sandbox state
        # and to its devices. There is no arrangement in which this process
        # should touch either.
        #
        # 🔴 Also no `regctl-config` volume and no `HOME` env var, unlike the
        # DaemonSet (see the note on `regctl-config` in kustomization.yaml).
        # Both exist only to make `regctl` find this cluster's plain-HTTP
        # registry, and this half never calls `regctl`: the doc comment on
        # `assemble_api` in `src/bin/server.rs` is explicit that `--role api`
        # "installs no regctl — by design, that is a node's tooling", and the
        # two routes that would otherwise resolve an image
        # (`POST /sandboxes-cold`, a template build) refuse at the door on
        # `!role.runs_sandbox_runtime()` before reaching it. Mounting the
        # volume here would cost nothing and fix nothing — there is no call
        # site left for it to unblock.
        - name: agentenv-config
          configMap:
            name: agentenv-k8s-config
        # 🔴 The object-storage credentials, as a mounted file rather than a
        # `secretKeyRef`, and not because of refresh: `[backend.oss]` is
        # `Option<OssBackendConfig>` and confique reads a non-`nested`
        # `Option` from a file and from nothing else, so no environment form of
        # these values exists to be referenced.
        #
        # They used to be plaintext in the `agentenv-k8s-config` ConfigMap,
        # which is generated from `config/default.toml` — one apply from a
        # working tree with a local edit, and they were in the cluster with no
        # tracked copy and no way back.
        #
        # `optional: true`, deliberately, and it is not a way to run without
        # them. An absent Secret mounts an empty directory, the file named by
        # AENV_CONFIG_OVERLAY_PATH is then missing, and the process refuses to
        # start naming it — which is the loud failure this needs. What
        # `optional: true` buys is that clearing AENV_CONFIG_OVERLAY_PATH is a
        # *complete* rollback: with `optional: false` the Pod would still be
        # stuck at ContainerCreating on a Secret it no longer reads, and the
        # rollback would take a manifest edit.
        - name: backend-credentials
          secret:
            secretName: rustfs-credentials
            optional: true
            items:
              - key: backend-oss-credentials.toml
                path: backend-oss.toml
        # The image sets AENV_HOME_PATH=/workspace/env, and the process creates
        # caches under it. On the node that path is the machine's hostPath; here
        # it is scratch with the Pod's own lifetime. If anything this half writes
        # there ever needs to survive a restart, that is a bug in the api half —
        # its durable state belongs in the shared store — and not a missing
        # volume.
        #
        # 🔴 One thing under here is not a cache, and a reader deciding what to
        # put in this volume has to know which: `snapshot-catalog-mirror`, the
        # double write's queue of owed catalog writes. Its own configuration
        # calls it "node-local and durable" (`src/cfg.rs`), and on this half it
        # is neither — every replica opens an empty one.
        #
        # What that costs at startup is handled in code and must stay handled:
        # a mirror with no recorded read side reads `read = "postgres"` as the
        # switch, so every replica runs the two-catalog population comparison
        # on every start rather than once, and the comparison replays what the
        # history backfill just queued before it refuses
        # (`mirror/population.rs::admit_read_side`). Without that replay a
        # difference of any size stops every *new* api Pod while the ones older
        # than the difference keep serving — measured on the dev cluster at five
        # snapshots — and it cannot clear itself, because the compensator that
        # would close it is spawned after the refusal.
        #
        # 🔴 What it still costs, and what no code here fixes: a write this
        # replica owes one of the two catalogs is queued in this directory, so a
        # replica that dies holding one leaves a difference that no gauge counts.
        # The next replica's comparison is what finds it. A difference where
        # object storage is ahead is closed by the replay above; one where
        # PostgreSQL is ahead is closed by nothing automatic and takes an
        # operator. Giving this half a durable mirror is the fix for that, and
        # it is a decision about the api half's persistence model — per-replica
        # volume or none at all, never one shared between replicas — rather than
        # a line to add here.
        - name: scratch
          emptyDir: {}
        # optional: an absent Secret, or a Secret without this key, mounts
        # nothing, this half reads no credential, and its gate stays off — which
        # is the state this ships in. Rolling the gate back is setting
        # `api-gate-token` to the empty string, never deleting the key: a failed
        # read deliberately keeps the last credential, and a deleted key is a
        # failed read (`src/api/control_plane_gate.rs`).
        - name: control-plane-token
          secret:
            secretName: agentenv-control-plane-token
            optional: true
            items:
              - key: api-gate-token
                path: token
