# Not listed in kustomization.yaml on purpose: applying it would overwrite the
# operator-filled Secrets on every `apply -k`. It documents the two Secrets
# the nodes and the api half read, and how to mint their contents.
#
#   NS=agentenv-system
#
#   # 1. The CA whose root guests trust for intercepted names. `aenv-api`
#   #    issues each node a short-lived intermediate from it, and the broker
#   #    on that node signs leaves under the intermediate. What bounds the
#   #    leaves is the broker: it signs only a name a rule already matched,
#   #    under a per-sandbox mint budget (`ca.mints_per_sandbox_per_minute`).
#   #    The intermediates carry an excluded set of their own; the root may
#   #    carry the same one, spelled the way RFC 5280 spells a suffix — with
#   #    the leading dot:
#   #    `-addext "nameConstraints=critical,excluded;DNS:.svc,excluded;DNS:.cluster.local,excluded;DNS:.local,excluded;DNS:.internal"`
#   openssl ecparam -name prime256v1 -genkey -noout -out ca.key
#   openssl req -x509 -new -key ca.key -sha256 -days 3650 -subj "/CN=AgentENV Egress Leaf CA" \
#     -addext "basicConstraints=critical,CA:TRUE" \
#     -addext "keyUsage=critical,keyCertSign,cRLSign" \
#     -out ca.crt
#   kubectl -n $NS create secret generic egress-ca --from-file=ca.crt --from-file=ca.key
#
#   # 2. The master key values are encrypted under. A file, and a Secret of
#   #    its own: whoever holds a dump of `secret_values` must not find the
#   #    key beside it, so it does not go in `agentenv-postgres`.
#   #
#   # 🔴 Losing this key loses every stored value. A database backup does not
#   # contain it and cannot recover it; that is the point of storing them
#   # apart. Back it up wherever the cluster's other root material lives.
#   head -c 32 /dev/urandom | base64 -w0 > key
#   kubectl -n $NS create secret generic agentenv-secrets-key --from-file=key
#   # The broker presents its own projected ServiceAccount token at the
#   # resolve endpoint — there is no shared bearer to mint. It needs
#   # `[resolver].url` pointing at the api half, which is a DaemonSet env var:
#   #   AENV_EGRESS_RESOLVER_URL=http://agentenv-api:8000/internal
#   # `aenv-egress-networkpolicy.yaml` already admits that port.
#
#   # Then switch the credential store on. AENV_SECRETS_BACKEND is read once
#   # at process startup, and patching a ConfigMap changes no pod template
#   # (the generators run with `disableNameSuffixHash: true`), so the api half
#   # needs its own restart.
#   kubectl -n $NS patch configmap secrets-store-config --type merge \
#     -p '{"data":{"AENV_SECRETS_BACKEND":"postgres"}}'
#   kubectl -n $NS rollout restart deploy/agentenv-api
#   # Rolling ds/agentenv-node destroys every sandbox on every node: the
#   # Firecracker processes are its children. Rolling ds/aenv-egress-node does not,
#   # which is why the broker is its own workload.
#
# Rotating the CA is appending the new certificate to `ca.crt` (nodes hand the
# whole bundle to guests) before any leaf is signed by it.
apiVersion: v1
kind: Secret
metadata:
  name: egress-ca
type: Opaque
stringData:
  # `ca.key` is mounted by the api half alone, which signs each node's
  # intermediate with it. The nodes mount `ca.crt` and nothing else, as
  # [egress_broker].guest_ca_cert_path; the broker mounts neither.
  ca.crt: "PEM certificate, see above"
  ca.key: "PEM private key, see above"
---
# The api Deployment projects this into /etc/agentenv/secrets. No workload
# mounts it twice, and the broker mounts none of these: its credential at the
# internal endpoints is its own projected ServiceAccount token.
apiVersion: v1
kind: Secret
metadata:
  name: agentenv-secrets-key
type: Opaque
stringData:
  key: "base64 of 32 random bytes; losing it loses every stored value, see above"
