# Not listed in kustomization.yaml on purpose: applying it would overwrite the
# operator-filled Secrets on every `apply -k`. It documents the six Secrets the
# egress broker, the nodes and the api half read, and how to mint their
# contents.
#
#   NS=agentenv-system
#   # Two CAs, because they answer to different constraints. The leaf CA signs
#   # certificates for intercepted names and is what guests trust; the
#   # transport CA signs the broker's own server certificate and is what nodes
#   # verify. One CA doing both cannot carry nameConstraints, because any
#   # excluded set covering the cluster suffixes would invalidate
#   # `CN=aenv-egress` with its `*.svc` SAN. Split, the leaf CA is free to
#   # carry them.
#
#   # 1. The leaf CA. What bounds its leaves today is the broker: it signs only
#   #    a name a rule already matched, under a per-sandbox mint budget
#   #    (`ca.mints_per_sandbox_per_minute`). Add
#   #    `-addext "nameConstraints=critical,excluded;DNS:svc,excluded;DNS:cluster.local"`
#   #    to bound it in the certificate as well.
#   openssl ecparam -name prime256v1 -genkey -noout -out ca.key
#   openssl req -x509 -new -key ca.key -sha256 -days 3650 -subj "/CN=AgentENV Egress Leaf CA" \
#     -addext "basicConstraints=critical,CA:TRUE" \
#     -addext "keyUsage=critical,keyCertSign,cRLSign" \
#     -out ca.crt
#   kubectl -n $NS create secret generic egress-ca --from-file=ca.crt --from-file=ca.key
#
#   # 2. The transport CA, and the broker server certificate it signs. Nodes
#   #    get transport-ca.crt as [egress_broker].ca_cert_path and ca.crt above
#   #    as guest_ca_cert_path.
#   openssl ecparam -name prime256v1 -genkey -noout -out transport-ca.key
#   openssl req -x509 -new -key transport-ca.key -sha256 -days 3650 \
#     -subj "/CN=AgentENV Egress Transport CA" \
#     -addext "basicConstraints=critical,CA:TRUE" \
#     -addext "keyUsage=critical,keyCertSign,cRLSign" \
#     -out transport-ca.crt
#   openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out tls.key
#   openssl req -new -key tls.key -subj "/CN=aenv-egress" \
#     -addext "subjectAltName=DNS:aenv-egress,DNS:aenv-egress.$NS.svc" -out tls.csr
#   openssl x509 -req -in tls.csr -CA transport-ca.crt -CAkey transport-ca.key \
#     -CAcreateserial -days 825 -sha256 -copy_extensions copy -out tls.crt
#   kubectl -n $NS create secret generic egress-server --from-file=tls.crt --from-file=tls.key
#   kubectl -n $NS create secret generic egress-transport-ca --from-file=ca.crt=transport-ca.crt
#
#   # A deployment that has not split them signs tls.crt with ca.key and gives
#   # nodes ca.crt alone; guest_ca_cert_path unset then means the two are one.
#
#   # The HMAC key runtimes sign identity headers with; nodes read the same key.
#   head -c 32 /dev/urandom | base64 -w0 > key
#   kubectl -n $NS create secret generic egress-hmac --from-file=key
#
#   # The master key values are encrypted under, and the bearer the broker
#   # presents at the api half's resolve endpoint. Both are files, and the key
#   # is in a Secret of its own: whoever holds a dump of `secret_values` must
#   # not find the key beside it, so it does not go in `agentenv-postgres`.
#   #
#   # 🔴 Losing this key loses every stored value. A database backup does not
#   # contain it and cannot recover it; that is the point of storing them
#   # apart. Back it up wherever the cluster's other root material lives.
#   head -c 32 /dev/urandom | base64 -w0 > key
#   kubectl -n $NS create secret generic agentenv-secrets-key --from-file=key
#   head -c 32 /dev/urandom | base64 -w0 > token
#   kubectl -n $NS create secret generic egress-resolver --from-file=token
#   # The broker reads that same token from `[resolver].token_file` and needs
#   # `[resolver].url` pointing at the api half, which is a Deployment env var:
#   #   AENV_EGRESS_RESOLVER_URL=http://agentenv-api:8000/internal
#   # `aenv-egress-networkpolicy.yaml` already admits that port.
#
#   # Then switch the nodes and the api half on. AENV_EGRESS_BROKER_MODE and
#   # AENV_SECRETS_BACKEND are both read once at process startup, and patching
#   # a ConfigMap changes no pod template (the generators run with
#   # `disableNameSuffixHash: true`), so each side needs its own restart.
#   kubectl -n $NS patch configmap egress-broker-config --type merge \
#     -p '{"data":{"AENV_EGRESS_BROKER_MODE":"remote"}}'
#   kubectl -n $NS patch configmap secrets-store-config --type merge \
#     -p '{"data":{"AENV_SECRETS_BACKEND":"postgres"}}'
#   kubectl -n $NS rollout restart ds/agentenv-node deploy/agentenv-api
#   # `make k8s-redeploy` is the same restart for all four workloads, with the
#   # rollout waits.
#
# Rotating the HMAC key is adding the new value to `key` on the broker side
# under a second file name listed in hmac.key_files, rolling the nodes onto
# it, then removing the old one. Rotating a CA is appending the new
# certificate to its bundle (nodes hand the guest bundle to guests) before any
# leaf is signed by it. Rotating the resolver bearer is a new random value in
# both `egress-resolver` and the api half's mount of it, `kubectl create secret
# --dry-run=client | kubectl
# apply -f -`, and a restart of the Pod that reads it.
apiVersion: v1
kind: Secret
metadata:
  name: egress-ca
type: Opaque
stringData:
  # The leaf CA: mounted by the broker, which signs with it, and handed to
  # guests by the nodes as [egress_broker].guest_ca_cert_path.
  ca.crt: "PEM certificate, see above"
  ca.key: "PEM private key, see above"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-transport-ca
type: Opaque
stringData:
  # The transport CA: certificate only, mounted by the nodes as
  # [egress_broker].ca_cert_path. Its key never leaves the operator's hands.
  # A deployment that has not split the two omits this Secret.
  ca.crt: "PEM certificate, see above"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-server
type: Opaque
stringData:
  tls.crt: "PEM certificate chain for aenv-egress, see above"
  tls.key: "PKCS#8 PEM private key, see above"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-hmac
type: Opaque
stringData:
  key: "random bytes, see above"
---
# The api Deployment projects both of these into /etc/agentenv/secrets; the
# broker mounts `egress-resolver` alone.
apiVersion: v1
kind: Secret
metadata:
  name: agentenv-secrets-key
type: Opaque
stringData:
  key: "base64 of 32 random bytes; losing it loses every stored value, see above"
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-resolver
type: Opaque
stringData:
  token: "the bearer the broker presents at the api half's resolve endpoint, see above"
