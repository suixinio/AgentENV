[package]
name = "agentenv-e2e-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
# The snapshot mock this suite writes artifacts with is compiled into
# aenv-core only under test-support; a dev-dependency's features do not
# propagate through aenv-node, so the feature is named here.
aenv-core = { path = "../..", features = ["test-support"] }
aenv-node = { path = "../aenv-node" }
agentenv-test-support = { path = "../test-support" }
anyhow = "1.0"
overlaybd = { path = "../../storage/overlaybd" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "snapshot_oss_e2e_test"
path = "tests/snapshot_oss_e2e_test.rs"
