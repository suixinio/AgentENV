[package]
name = "agentenv"
version.workspace = true
edition = "2021"
license = "MIT"

[workspace]
members = [
    ".",
    "adev",
    "crates/aenv",
    "crates/benchmarks",
    "crates/e2e-tests",
    "crates/linux-cap",
    "crates/observability",
    "crates/object-store-operator",
    "crates/test-support",
    "crates/shell-util",
    "crates/warm-pool",
    "src/api/generated",
    "src/custom_extension_api/generated",
    "thirdparty/firecracker-client",
    "thirdparty/envd",
    "storage/util",
    "storage/overlaybd",
    "storage/ublk",
    "storage/ublk-daemon",
]

[workspace.package]
version = "0.1.2"

[lib]
path = "src/lib.rs"

[features]
vendored-openssl = ["dep:openssl-sys", "openssl-sys/vendored"]

[dev-dependencies]
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies]
firecracker_client = { version = "1.15.1", path = "thirdparty/firecracker-client" }
envd = { version = "0.1.0", path = "thirdparty/envd" }
custom_extension_client = { version = "0.1.0", path = "src/custom_extension_api/generated" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
opendal = { version = "0.55.0", features = ["services-s3"] }
object-store-operator = { path = "crates/object-store-operator" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rocksdb = "0.24.0"
tower = "0.5.2"
anyhow = "1.0.100"
tempfile = "3.22.0"
nix = { version = "0.31", features = ["sched", "mount", "fs", "signal", "user", "resource", "uio"] }
libc = "0.2"
rtnetlink = "0.20"
netlink-packet-route = "0.28"
ipnetwork = "0.21"
futures = "0.3"
tonic = "0.14.2"
tonic-prost = "0.14.2"
prost = "0.14.3"
prost-types = "0.14.3"
thiserror = "2.0.18"
index-set = "0.2"
uuid = { version = "1", features = ["serde", "v7"] }
toml = "0.9.11"
confique = { version = "0.4.0", features = ["toml"] }
which = "8.0.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
agentenv-observability = { path = "crates/observability" }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
agentenv_http_server = { path = "src/api/generated" }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = [
    "cookie",
    "query",
    "typed-header",
] }
bytes = "1"
headers = "0.4"
http = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2.5"
clap = { version = "4", features = ["derive"] }
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
uvm-ublk = { path = "storage/ublk" }
uvm-ublk-daemon = { path = "storage/ublk-daemon" }
shell-util = { path = "crates/shell-util" }
linux-cap = { path = "crates/linux-cap" }
warm-pool = { path = "crates/warm-pool" }
ublk-sys = { package = "libublk-rs-sys", git = "https://github.com/ublk-org/libublk-rs.git", rev = "c6a3e06" }
overlaybd = { path = "storage/overlaybd" }
storage-util = { path = "storage/util" }
dashmap = "6.1.0"
io-uring = "0.7.9"
tokio-tungstenite = "0.28"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
semver = "1"
iroh = { version = "=1.0.0-rc.0" }
iroh-blobs = { version = "=0.101.0" }
rand = "0.10"
flate2 = "1"
tar = "0.4"
openssl-sys = { version = "0.9", optional = true }
redis = { version = "1.6.0", features = ["tokio-comp", "script", "connection-manager"] }
# Runtime-query API only (`sqlx::query`/`query_as`), never the `query!`
# compile-time macros: those need either a live database or an offline cache
# at build time, which would leak into CI and Docker builds. `tls-native-tls`
# (bundled by `runtime-tokio-native-tls`) matches this crate's own TLS
# backend -- `reqwest` above resolves to `native-tls`/openssl by default and
# is never overridden to rustls the way `crates/aenv` deliberately is -- so
# this does not add a second TLS stack next to the one `reqwest` already
# pulls in. See `src/pg/mod.rs`.
#
# `chrono`: added for Stage C's paused-registry backend
# (`src/orchestrator/paused_registry/postgres/`), which binds and decodes
# `paused_sandboxes`' TIMESTAMPTZ columns (`paused_at`, `updated_at`,
# `lease_expires_at`, `sandbox_expires_at`, `execution_started_at`) as
# `chrono::DateTime<Utc>` -- the type `PausedSandboxEntry`/`HeldSandbox`
# already use crate-wide (`chrono` is already a direct dependency above).
# Stage B's catalog backend never needed this: its own timestamp columns are
# `BIGINT` epoch-milliseconds (see `migration_state.rs`'s `now_ms`), sidestepping
# the question entirely -- Stage C cannot do the same without diverging from
# the schema `services/scheduler/internal/registry/migrate.go` already owns.
#
# `derive`: `#[derive(sqlx::FromRow)]` for Stage C's row types
# (`postgres::row::EntryRow`/`ClaimRow`) -- 14 named columns is unworkable as
# a positional tuple the way Stage B's `query_as::<_, (Uuid, Uuid, ...)>`
# gets away with for two or three columns. Deliberately `derive`, not the
# broader `macros` feature: `macros` also pulls in `sqlx::query!`/`query_as!`,
# the compile-time-checked variants this crate's own comment two lines up
# says never to use (they need a live database or an offline cache at build
# time). `derive` alone needs neither -- it is a plain proc-macro expansion
# over struct field names, nothing checked against a schema.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "json", "chrono", "derive"] }
# Stage A of the scheduler fold (docs/proposals/_sd-phase4-stageA-node-inventory.md):
# `src/node_registry/kubernetes_discovery.rs` ports
# `services/scheduler/internal/kubernetes_discovery.go`'s EndpointSlice/Pod
# informers. `kube`'s default TLS backend is rustls; `openssl-tls` (backed by
# `hyper-openssl`) is selected explicitly instead, for the same reason the
# `sqlx` entry above picks `tls-native-tls`: `reqwest` already resolves to
# native-tls/openssl by default, and a second TLS stack in the same binary is
# exactly what that entry's comment argues against. `crates/aenv` is the
# documented exception that uses rustls on purpose; this is not it. `v1_34`
# pins a specific Kubernetes API generation rather than tracking `k8s-openapi`'s
# `latest` feature, matching how Firecracker/kernel versions are pinned in
# `config/deps_manifest.toml` rather than floated.
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "openssl-tls"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.rocksdb]
opt-level = 3
debug = 0

[profile.dev.package.librocksdb-sys]
opt-level = 3
debug = 0

[profile.test.package.rocksdb]
opt-level = 3
debug = 0

[profile.test.package.librocksdb-sys]
opt-level = 3
debug = 0
