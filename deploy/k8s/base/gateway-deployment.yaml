apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-gateway
  labels:
    app.kubernetes.io/name: agentenv-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-gateway
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: gateway
          image: agentenv-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /config/gateway.json
          ports:
            - name: http
              containerPort: 8080
            # The gateway has always served Prometheus metrics on its own
            # listener; without this and the matching Service port nothing
            # could scrape them.
            - name: metrics
              containerPort: 9102
          env:
            - name: GATEWAY_SANDBOX_PROXY_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: sandbox-proxy-config
                  key: SANDBOX_PROXY_DOMAINS
                  optional: true
            # The shared secret the gateway stamps on every request it forwards
            # to a node, so the node can tell control-plane traffic from
            # anything that reached it another way.
            #
            # 🔴 The same Secret the DaemonSet mounts, but a different key in
            # it, and that is the whole reason the ordering below is
            # expressible at all. Injection has to be switched on *first* and
            # switched off *last*: a node whose gate is open while the gateway
            # is not stamping refuses every platform request. If both sides
            # read the same key, creating the Secret would switch both on at
            # once and the ordering would be a sentence in a runbook with
            # nothing behind it. So the gateway reads `token` and the node's
            # volume projects `node-gate-token` (see the `items:` block on the
            # DaemonSet's control-plane-token volume).
            #
            # Rolling out is therefore "create the Secret with `token` only,
            # roll the gateway, verify it stamps, *then* add
            # `node-gate-token`"; rolling back is "set `node-gate-token` to the
            # empty string, then stop stamping". 🔴 The two values must be the
            # same credential — derive the second from the first rather than
            # retyping it, since a typo there is every platform request 403.
            #
            # optional: an absent Secret leaves the value empty, the gateway
            # stamps nothing, and the node's gate stays open — which is the
            # state this ships in.
            - name: GATEWAY_CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentenv-control-plane-token
                  key: token
                  optional: true
            # 🔴 Off at first contact, on purpose, and this is why the setting
            # has to be here at all: the code's default is `enforce`, and the
            # release sequence requires the gateway to go out injecting the
            # token while refusing nothing. Without this the deployment cannot
            # express the step it is supposed to be at.
            #
            # See the scheduler Deployment for why the environment carries these
            # alongside the mounted config file.
            - name: GATEWAY_ROUTING_EXECUTION_FENCING
              valueFrom:
                configMapKeyRef:
                  name: execution-fencing-config
                  key: GATEWAY_ROUTING_EXECUTION_FENCING
                  optional: true
            # Where the routing projection lives, for the gateway to read
            # directly. The same Redis the scheduler writes to (redis.yaml), and
            # the same reasoning as SCHEDULER_REDIS_ADDR: a Service name is not
            # a credential, so it is a plain value rather than a Secret ref.
            #
            # 🔴 Set here from the start, while the read switch below is still
            # `off`, and that ordering is not optional. The gateway refuses to
            # start with `projection_read` on and no address — deliberately, so
            # that a switch reporting as on can never be doing nothing — which
            # means turning the switch on *first* is a CrashLoop, not a
            # degraded read. With the switch off this value is inert: the
            # gateway builds no client at all and never opens a connection, so
            # carrying it costs nothing and removes the ordering hazard from
            # the flip entirely.
            - name: GATEWAY_REDIS_ADDR
              value: agentenv-redis:6379
            # The two halves of the routing projection the gateway owns: whether
            # it may answer a sandbox route out of the projection instead of
            # asking the scheduler, and whether it writes the projection as a
            # record with a lifetime of its own.
            #
            # 🔴 Both start `off`, and unlike the fencing switches above the
            # *code* defaults to off as well. The reason is written out in
            # services/shared/config: turning the write side on makes
            # ReportSandboxEvent — an RPC every node in the fleet is already
            # sending — stop being a guaranteed no-op and start deleting
            # records. A cluster that rolled this image without asking for that
            # would acquire the behaviour the moment a pod restarted.
            #
            # 🔴 The read switch is paired with the scheduler's
            # SCHEDULER_ROUTING_EXECUTION_ARBITRATION: it may only be on while
            # that one is anything other than `off`. The arbitration rollback
            # works by blanking the incarnation fields on the way out of
            # LookupNode, and a gateway reading the projection itself never
            # passes through that code — it would go on fencing against
            # incarnations the scheduler has stopped arbitrating. Nothing
            # enforces the pairing; it is an operational rule.
            #
            # As with the fencing switches, the ConfigMap carries the release's
            # starting values and these environment variables exist so a
            # rollback is `kubectl set env` — which rolls the deployment and is
            # loud — rather than an edit to a mounted file, which would not take
            # effect at all until something restarted the pod anyway.
            - name: GATEWAY_ROUTING_PROJECTION_READ
              valueFrom:
                configMapKeyRef:
                  name: routing-projection-config
                  key: GATEWAY_ROUTING_PROJECTION_READ
                  optional: true
            - name: GATEWAY_ROUTING_PROJECTION_AUTHORITATIVE
              valueFrom:
                configMapKeyRef:
                  name: routing-projection-config
                  key: GATEWAY_ROUTING_PROJECTION_AUTHORITATIVE
                  optional: true
            # 阶段 3a's switch, mandatory now.
            #
            # 🔴 Declared here, from the start — the same reasoning as
            # GATEWAY_REDIS_ADDR above. A switch that has to be *added* to this
            # list before it can be flipped makes turning 3a on a manifest
            # change; with it declared, that direction is one `kubectl set env`
            # on this Deployment, which rolls it and is loud, or one edit to
            # api-upstream-config followed by a restart.
            #
            # REST_UPSTREAM_ADDR is where user-facing REST goes:
            # `http://agentenv-api:8000` sends it to the deciding half.
            #
            # 🔴 There used to be a second key beside it, GATEWAY_RESUME_ADDR,
            # naming who wakes a paused sandbox the routing projection cannot
            # place. It is deleted: that wake-up is a gRPC call on the api
            # half's `agentenv-api:8002` listener, which is the same listener
            # GATEWAY_SCHEDULER_ADDR already names, so the gateway reuses that
            # connection rather than opening a second one to the same process.
            #
            # 🔴 This one may not be emptied any more. The nodes run
            # `aenv-node`, which never serves user-facing REST under any
            # configuration, so an empty value here would only ever have meant
            # an outage. `services/shared/config`'s `Config.Validate` refuses
            # to load a gateway config with it empty — see
            # api-upstream-config's own note in kustomization.yaml for what
            # that means for rollback.
            - name: GATEWAY_REST_UPSTREAM_ADDR
              valueFrom:
                configMapKeyRef:
                  name: api-upstream-config
                  key: GATEWAY_REST_UPSTREAM_ADDR
                  optional: true
            # The cap on the same cold path's last resort: the LookupNode call
            # an undecided wake-up (or a nil ResumeClient) falls through to.
            # See cold-lookup-config in kustomization.yaml for why it is
            # declared at the code default rather than left off this list —
            # `optional: true` here is what lets that ConfigMap be edited and
            # this Deployment restarted, instead of this file, to retune it.
            #
            # 🔴 This used to be a pair — GATEWAY_SCHEDULER_FALLBACK_DISABLED
            # alongside GATEWAY_SCHEDULER_FALLBACK_TIMEOUT, sourced from a
            # ConfigMap named scheduler-fallback-config — because the call
            # this bounds used to also have a switch that could skip it
            # entirely. That switch is deleted outright along with the Go
            # scheduler it existed to decommission; only the timeout survives,
            # renamed to GATEWAY_COLD_LOOKUP_TIMEOUT because it stopped being a
            # fallback-specific setting the moment it stopped being able to
            # point at a process that might not exist.
            - name: GATEWAY_COLD_LOOKUP_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: cold-lookup-config
                  key: GATEWAY_COLD_LOOKUP_TIMEOUT
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: gateway-config
              mountPath: /config/gateway.json
              subPath: gateway.json
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-k8s-config
