[package]
name = "aenv-rocksdb-migrate"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# 🔴 Its own workspace root on purpose: the parent workspace must resolve no
# rocksdb dependency, which `make check-crate-boundaries` enforces.
[workspace]

[[bin]]
name = "aenv-rocksdb-migrate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rocksdb = "0.24.0"
serde_json = "1"

[profile.release]
opt-level = 2
