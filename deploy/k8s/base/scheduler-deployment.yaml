apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-scheduler
  labels:
    app.kubernetes.io/name: agentenv-scheduler
spec:
  # 🔴 One replica, and it stays one. The registry write surface would be safe
  # with more — every statement it runs is a single conditional write, so two
  # writers cannot corrupt each other — but this process is more than that
  # surface. Bindings, observed-node state and the P2P artifact index all live
  # in its memory, and a second replica would serve half the cluster from an
  # empty copy of each. Sharing them needs `scheduler.redis_addr` and
  # `--query-only` replicas, which is a different change from this one.
  #
  # What is fixed here is the window, not the count: since phase 2 this process
  # is a hard dependency of every node's renewals, pauses and resumes, and how
  # long it is absent during an upgrade was left entirely to the default
  # rolling-update behaviour — which takes the only Pod down first.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the replacement before retiring the incumbent. The two overlap for
      # a few seconds and that is fine for the registry: both run the same
      # single-statement conditional writes, and the new one's restart grace
      # window withholds exactly the decisions a just-started process must not
      # make. Taking the old one down first instead leaves a gap in which every
      # node's registry call fails.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-scheduler
    spec:
      serviceAccountName: agentenv-scheduler
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: scheduler
          image: agentenv-scheduler:latest
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /config/scheduler.json
          env:
            # Read-only DSN for the node-owned `paused_sandboxes` table. It
            # carries credentials, so it never goes near the ConfigMap.
            #
            # `optional: true` is not decoration: a cluster that does not run a
            # registry database has no such Secret, and the scheduler has to
            # come up there exactly as it always did. An empty DSN switches the
            # whole feature off.
            - name: SCHEDULER_REGISTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: agentenv-postgres
                  key: dsn
                  optional: true
            # Scopes every registry read to one cluster, and — once the write
            # surface is on — every write and the reclamation timer with it.
            #
            # 🔴 The same ConfigMap key the DaemonSet reads `AENV_CLUSTER_ID`
            # from, on purpose: this value only means anything if both sides
            # hold the same one, and neither can detect that they do not. It
            # used to come from a key on the `agentenv-postgres` Secret that
            # nothing ever created, which is how a fresh cluster got a write
            # surface that was permanently cold with a single error line to
            # explain it. A cluster id is a name, not a credential, so it has
            # no business being in a Secret in the first place.
            #
            # Left optional: absent, the read surface widens to every row in
            # the database and the write surface stays registered and cold
            # answering UNAVAILABLE. Both are deliberate — a missing value must
            # not take routing, discovery and bindings down with it — which is
            # exactly why the value is carried by the base layer rather than by
            # an object somebody has to remember to create. `/healthz` reports
            # the id in use, so "configured" can be told from "assumed".
            - name: SCHEDULER_REGISTRY_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-identity-config
                  key: CLUSTER_ID
                  optional: true
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9101
          readinessProbe:
            exec:
              command:
                - /grpc_health_probe
                - -addr=127.0.0.1:9090
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /grpc_health_probe
                - -addr=127.0.0.1:9090
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: scheduler-config
              mountPath: /config/scheduler.json
              subPath: scheduler.json
              readOnly: true
      volumes:
        - name: scheduler-config
          configMap:
            name: scheduler-k8s-config
