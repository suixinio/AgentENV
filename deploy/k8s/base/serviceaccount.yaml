apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentenv-scheduler
---
# Stage A of the scheduler fold
# (docs/proposals/_sd-phase4-stageA-node-inventory.md): `--role api` grows its
# own Kubernetes discovery (`src/node_registry/kubernetes_discovery.rs`),
# behind `[cluster].node_placement_source` and defaulting to off. A separate
# identity from `agentenv-scheduler` — not a shared one — keeps the two
# processes independently revocable while both watch EndpointSlices/Pods
# during the rollout, and keeps the topology honest about which workload
# holds which permission once scheduler is retired (阶段 4/Stage E).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentenv-api
