name: Services CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/**"
      - "deploy/**"
      - "tests/fixtures/**"
      - ".github/workflows/services-ci.yml"
  push:
    paths:
      - "services/**"
      - "deploy/**"
      - "tests/fixtures/**"
      - ".github/workflows/services-ci.yml"

jobs:
  go-services:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: |
            services/go.sum
            services/go.mod
      - name: Build services
        run: make build
      - name: Install Redis server for the routing-reader tests
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Test services
        env:
          # shared/routing's reader tests fall back to looking `redis-server`
          # up on PATH and skip when it is absent, so naming the binary is
          # what makes a failed install fail the job instead of reporting a
          # green skip.
          REDIS_SERVER_BIN: /usr/bin/redis-server
          # And the belt to that brace. Naming the binary only helps while the
          # path is right; this turns a skip inside the suite into a failure
          # however it was reached. The routing-reader tests are the only
          # coverage the Redis-backed binding store has, and a change made to
          # the in-memory store and forgotten for Redis passes every other
          # test in the module.
          SCHEDULER_REDIS_TEST_REQUIRED: "1"
        run: make test
      - name: Go format check
        run: make fmt-check
      - name: Go vet
        run: make vet
