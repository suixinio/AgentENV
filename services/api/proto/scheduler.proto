syntax = "proto3";

package scheduler.v1;

option go_package = "agentenv/services/api/proto;schedulerv1";

// Scheduler is the placement and observation surface: gateways and nodes ask
// it where a sandbox is, tell it where one ended up, and report what they hold.
//
// 🔴 No method on this service may answer with codes.PermissionDenied. That
// code belongs to PausedRegistry, where it means "a superseded incarnation
// tried to write" (see ExecutionAuthority and TransitionSandboxRequest
// .execution_id). The gateway's scheduler error mapping has no branch for it
// and falls through to a 502, so returning it here turns a precise refusal
// into a misdiagnosed server fault.
service Scheduler {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc LookupNode(LookupNodeRequest) returns (LookupNodeResponse);
  rpc RecordAssignment(RecordAssignmentRequest) returns (RecordAssignmentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportSandboxEvent(ReportSandboxEventRequest) returns (ReportSandboxEventResponse);
  rpc ListObservedNodes(ListObservedNodesRequest) returns (ListObservedNodesResponse);
  rpc ListP2pPeers(ListP2pPeersRequest) returns (ListP2pPeersResponse);
  rpc RecordP2pArtifact(RecordP2pArtifactRequest) returns (RecordP2pArtifactResponse);
  rpc ForgetP2pArtifact(ForgetP2pArtifactRequest) returns (ForgetP2pArtifactResponse);
  rpc LookupP2pArtifact(LookupP2pArtifactRequest) returns (LookupP2pArtifactResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);
  rpc ListRegistrySandboxes(ListRegistrySandboxesRequest) returns (ListRegistrySandboxesResponse);
}

message Node {
  string node_id = 1;
  string endpoint = 2;
}

// ScheduleRequestHint carries structured information parsed from the incoming
// request so the scheduler can make a more informed placement decision. Only
// request types that benefit from scheduling hints are represented; other
// requests omit the hint entirely.
message ScheduleRequestHint {
  oneof kind {
    NewColdSandboxHint new_cold_sandbox = 1;
    NewSandboxHint new_sandbox = 2;
  }
}

// NewColdSandboxHint describes a POST /sandboxes-cold request.
message NewColdSandboxHint {
  uint32 cpu_count = 1;
  uint64 memory_mb = 2;
  // OCI image references involved in the cold start: the rootfs image plus any
  // attached-drive images.
  repeated string images = 3;
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 4;
}

// NewSandboxHint describes a POST /sandboxes request.
message NewSandboxHint {
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 1;
}

message ScheduleRequest {
  reserved 1;  // formerly: string hint = 1
  ScheduleRequestHint hint = 2;
}

message ScheduleResponse {
  Node node = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message LookupNodeRequest {
  string sandbox_id = 1;
}

// SandboxLocation says how the scheduler arrived at the node it names, which is
// what decides whether that node is known to hold the sandbox or has merely
// been chosen to rebuild it.
//
// The distinction matters to the caller: a node that already holds the sandbox
// also holds its binding, while a node that was picked or pinned holds neither
// and has to have the assignment recorded against it as soon as it answers.
enum SandboxLocation {
  // The scheduler did not classify this answer. Only an older scheduler
  // produces it; it is equivalent to BOUND, since that is all a scheduler
  // without the registry could ever answer.
  SANDBOX_LOCATION_UNSPECIFIED = 0;
  // A node is known to hold the sandbox — from its binding, from the roster it
  // reported in its last heartbeat, or from a registry row that names it as
  // the holder.
  SANDBOX_LOCATION_BOUND = 1;
  // The registry has the sandbox paused with its snapshot published, so any
  // node can rebuild it. The node named here is a placement decision, taken
  // with origin_node_id as a soft preference so the layers already on that
  // machine get reused when it can still take work.
  SANDBOX_LOCATION_PLACED = 2;
  // The registry has the sandbox parked on origin_node_id with no snapshot in
  // shared storage (publishing, or local_only after a failed upload). The only
  // copy is on that machine's disk, so the answer is that node or nothing.
  SANDBOX_LOCATION_PINNED = 3;
}

// ExecutionAuthority says how strong the source of an execution_id is.
//
// 🔴 It is not a confidence level. It is the answer to "may this be used to
// refuse traffic", and only REGISTRY answers yes.
enum ExecutionAuthority {
  // A scheduler from before this field existed. Equivalent to UNKNOWN, and
  // that equivalence is hard: a caller that handles 0 separately gives two
  // behaviours for one situation for the length of a rolling upgrade.
  EXECUTION_AUTHORITY_UNSPECIFIED = 0;
  // The scheduler cannot name the current incarnation — the sandbox has never
  // entered the registry, or the binding or roster this answer came from was
  // written before incarnations were recorded. The caller must let the request
  // through and count the pass as unprotected.
  EXECUTION_AUTHORITY_UNKNOWN = 1;
  // execution_id comes from an authoritative source and names the incarnation
  // that should be alive, right now, on the node the answer names. This is the
  // only value that licenses a refusal, and it is never reported with an empty
  // execution_id — an authoritative source that has no incarnation to name is
  // UNKNOWN, not an authoritative claim that there is none.
  EXECUTION_AUTHORITY_REGISTRY = 2;
  // The node is about to mint a new incarnation, which is what PLACED and
  // PINNED both mean. execution_id is left empty; a non-empty one would name
  // the previous incarnation and must never be used to refuse.
  //
  // 🔴 Both of those locations report PENDING, and the branch says so
  // explicitly rather than letting the row's value decide. Under PLACED, and
  // under the local_only half of PINNED, the registry's CHECK constraint pins
  // execution_id to NULL, so there is nothing to report. Under the publishing
  // half of PINNED the column is non-empty — and it names a VM that is already
  // stopped, because a pause stops the VM before it uploads. Inferring
  // authority from "is the value empty" therefore gives one location two
  // authority levels, and the stronger of them refuses every data-plane auto
  // resume that branch exists to serve.
  EXECUTION_AUTHORITY_PENDING = 3;
}

message LookupNodeResponse {
  Node node = 1;
  SandboxLocation location = 2;
  // The node that holds the sandbox's local artifacts, as the registry records
  // it. Carried whenever the answer came from a registry row — for PLACED it is
  // the preference the placement was taken against, which may or may not be the
  // node above.
  string origin_node_id = 3;
  // The incarnation this answer points at: the one the scheduler holds as the
  // one that should be alive on the node named above, right now.
  //
  // Not "the value a client should send", and not "an incarnation that once
  // existed". Empty says the scheduler cannot name one, which is what
  // execution_authority = UNKNOWN says as well.
  //
  // Shape follows NodeIdentity.service_instance_id: the string form of a
  // UUIDv7, lowercase canonical, validated server-side.
  string execution_id = 4;
  // What the caller is licensed to do with execution_id. Read this before
  // reading the field above, never after: an empty execution_id is a different
  // fact under UNKNOWN than under PENDING, and REGISTRY never carries one.
  ExecutionAuthority execution_authority = 5;
}

message RecordAssignmentRequest {
  string sandbox_id = 1;
  Node node = 2;
  // Optional: the incarnation the node reported for this sandbox, when the
  // caller could read it off the node's response. Empty is an ordinary answer
  // and only costs authority for the window between the create and the node's
  // first heartbeat — during which the sandbox is brand new and has exactly
  // one incarnation, so nothing can be confused with anything.
  string execution_id = 3;
  // How long the routing projection for this sandbox should live, in whole
  // seconds, as the node that owns the sandbox computed it from its own
  // lifetime ceiling. The node is the only source of truth for this number;
  // the scheduler stores it and never defines it.
  //
  // 🔴 <= 0 means "use the receiver's binding_ttl". It never means "never
  // expires" — a projection that outlives every path that could delete it is
  // a route pointing at a sandbox nobody can reach.
  uint32 projection_ttl_secs = 4;
}

message RecordAssignmentResponse {}

message MachineInfo {
  string cpu_family = 1;
  string cpu_model = 2;
  string cpu_model_name = 3;
  string cpu_architecture = 4;
  string cpu_config_json = 5;
}

message DiskMetric {
  string mount_point = 1;
  string device = 2;
  string filesystem_type = 3;
  uint64 used_bytes = 4;
  uint64 total_bytes = 5;
}

// NodeStatus describes the effective state of a node as derived by the
// scheduler from its discovery state and heartbeat history.
//
//   active  + heartbeat OK      → READY        — accepts new sandboxes
//   active  + no heartbeat      → CONNECTING    — discovered but not yet confirmed
//   active  + heartbeat timeout → UNHEALTHY     — heartbeat lost
//   lingering + heartbeat OK    → LINGERING     — terminating, draining existing work
//   lingering + no heartbeat    → CONNECTING    — terminating, never confirmed
//   lingering + heartbeat timeout → UNHEALTHY   — terminating, heartbeat lost
//
// DRAINING is different in kind from the rows above: it is not derived, it is
// what the node itself reports after being isolated through its own admin API.
// A node reports it while it is still perfectly healthy, so it never overrides
// a derived status — LINGERING and UNHEALTHY both win over it, because a pod
// that is going away, or a node that stopped answering, is the stronger fact.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_READY = 1;
  NODE_STATUS_CONNECTING = 2;
  NODE_STATUS_UNHEALTHY = 3;
  NODE_STATUS_LINGERING = 4;
  // Node-reported isolation: serving existing sandboxes, refusing new work.
  NODE_STATUS_DRAINING = 5;
}

message NodeSnapshot {
  NodeStatus status = 1;
  uint32 allocated_cpu = 2;
  uint64 allocated_memory_bytes = 3;
  uint32 cpu_percent = 4;
  uint32 cpu_count = 5;
  uint64 memory_used_bytes = 6;
  uint64 memory_total_bytes = 7;
  repeated DiskMetric disks = 8;
  uint32 sandbox_count = 9;
  uint32 sandbox_starting_count = 10;
  uint64 create_successes = 11;
  uint64 create_fails = 12;
  int64 reported_at_unix_ms = 13;
  // Paused-sandbox resource accounting. These are *not* included in
  // sandbox_count, allocated_cpu, or allocated_memory_bytes — those report the
  // active running set only. Paused sandboxes have released their VM-side
  // CPU / memory but still own persisted state on the node, so the scheduler
  // can use these fields (together with the active fields) to apply
  // "including paused" capacity limits.
  uint32 paused_sandbox_count = 14;
  uint32 paused_allocated_cpu = 15;
  uint64 paused_allocated_memory_bytes = 16;
}

message P2pEndpoint {
  string backend = 1;
  string address = 2;
}

message ObservedNode {
  string node_id = 1;
  string endpoint = 2;
  string cluster_id = 3;
  string service_instance_id = 4;
  string version = 5;
  string commit = 6;
  MachineInfo machine_info = 7;
  NodeSnapshot snapshot = 8;
  int64 last_seen_unix_ms = 9;
}

message HeartbeatRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  string version = 4;
  string commit = 5;
  MachineInfo machine_info = 6;
  NodeSnapshot snapshot = 7;
  // Deprecated: the roster without incarnations, superseded by `roster` below.
  //
  // 🔴 Kept rather than reserved, for one release cycle. Nodes and the
  // controller roll independently, so mixed versions are certain inside the
  // window, and an empty roster does not read as a degraded report here — it
  // reads as "this node holds no sandboxes at all" and deletes every binding
  // the node owns. A new controller against an old node would therefore have
  // the data plane answer 404 for every sandbox that has never been paused,
  // for the whole rolling window.
  //
  // Removable once heartbeat_legacy_roster_total has been zero across the
  // fleet — not before.
  repeated string sandbox_ids = 8 [deprecated = true];
  P2pEndpoint p2p_endpoint = 9;
  // The sandboxes alive on this node, and the incarnation each is running
  // under. Supersedes sandbox_ids.
  //
  // A node that reports this reports it in full: empty still means "nothing
  // here", exactly as it does above. The receiver distinguishes "this node
  // sent an empty roster" from "this node is too old to send one" by the
  // presence of sandbox_ids, not by this field being empty.
  repeated SandboxRosterEntry roster = 10;
}

// SandboxRosterEntry is one sandbox on a node, as that node reports it.
message SandboxRosterEntry {
  string sandbox_id = 1;
  // Lowercase canonical UUIDv7. Empty means this entry takes no part in
  // binding arbitration — it is unknown, so it may install a binding where
  // there is none but may never displace one that names an incarnation.
  //
  // 🔴 Empty does not mean "drop the entry": the entry still routes. Dropping
  // it would trade away a working route to avoid an unprotected one.
  string execution_id = 2;
  // How long this sandbox's routing projection should live, in whole seconds,
  // as computed by this node. This is the repair path for the same number
  // RecordAssignmentRequest carries: a projection write that was lost gets
  // reinstalled by heartbeat reconciliation, and it must be reinstalled with
  // the sandbox's real budget rather than with the receiver's default.
  //
  // 🔴 <= 0 means "use the receiver's binding_ttl", never "never expires".
  // Absent (an older node) lands on the same fallback, which is exactly the
  // behaviour that shipped before this field existed.
  uint32 projection_ttl_secs = 3;
}

message HeartbeatResponse {
  string cpu_config_json = 1;
}

enum SandboxEventType {
  SANDBOX_EVENT_TYPE_UNSPECIFIED = 0;
  SANDBOX_EVENT_TYPE_CREATE = 1;
  SANDBOX_EVENT_TYPE_DELETE = 2;
  SANDBOX_EVENT_TYPE_PAUSE = 3;
  SANDBOX_EVENT_TYPE_RESUME = 4;
  // Fork events are reported once per child sandbox; sandbox_id and requested
  // resources refer to the child sandbox, not the source sandbox.
  SANDBOX_EVENT_TYPE_FORK = 5;
}

message SandboxEvent {
  string sandbox_id = 1;
  SandboxEventType event_type = 2;
  uint32 requested_cpu = 3;
  uint64 requested_memory_bytes = 4;
  uint64 requested_disk_bytes = 5;
  // The incarnation this event belongs to. A projection delete must be guarded
  // by it: a pause event that arrives late, for a sandbox id that has since
  // been started again elsewhere under a new incarnation, would otherwise tear
  // down the live record.
  //
  // Empty means the reporter is too old to name one, and the event therefore
  // takes no part in the guard — the receiver ignores it for deletes rather
  // than deleting without a guard.
  string execution_id = 6;
}

message ReportSandboxEventRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  repeated SandboxEvent events = 4;
}

message ReportSandboxEventResponse {}

message ListObservedNodesRequest {
  string cluster_id = 1;
}

message ListObservedNodesResponse {
  repeated ObservedNode nodes = 1;
}

message P2pPeer {
  string node_id = 1;
  P2pEndpoint endpoint = 2;
}

message ListP2pPeersRequest {
  string cluster_id = 1;
  string backend = 2;
  string exclude_node_id = 3;
}

message ListP2pPeersResponse {
  repeated P2pPeer peers = 1;
}

message RecordP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message RecordP2pArtifactResponse {}

message ForgetP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message ForgetP2pArtifactResponse {}

message LookupP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string exclude_node_id = 4;
}

message LookupP2pArtifactResponse {
  repeated P2pPeer peers = 1;
}

message GetNodeRequest {
  string node_id = 1;
  string cluster_id = 2;
}

message GetNodeResponse {
  ObservedNode node = 1;
}

message UnregisterNodeRequest {
  string node_id = 1;
  string service_instance_id = 2;
}

message UnregisterNodeResponse {}

// RegistrySandbox is one row of the node-owned `paused_sandboxes` table, read
// only. The scheduler never writes this table; every value here is what the
// nodes agreed on among themselves.
message RegistrySandbox {
  string sandbox_id = 1;
  string cluster_id = 2;
  // One of publishing, paused, resuming, local_only, running. Carried as a
  // string rather than an enum because the set is pinned by a CHECK constraint
  // the nodes own: a value this build has not heard of has to survive the trip
  // to an operator's screen, not be flattened to UNSPECIFIED.
  string state = 3;
  int64 generation = 4;
  // The real machine holding the local artifacts — always the answer to "who
  // owns this row now". A claim deliberately leaves this pointing at the
  // previous holder until mark_running repoints it at the new one, which is
  // the honest continuation of "where the bytes are right now", not a stale
  // value superseded by claimed_by_node_id.
  string origin_node_id = 5;
  // The claimant bringing the sandbox back up: the identity claim_for_resume
  // was called under (an api-replica process, not necessarily a machine that
  // reports a heartbeat). Only set while state is resuming. This is a
  // mutual-exclusion identity, not a routing target — see origin_node_id /
  // holder_node_id for where the sandbox actually is.
  string claimed_by_node_id = 6;
  // Empty while publishing, and while local_only after a failed upload.
  string snapshot_id = 7;
  int64 paused_at_unix_ms = 8;
  int64 updated_at_unix_ms = 9;
  // 0 means the column is NULL, which the nodes treat as already expired.
  int64 lease_expires_at_unix_ms = 10;
  // 0 means the column is NULL, which never matches a reclaim condition.
  int64 sandbox_expires_at_unix_ms = 11;
  // The node this row makes authoritative: always origin_node_id. Derived,
  // not stored.
  //
  // This used to branch on state and answer claimed_by_node_id while
  // resuming. That read as "the claimant is who owns this now", which holds
  // only when the claimant and the holder are the same process — true under
  // --role all, false under --role api|node, where claimed_by_node_id is an
  // api-replica Pod name that never appears in a heartbeat roster. See the
  // registry.go Holder() doc comment and the design-doc revision note at
  // docs/proposals/_design-phase3-gateway.md §5-S5.
  string holder_node_id = 12;
  // The incarnation this row is fenced against. Empty when the row's state
  // pins the column to NULL. Read-only exposure: when one sandbox turns out to
  // be live in two places, this is the only per-row thing to reconcile them
  // against.
  string execution_id = 13;
}

message ListRegistrySandboxesRequest {
  // Optional exact-match filter on state.
  string state = 1;
  // Optional filter on holder_node_id.
  string node_id = 2;
  // 0 means no limit.
  int32 page_size = 3;
  // The next_page_token of the previous response.
  string page_token = 4;
}

message ListRegistrySandboxesResponse {
  repeated RegistrySandbox sandboxes = 1;
  // Empty when the last page has been returned.
  string next_page_token = 2;
  // The database clock the rows were read against. Every lease field above is
  // only meaningful relative to this, never to the reader's own clock.
  int64 database_now_unix_ms = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// PausedRegistry: the paused-sandbox registry, served by whoever owns the
// database instead of by every node against it directly.
//
// The five methods here cover thirteen operations on the node side. The
// narrowing is deliberate: a wire contract shaped like the node's own trait
// would make "the node decides" a cross-process contract, and the next stage
// begins by deleting that. What survives the next stage is shaped like this.
//
// Every request carries cluster_id and node_id. The node scopes each statement
// rather than the connection, and one cluster reaching another's sandboxes is a
// case its tests cover; making the scope implicit here is how that property
// gets lost.
//
// 🔴 No method may answer a failure with an empty result. A sandbox missing
// from GetSandboxes means the row does not exist, and the caller deletes local
// artifacts on the strength of that. Anything that went wrong is an RPC error.
//
// 🔴 Two refusals on this service look alike and are not interchangeable. A
// write from a superseded incarnation is codes.PermissionDenied, and it is
// terminal: the caller must not retry it, must not publish behind it, and must
// not delete the snapshot it was about to replace. A write whose generation
// moved is codes.Aborted, and the caller re-reads the row and tries again.
//
// Wherever the first one has to be named as a string — a header value, a JSON
// body, a log field — the name is `sandbox_execution_superseded`.
//
// 🔴 PermissionDenied belongs to this service alone; see the note on the
// Scheduler service for why it may never appear there.
// ─────────────────────────────────────────────────────────────────────────────
service PausedRegistry {
  // Reads rows in bulk. All-or-nothing: any backend failure is an error, never
  // a shorter map. Carries no metadata — no bulk consumer reads it.
  rpc GetSandboxes(GetSandboxesRequest) returns (GetSandboxesResponse);

  // Moves a sandbox between states. Covers begin_pause, complete_pause,
  // mark_local_only, mark_running, release_claim and remove.
  rpc TransitionSandbox(TransitionSandboxRequest) returns (TransitionSandboxResponse);

  // Takes a sandbox for a resume, deciding on the server which of the three
  // cases applies. Carries metadata, for the one row it answers with.
  rpc AcquireSandbox(AcquireSandboxRequest) returns (AcquireSandboxResponse);

  // Extends the lease on everything a node reports holding.
  rpc RenewNodeLease(RenewNodeLeaseRequest) returns (RenewNodeLeaseResponse);

  // Frees what a previous process on the same machine was holding.
  rpc ReleaseNodeHoldings(ReleaseNodeHoldingsRequest) returns (ReleaseNodeHoldingsResponse);
}

// RegistryEntry is one row, without metadata.
message RegistryEntry {
  string sandbox_id = 1;
  string cluster_id = 2;
  // One of publishing, paused, resuming, local_only, running.
  //
  // A string rather than an enum because the table's CHECK constraint is the
  // source of truth and it belongs to whoever migrates the database. A value
  // this build has not heard of has to reach an operator's screen intact
  // rather than flatten into UNSPECIFIED alongside a genuinely absent one.
  string state = 3;
  int64 generation = 4;
  // The node holding the local artifacts. A claim deliberately leaves this
  // pointing at the previous holder, so it is not the answer to "who owns this
  // row now" while state is resuming — claimed_by_node_id is.
  string origin_node_id = 5;
  // Set only while state is resuming.
  string claimed_by_node_id = 6;
  // Empty while publishing, and after a publish that failed.
  string snapshot_id = 7;
  // 🔴 Microseconds, not nanoseconds and not seconds. PostgreSQL stores
  // timestamptz to the microsecond and the node's clock type is nanosecond, so
  // nanoseconds would round-trip a write as a silently truncated read; seconds
  // would make two transitions within the same second unorderable.
  int64 paused_at_unix_micros = 8;
  int64 updated_at_unix_micros = 9;
  // The incarnation this row is fenced against, empty when the row's state
  // pins the column to NULL.
  //
  // 🔴 The value handed back on a successful claim is the one the claiming
  // node must quote at mark_running. Minting a fresh one there instead does
  // not match mark_running's predicate, and every cross-node resume fails.
  string execution_id = 10;
}

message GetSandboxesRequest {
  string cluster_id = 1;
  repeated string sandbox_ids = 2;
}

message GetSandboxesResponse {
  // Only the sandboxes that have rows. An id that was asked for and is absent
  // from `sandboxes` *and present in* `covered_sandbox_ids` has no row.
  repeated RegistryEntry sandboxes = 1;
  // 🔴 The ids this answer actually covers — every id the server looked up,
  // whether or not it found a row.
  //
  // "All-or-nothing" is the contract, but the caller could not check it: a
  // truncated page, a partial stream or a chunk loop that dropped its tail all
  // look exactly like "those ids have no rows", and the caller's response to
  // "no row" is to tear down a running sandbox and delete its local artifacts.
  // So the coverage travels explicitly and the caller asserts it before
  // treating any absence as authority to delete.
  //
  // An older server leaves this empty; a caller that wants the assertion must
  // treat empty as "not asserted" rather than as "covered nothing".
  repeated string covered_sandbox_ids = 2;
  // The database's own clock, from the same statement that read the rows.
  //
  // Lease arithmetic on a row must not use the reading process's wall clock —
  // that is the mistake `Listing` already carries `now` to avoid. Zero from an
  // older server means "not supplied", not "the epoch".
  int64 now_unix_micros = 3;
}

// TransitionKind is which of the node-side operations this is.
enum TransitionKind {
  TRANSITION_KIND_UNSPECIFIED = 0;
  // Records that a pause has started. Carries metadata and the lease TTL;
  // answers with the generation to quote and the snapshot this pause orphaned.
  TRANSITION_KIND_BEGIN_PAUSE = 1;
  // Publishes the snapshot a pause produced. Requires expect_generation.
  TRANSITION_KIND_COMPLETE_PAUSE = 2;
  // Records that the snapshot never reached the repository. Requires
  // expect_generation.
  TRANSITION_KIND_MARK_LOCAL_ONLY = 3;
  // Records that a sandbox is live on this node. Never creates a row.
  TRANSITION_KIND_MARK_RUNNING = 4;
  // Hands a claimed sandbox back unresumed. Requires expect_generation.
  TRANSITION_KIND_RELEASE_CLAIM = 5;
  // Deletes the row. Requires expect_generation.
  TRANSITION_KIND_REMOVE = 7;
  // Updates sandbox_expires_at alone on a `running` row, fenced on
  // execution_id — never on lease_expires_at, origin_node_id,
  // claimed_by_node_id or generation, and never on a row that is not
  // `running`. This is the api half's own deadline (POST /timeout), not a
  // node's liveness lease, so it carries no node_id-keyed guard the way
  // mark_running's holder write does: nothing about *who* runs the sandbox
  // is read or written here, only *when* it is due to end. Requires
  // execution_id; refuses expect_generation, metadata_json, snapshot_id and
  // holder_node_id, exactly like mark_running refuses the fields it has no
  // use for.
  TRANSITION_KIND_RENEW_DEADLINE = 8;

  // 🔴 6 was TRANSITION_KIND_REMOVE_UNCONDITIONAL, the unconditional delete,
  // and this interface's one unguarded destructive write: the caller read the
  // row, decided it was not live elsewhere, and then deleted it, with the
  // decision and the delete in two statements. A node that had just come back
  // from a partition and had not reconciled yet would take that path against a
  // sandbox already resumed somewhere else, and the delete would succeed,
  // silently, taking the snapshot with it. Guarding it in the caller was
  // exactly the "the node decides" shape phase 2 exists to remove.
  //
  // Reserved rather than recycled: a node still sending 6 would have its
  // unconditional delete silently become whatever took the number over.
  // Holding it makes protoc refuse the reuse on our behalf.
  reserved 6;
  reserved "TRANSITION_KIND_REMOVE_UNCONDITIONAL";
}

message TransitionSandboxRequest {
  string cluster_id = 1;
  string sandbox_id = 2;
  string node_id = 3;
  TransitionKind kind = 4;
  // Required on the four conditional transitions — complete_pause,
  // mark_local_only, release_claim and remove — and refused on the rest.
  //
  // Four, not five: mark_running's predicate is on state and holder, never on
  // generation, so quoting one at it would suggest a guarantee it does not
  // give. (begin_pause creates or takes over a row and has nothing to quote.)
  //
  // remove joined this list in D11. See the `reserved 6` note on
  // TransitionKind for what it used to be guarded against.
  //
  // 🔴 renew_deadline joins mark_running as a kind that never quotes one:
  // its guard is execution_id, the same reason mark_running names for
  // itself.
  optional int64 expect_generation = 5;
  // 🔴 Raw JSON bytes, passed through untouched. Not google.protobuf.Struct:
  // that reorders keys, collapses integers into doubles, and normalises what it
  // does not recognise, and the type on the other side does not reject unknown
  // fields — so a field lost in translation is lost silently.
  bytes metadata_json = 6;
  // 🔴 The lease TTL belongs to the node, not to this service. The node renews
  // on its own cadence and its configuration enforces that the TTL leaves room
  // for two missed renewals; a TTL chosen here instead would expire rows
  // underneath a node that is renewing exactly as it was told to. So it travels
  // with every transition that stamps a lease — which is all of them except
  // remove.
  int64 lease_ttl_millis = 7;
  // complete_pause only.
  string snapshot_id = 8;
  // mark_running and renew_deadline only: when the sandbox is due to end.
  //
  // 🔴 The column it writes is half of what reclamation requires, and until now
  // only renew_lease ever wrote it. A row therefore carried no deadline between
  // being marked running and the node's first renewal — up to one reconcile
  // interval — and reclamation's predicate needs `sandbox_expires_at < now()`,
  // which NULL never satisfies. A node lost inside that window left a row
  // nothing would ever reclaim: not claimable, not removable, forever.
  //
  // renew_deadline closes the other gap in the same column: the api half's
  // own POST /timeout can extend this any number of times after the resume
  // that last wrote it, and until renew_deadline existed nothing carried
  // that extension here — mark_running fires once, at resume, and never
  // again for the rest of the sandbox's run.
  //
  // Absent means the sandbox was asked never to expire, which is a different
  // fact from unknown and is why this is optional rather than a zero.
  optional int64 sandbox_expires_at_unix_micros = 9;
  // Which incarnation of the sandbox is making this write. A UUIDv7 in the
  // same string shape as sandbox_id and cluster_id, lowercase canonical.
  //
  // 🔴 Required on begin_pause, mark_running and renew_deadline, refused on
  // the other five — per-kind and explicit, the same way expect_generation
  // is, so that "this field is required" never has a middle state of
  // "validated when present". renew_deadline's own guard is this field
  // alone (see TransitionKind's doc): unlike begin_pause and mark_running it
  // reads no node_id-keyed identity at all.
  //
  // Deliberately not an opt-in fencing token. e2b's ExpectExecutionID is
  // optional because a caller that has just read the row, or a human giving a
  // direct order, is a legitimate case there; neither is a case here, where
  // every internal caller is "the controller decided, the node executes". An
  // optional fencing token has to keep an "absent means allow" branch, and
  // that branch is the entire attack surface.
  string execution_id = 10;
  // mark_running only: the real machine the sandbox is running on, written
  // into origin_node_id. node_id above stays the CAS guard — the identity
  // claim_for_resume was called under — and is never itself written to
  // origin_node_id by this RPC; the two used to be the same field and a node
  // that conflated them made every cross-node mark_running match zero rows
  // (a0487f0: node_id quoted the real machine at the guard, which is not what
  // claim_for_resume had written to claimed_by_node_id).
  //
  // Empty means "same as node_id", which is both the correct value for any
  // backend that runs its own sandboxes (node_id already names the real
  // machine there) and this field's default for a caller built before it
  // existed — an older node sends nothing here and the controller falls back
  // to node_id exactly as it did when this was one field.
  //
  // 🔴 Same name as RegistrySandbox.holder_node_id above, and now the same
  // meaning too (origin_node_id, always the real machine) — but this one is
  // write-only input to mark_running, while that one is a derived, read-only
  // view of the row. RegistrySandbox.holder_node_id briefly (between
  // a0487f0 and this comment being written) answered claimed_by_node_id
  // while resuming instead, i.e. the claimant, not the machine; deriving a
  // holder that way was the exact mistake a0487f0 made, now fixed. Keep the
  // two aligned — a future divergence would repeat it.
  string holder_node_id = 11;
}

message TransitionSandboxResponse {
  // begin_pause only: the generation to quote when finishing.
  int64 generation = 1;
  // begin_pause only: the snapshot this pause replaced, empty when there was
  // none. Nothing references it once the pause completes.
  string previous_snapshot_id = 2;
  // mark_running only: whether the cluster tracks this sandbox and now names
  // this node as its holder. False means there is no row, which is what a
  // sandbox that has never been paused looks like — not an error.
  //
  // Kept for rollout compatibility; mark_running_outcome says which of the two
  // false cases this is. Equal to (outcome == MARK_RUNNING_OUTCOME_ADOPTED).
  bool tracked = 3;
  // remove only: whether the delete matched. False means the generation quoted
  // was not the row's any more — somebody else has moved it since this caller
  // last read it — which is not an error: the row this caller meant to delete
  // is already gone.
  bool removed = 4;
  // mark_running only. See MarkRunningOutcome.
  MarkRunningOutcome mark_running_outcome = 5;
  // release_claim only: whether the release matched a row.
  //
  // False means the generation quoted was stale, and centrally that is the
  // *only* remaining signal of it — the node used to see the zero-row update
  // itself. Not an error: the claim this caller meant to release is no longer
  // this caller's.
  bool matched = 6;
  // renew_deadline only. See DeadlineRenewalOutcome.
  DeadlineRenewalOutcome deadline_renewal_outcome = 7;
}

// DeadlineRenewalOutcome is which of the three answers renew_deadline gave.
//
// A bare "did it match" would run the same two situations together that
// MarkRunningOutcome exists to split apart: a sandbox this cluster never
// tracked (the common, healthy case — a disabled registry, or a resume whose
// own mark_running has not landed yet) looks identical, as a plain
// zero-rows-affected, to a row that exists but has moved on to a different
// incarnation since the caller last observed it as `running` locally. The
// second case is worth its own name because it is the one a future caller
// might be tempted to retry, and retrying it would attach a stale deadline
// to a sandbox that is not the one that asked for it.
enum DeadlineRenewalOutcome {
  DEADLINE_RENEWAL_OUTCOME_UNSPECIFIED = 0;
  // The row now carries the new deadline.
  DEADLINE_RENEWAL_OUTCOME_RENEWED = 1;
  // No row. What a sandbox this cluster does not track looks like.
  DEADLINE_RENEWAL_OUTCOME_NOT_TRACKED = 2;
  // A row exists, but is not `running` under the incarnation this call
  // named — it has moved on (paused, deleted, or resumed again under a
  // fresh incarnation) since the caller last observed it. The deadline was
  // not written.
  DEADLINE_RENEWAL_OUTCOME_SUPERSEDED = 3;
}

// MarkRunningOutcome splits the two facts the `tracked` bool ran together.
//
// store.go says it plainly: "the difference between 'not tracked' and
// 'somebody else's' — and the caller needs both". Before phase 2 the node read
// the row back to tell them apart; centrally that re-read happens on the
// server, so the distinction has to cross the wire or it is lost.
enum MarkRunningOutcome {
  MARK_RUNNING_OUTCOME_UNSPECIFIED = 0;
  // No row. What a sandbox that has never been paused looks like.
  MARK_RUNNING_OUTCOME_UNTRACKED = 1;
  // There was a row, and it now names this node as the holder.
  MARK_RUNNING_OUTCOME_ADOPTED = 2;
  // There was a row and it belongs to another node, which is still holding it.
  // The caller is running a sandbox the cluster says is somewhere else.
  MARK_RUNNING_OUTCOME_HELD_ELSEWHERE = 3;
}

message AcquireSandboxRequest {
  string cluster_id = 1;
  string sandbox_id = 2;
  string node_id = 3;
  // A successful claim stamps a fresh lease; see TransitionSandboxRequest.
  int64 lease_ttl_millis = 4;
  // Required: the incarnation this node will run the sandbox under once the
  // claim succeeds. Minted before the claim and written by the same statement
  // that sets claimed_by_node_id, so a resuming row names its claimant's new
  // incarnation rather than the stopped one it is replacing — which is what
  // lets a resume window stay fenced instead of going open.
  string execution_id = 5;
}

message AcquiredSandbox {
  RegistryEntry entry = 1;
  // Raw JSON bytes; see TransitionSandboxRequest.metadata_json.
  bytes metadata_json = 2;
  // 🔴 What the row said *before* the claim moved it to resuming, read in the
  // same statement rather than off the returned row — RETURNING hands back the
  // row as the update left it, so reading state there always says resuming.
  //
  // publishing or local_only here means the claim overrode a node that never
  // finished uploading: the sandbox comes back one snapshot behind and the work
  // since then is gone. That is the one event on this path an operator has to
  // be able to find, so it is carried explicitly rather than inferred.
  string previous_state = 3;
}

message AcquireOriginRef {
  // Under not_ready: the node whose local artifacts are the only copy.
  // Under conflict + LIVE_ELSEWHERE: the node holding the live sandbox.
  // Under conflict + CLAIM_LOST: the node that took the claim from this caller.
  string origin_node_id = 1;
  // Set on conflict only; UNSPECIFIED under not_ready and from older servers.
  ConflictReason reason = 2;
}

// ConflictReason splits the two situations a bare conflict ran together.
//
// They call for opposite responses — one means "route the resume to that node",
// the other means "this caller lost a race and must not touch the sandbox" —
// and the central placement decision in phase 3 has to make the same
// distinction from the same field.
enum ConflictReason {
  CONFLICT_REASON_UNSPECIFIED = 0;
  // The sandbox is live on origin_node_id. Nobody may take it.
  CONFLICT_REASON_LIVE_ELSEWHERE = 1;
  // This caller held the claim and no longer does.
  CONFLICT_REASON_CLAIM_LOST = 2;
}

message AcquireSandboxResponse {
  oneof outcome {
    // The caller owns it and must resume it or release the claim.
    AcquiredSandbox claimed = 1;
    // No row: unknown to the cluster.
    AcquireNotFound not_found = 2;
    // Still uploading, so only the origin node can serve this resume.
    AcquireOriginRef not_ready = 3;
    // Live elsewhere, or a claim this caller lost.
    AcquireOriginRef conflict = 4;
  }
}

message AcquireNotFound {}

message HeldSandbox {
  string sandbox_id = 1;
  // When this sandbox is currently due to end. Absent means it was asked never
  // to expire, which is not the same as unknown: reclamation leaves it alone
  // forever.
  optional int64 expires_at_unix_micros = 2;
}

message RenewNodeLeaseRequest {
  string cluster_id = 1;
  string node_id = 2;
  repeated HeldSandbox held = 3;
  int64 lease_ttl_millis = 4;
  // How often this node renews. Reported so the invariant that owns both
  // numbers — a TTL must survive two missed renewals, i.e. ttl >= 3*interval —
  // can be checked somewhere. The node enforces it locally on its own config,
  // but a node built against a different default, or a config that drifted
  // between the two knobs, produces a TTL nothing here could question.
  //
  // 🔴 Reported, not enforced: a disagreement is logged and counted, never
  // refused. Refusing would turn one node's config drift into that node's
  // sandboxes silently expiring — the exact outcome the invariant protects
  // against. Zero means an older node that does not report it.
  int64 reconcile_interval_millis = 5;
}

message RenewNodeLeaseResponse {
  uint64 renewed = 1;
}

message ReleaseNodeHoldingsRequest {
  string cluster_id = 1;
  string node_id = 2;
}

message ReleaseNodeHoldingsResponse {
  // Handed back to the cluster as paused, recoverable from the snapshot they
  // name.
  uint64 released = 1;
  // Deleted because no snapshot was ever published for them, so nothing remains
  // to rebuild the sandbox from.
  uint64 discarded = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// SnapshotCatalog: the snapshot and template catalog, served by whoever owns
// the database instead of by every node against it directly.
//
// Same shape and the same reason as PausedRegistry above. The reason worth
// restating is the one that decided it: only a catalog that lives beside
// `paused_sandboxes` can put a pause's registry transition and the catalog's
// own row in *one* statement. A node holding its own connection would have two,
// on two sockets, and "paused but absent from the catalog" would stay a window
// that exists. Every write RPC below therefore carries an optional
// CatalogPausedTransition, and that field is the whole point of the service.
//
// 🔴 The payload is opaque here and must stay opaque. `committed_payload` is a
// CommittedSnapshot as the node serialised it; `build_error_json` is a
// TemplateBuildErrorReason, which has a hand-written Deserialize with a legacy
// string form. Neither has a Go type, neither may grow one. What this service
// is allowed to know is the scalar columns — enough to index, filter, order and
// fence, and nothing else. A Go struct mirroring CommittedSnapshot is the
// failure this note exists to prevent: it makes the node's domain model a
// cross-process contract, and the phase after this one begins by deleting the
// process on the other end.
//
// 🔴 Milliseconds, not the microseconds PausedRegistry uses. The two services
// disagree on purpose: `paused_sandboxes` stores timestamptz, whose resolution
// is a microsecond, while the catalog's time columns are BIGINT milliseconds
// because SnapshotRecord.created_at_unix_ms is an i64 of milliseconds and the
// public pagination cursor is rendered from it. Passing microseconds here would
// round-trip a cursor through a unit it does not have and land the boundary on
// the wrong row. The one exception is inside CatalogPausedTransition, which
// speaks to the other table and keeps that table's unit.
//
// 🔴 A refusal this service expects is an outcome, not a status code. A commit
// that lost its fence, an alias somebody else holds, a template already
// building — the caller branches on all three, and a gRPC code cannot carry
// which row won or what the status is now. Status codes stay for the failures
// nobody can act on: UNAVAILABLE until the migration has run, and the usual
// transport faults. No method may report a failure as an empty success.
// ─────────────────────────────────────────────────────────────────────────────
service SnapshotCatalog {
  // Creates the catalog row before any bytes exist: a template at `waiting`, or
  // the `building` row a pause opens. Carries begin_pause when it is a pause.
  rpc BeginSnapshot(BeginSnapshotRequest) returns (BeginSnapshotResponse);

  // Flips a row to `ready` — the only writer that does. Fenced on the row still
  // being `building`. Carries complete_pause, or mark_local_only when the bytes
  // reached the node but not the shared repository.
  rpc CommitSnapshot(CommitSnapshotRequest) returns (CommitSnapshotResponse);

  // Moves a row to `error` with a reason. Covers a failed template build and a
  // pause whose publish produced no payload at all.
  rpc FailSnapshot(FailSnapshotRequest) returns (FailSnapshotResponse);

  // Reads one row by id or alias.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);

  // Reads one keyset page.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Soft-deletes one row and drops the alias that pointed at it.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);

  // Resolves an alias to the snapshot id it currently names.
  rpc ResolveAlias(ResolveAliasRequest) returns (ResolveAliasResponse);

  // Admits one build: the cluster-wide cap, the per-template exclusion and the
  // waiting -> building transition, in one transaction.
  rpc StartBuild(StartBuildRequest) returns (StartBuildResponse);

  // Says the builder is still alive. A build that stops saying so is reaped,
  // and the answer tells the builder it was.
  rpc RenewBuildLease(RenewBuildLeaseRequest) returns (RenewBuildLeaseResponse);

  // Reads one build row, deliberately without the `ready` predicate every
  // resolving query carries: this endpoint exists to look at builds that are
  // still running or have failed.
  rpc GetBuild(GetBuildRequest) returns (GetBuildResponse);
}

// SnapshotRow is one catalog row, scalar columns plus two opaque blobs.
message SnapshotRow {
  string snapshot_id = 1;
  string cluster_id = 2;

  // One of `template`, `sandbox`. A string rather than an enum for the reason
  // RegistryEntry.state gives: the table's CHECK constraint is the source of
  // truth and it belongs to whoever migrates the database, so a value this
  // build has not heard of must reach a screen intact rather than flatten into
  // UNSPECIFIED beside a genuinely absent one.
  string source_kind = 3;
  // Set exactly when source_kind is `sandbox`; the table's CHECK pins the
  // equivalence in both directions.
  string source_sandbox_id = 4;

  uint32 cpu_count = 5;
  uint32 memory_mib = 6;
  uint32 disk_size_mib = 7;

  // One of `waiting`, `building`, `ready`, `error`. See source_kind on why it
  // is a string.
  string status = 8;
  // One of `pending`, `in_progress`, `ready`, `failed`. Derived from `status`
  // by a trigger and never written by a caller — it is here so a reader does
  // not have to re-derive the mapping the partial indexes were built on.
  string status_group = 9;

  // Empty when no alias points here. At most one does; the catalog holds that
  // to one with a unique index, because SnapshotRecord.alias is an Option and
  // not a collection, and a second row would duplicate this snapshot inside a
  // page that joins the two tables.
  string alias = 10;

  int64 created_at_unix_ms = 11;
  int64 updated_at_unix_ms = 12;
  // When the sandbox this snapshot was taken from first started. Absent for
  // template rows and for older writers.
  optional int64 sandbox_started_at_unix_ms = 13;

  // 🔴 A CommittedSnapshot exactly as the node serialised it. Empty means the
  // row has no payload — which the table states as `status <> 'ready' OR
  // committed_payload IS NOT NULL`, so an empty payload here and a `ready`
  // status cannot both be true. Empty is safe as "absent" because no
  // serialisation of that type is zero bytes.
  bytes committed_payload = 14;
  // Which version of the payload encoding this is. Absent exactly when the
  // payload is. The node refuses a version it does not know; nothing here
  // interprets it.
  optional uint32 committed_schema = 15;

  // 🔴 A TemplateBuildErrorReason as JSON, passed through untouched. Empty when
  // the row is not in error. Not google.protobuf.Struct, for the reason
  // TransitionSandboxRequest.metadata_json gives.
  bytes build_error_json = 16;

  // Projected from the `builds` row when the caller asked for it, so a template
  // row can be rendered as a TemplateBuildInfo without a second round trip.
  // Both absent when no build has been started yet.
  optional int64 build_started_at_unix_ms = 17;
  optional int64 build_finished_at_unix_ms = 18;

  // ── origin pinning ──────────────────────────────────────────────────────
  //
  // 🔴 These two are a block, and they are numbered away from everything else
  // so that removing them is a removal. The day `local_only` stops happening,
  // the catalog drops two columns, this service drops these two fields into
  // `reserved`, and nothing above renumbers. Keeping them at 100 is what makes
  // that true — appending them after field 18 would put the next field added
  // on top of the hole they leave.
  //
  // published=false means the bytes never left the node named below, so only
  // that node can start this snapshot. published=true leaves origin_node_id as
  // a placement hint that may be empty and may be wrong; a hint that misses is
  // not an error and must not send anything back to the named node.
  //
  // 🔴 Neither is a filter. A snapshot that failed to publish is a complete,
  // runnable snapshot — it is `ready` — and listing hides it from nobody. The
  // one consumer is the function that decides where a resume may run.
  bool published = 100;
  string origin_node_id = 101;
}

// BuildRow is one row of the build queue.
message BuildRow {
  string build_id = 1;
  // Today the API forces this equal to build_id. The column is separate anyway:
  // splitting a table later costs far more than carrying two ids that happen to
  // match.
  string template_id = 2;
  string cluster_id = 3;
  // See SnapshotRow.status / .status_group.
  string status = 4;
  string status_group = 5;
  // The machine running this build. Empty for a queued build nobody has taken.
  string node_id = 6;
  // When the builder last said it was alive. Absent means it never has, which
  // is why the reaper only acts on rows that carry one.
  optional int64 heartbeat_at_unix_ms = 7;
  int64 created_at_unix_ms = 8;
  optional int64 started_at_unix_ms = 9;
  optional int64 finished_at_unix_ms = 10;
  // A TemplateBuildErrorReason as JSON. See SnapshotRow.build_error_json.
  bytes error_reason_json = 11;
}

// CatalogPausedTransition is the `paused_sandboxes` half of a catalog write.
//
// 🔴 This is why the catalog is served here rather than read by the node. The
// server puts this transition and the catalog row in one statement, so a pause
// cannot end up recorded in one table and not the other. Absent means there is
// no registry half — the template build path, which has no sandbox.
//
// The fields mirror TransitionSandboxRequest, including its units: this half
// writes timestamptz columns and keeps microseconds while everything else on
// this service is milliseconds.
message CatalogPausedTransition {
  // Which transition to apply. BEGIN_PAUSE on BeginSnapshot; COMPLETE_PAUSE or
  // MARK_LOCAL_ONLY on CommitSnapshot; MARK_LOCAL_ONLY on FailSnapshot. Any
  // other value is refused rather than ignored.
  TransitionKind kind = 1;
  string sandbox_id = 2;
  // Required on COMPLETE_PAUSE and MARK_LOCAL_ONLY, refused on BEGIN_PAUSE,
  // which creates or takes over a row and has nothing to quote.
  optional int64 expect_generation = 3;
  // Raw JSON, passed through untouched. BEGIN_PAUSE only.
  bytes metadata_json = 4;
  // The lease TTL belongs to the node; see TransitionSandboxRequest.
  int64 lease_ttl_millis = 5;
  // Which incarnation is writing. Required on BEGIN_PAUSE.
  string execution_id = 6;
  // 🔴 Microseconds, matching the column. See the note on this message.
  optional int64 sandbox_expires_at_unix_micros = 7;
}

// CatalogRejection is a refusal the caller has to act on, as opposed to a
// failure it can only report.
enum CatalogRejection {
  CATALOG_REJECTION_UNSPECIFIED = 0;
  // No row with that id, or none that has not been soft-deleted.
  CATALOG_REJECTION_NOT_FOUND = 1;
  // The fencing predicate did not match: the row is no longer in the status
  // this call acts from. observed_status says what it is now.
  CATALOG_REJECTION_STATUS_MISMATCH = 2;
  // The alias is bound to another live snapshot, named by
  // alias_holder_snapshot_id. The whole write is refused rather than committed
  // without the alias, which is what the object-store backend does today.
  CATALOG_REJECTION_ALIAS_TAKEN = 3;
  // The `paused_sandboxes` half moved since the caller last read it. Re-read
  // and try again — this is the Aborted case, not the terminal one.
  CATALOG_REJECTION_GENERATION_MISMATCH = 4;
  // 🔴 Terminal. A superseded incarnation tried to write. The caller must not
  // retry, must not publish behind it, and must not delete the snapshot it was
  // about to replace. Named `sandbox_execution_superseded` wherever this has to
  // be a string, exactly as on PausedRegistry.
  CATALOG_REJECTION_EXECUTION_SUPERSEDED = 5;
  // Another build for this template is already pending or in progress, named by
  // active_build_id. The partial unique index is what decides this.
  CATALOG_REJECTION_BUILD_IN_PROGRESS = 6;
  // The cluster is at its concurrent-build ceiling. Retryable, unlike the one
  // above: nothing about this template is wrong.
  CATALOG_REJECTION_BUILD_QUEUE_FULL = 7;
  // A row with this id already exists. BeginSnapshot only.
  CATALOG_REJECTION_ALREADY_EXISTS = 8;
}

// CatalogRejected carries the refusal and whatever the caller needs to act on
// it. Every field but `reason` is set only for the reasons that name it.
message CatalogRejected {
  CatalogRejection reason = 1;
  // STATUS_MISMATCH: the status the row carries now.
  string observed_status = 2;
  // ALIAS_TAKEN: who holds it.
  string alias_holder_snapshot_id = 3;
  // BUILD_IN_PROGRESS: which build is holding the template.
  string active_build_id = 4;
  // GENERATION_MISMATCH: the generation the registry row carries now, so the
  // caller can re-read against a number rather than blind.
  optional int64 observed_generation = 5;
}

message BeginSnapshotRequest {
  string cluster_id = 1;
  // The node making the request. For a pause this is where the bytes are going
  // to land, which is why it is also the origin below.
  string node_id = 2;

  string snapshot_id = 3;
  // `template` or `sandbox`; see SnapshotRow.source_kind. Immutable once set —
  // CommitSnapshot cannot change it.
  string source_kind = 4;
  string source_sandbox_id = 5;

  uint32 cpu_count = 6;
  uint32 memory_mib = 7;
  uint32 disk_size_mib = 8;

  // Bound in the same transaction as the row. Empty means no alias. An alias
  // another live snapshot holds refuses the whole call — see ALIAS_TAKEN.
  string alias = 9;

  // The node's clock, not the database's. The catalog stores what the node
  // recorded so a row and its object-store mirror carry the same instant during
  // the double-write phase; a server-side now() would make every mirrored row
  // differ by the RPC's latency.
  int64 created_at_unix_ms = 10;
  optional int64 sandbox_started_at_unix_ms = 11;

  // 🔴 Written, never checked, in this phase. It is here so that the phase that
  // runs several writers can add the predicate without a migration that has to
  // backfill a column onto rows already in flight.
  string publishing_execution_id = 12;

  // The registry half; absent for a template build.
  optional CatalogPausedTransition paused_transition = 13;

  // Which status the new row starts in: `waiting` for a template nobody has
  // built yet, `building` for a pause that is already writing bytes. Refused
  // for any other value — a row cannot be born `ready`, because `ready`
  // requires a payload and there is none yet.
  string status = 14;

  // See SnapshotRow. A pause opens its row unpublished and names itself; a
  // template row is born published with no origin, because nothing is on any
  // node yet.
  bool published = 100;
  string origin_node_id = 101;
}

message BeginSnapshotResponse {
  oneof outcome {
    BeganSnapshot began = 1;
    CatalogRejected rejected = 2;
  }
}

message BeganSnapshot {
  SnapshotRow row = 1;
  // BEGIN_PAUSE only: the generation to quote when finishing.
  optional int64 generation = 2;
  // BEGIN_PAUSE only: the snapshot this pause replaced, empty when there was
  // none. Nothing references it once the pause completes.
  string previous_snapshot_id = 3;
}

message CommitSnapshotRequest {
  string cluster_id = 1;
  string node_id = 2;
  string snapshot_id = 3;

  // 🔴 Required and non-empty. The table refuses a `ready` row without one, and
  // this is the only call that produces a `ready` row.
  bytes committed_payload = 4;
  uint32 committed_schema = 5;

  // Publish metadata may restate the resources; absent means leave the row's.
  optional uint32 cpu_count = 6;
  optional uint32 memory_mib = 7;
  optional uint32 disk_size_mib = 8;

  // Bound in the same transaction. Empty leaves whatever the row already has,
  // which is not the same as unbinding it — there is no unbind on this call.
  string alias = 9;
  int64 updated_at_unix_ms = 10;

  // The registry half; absent for a template build.
  //
  // COMPLETE_PAUSE with published=true is the ordinary path. MARK_LOCAL_ONLY
  // with published=false is the publish that never reached shared storage: the
  // row still goes `ready`, because the snapshot is complete and the origin can
  // start it. Which of the two it was is a fact about the sandbox, and it stays
  // in `paused_sandboxes` rather than being copied here.
  optional CatalogPausedTransition paused_transition = 11;

  // 🔴 Ignored in this phase, checked in the next. When the catalog has several
  // writers, a commit whose incarnation is not the one the row was opened under
  // is EXECUTION_SUPERSEDED. Until then the fence is the status predicate the
  // server always applies, which the caller cannot turn off.
  string publishing_execution_id = 12;

  bool published = 100;
  string origin_node_id = 101;
}

message CommitSnapshotResponse {
  oneof outcome {
    SnapshotRow committed = 1;
    CatalogRejected rejected = 2;
  }
}

message FailSnapshotRequest {
  string cluster_id = 1;
  string node_id = 2;
  string snapshot_id = 3;
  // A TemplateBuildErrorReason as JSON. Required: the table refuses an `error`
  // row without one, so that "it failed" and "why" cannot come apart.
  bytes build_error_json = 4;
  int64 updated_at_unix_ms = 5;
  // The registry half, when a pause is what failed. MARK_LOCAL_ONLY only.
  optional CatalogPausedTransition paused_transition = 6;
  // Ends the build row too, when this snapshot has one in flight. False leaves
  // it alone, which is what a caller that is only recording a publish failure
  // wants.
  bool fail_active_build = 7;
}

message FailSnapshotResponse {
  oneof outcome {
    SnapshotRow failed = 1;
    CatalogRejected rejected = 2;
  }
}

message GetSnapshotRequest {
  string cluster_id = 1;
  // A snapshot id or an alias. Which one it is, the server decides — the node's
  // own get() takes the same union and callers do not know which they hold.
  string id_or_alias = 2;
  // 🔴 Whether to drop the `status_group = 'ready'` predicate.
  //
  // False — the zero value, and what a caller that never heard of this field
  // sends — keeps the predicate, which is what stops a half-uploaded snapshot
  // from starting a VM. True is for the endpoint that reports build status,
  // which exists precisely to see rows that are building or failed.
  //
  // 🔴 Stated this way round because proto3 cannot make a bool required and an
  // absent field is indistinguishable from false. Spelled as `only_ready`, the
  // value a forgetful caller sends is the one that resolves a snapshot whose
  // bytes are still uploading; spelled this way, forgetting it costs a caller
  // nothing worse than not seeing its own failed build.
  bool allow_any_status = 3;
  // Include the build row's timestamps in the answer.
  bool with_build = 4;
}

message GetSnapshotResponse {
  // Absent when there is no such row, or when the ready predicate excluded it. Not an
  // error: "no such snapshot" is an answer.
  optional SnapshotRow row = 1;
}

// SnapshotCursor is a keyset position: the last row of the previous page.
//
// 🔴 Not the public cursor. The public one is a base64url string with an
// RFC3339 rendering inside it, and it is a response header on an OpenAPI
// endpoint — changing its shape breaks in-flight clients and makes a rollback
// lossy. It is parsed and rendered by the node; only the two values it decodes
// to travel here.
message SnapshotCursor {
  int64 created_at_unix_ms = 1;
  // Compared as text, not as a uuid. The public cursor orders by the id's
  // string form, and a uuid's binary order is not its text order — comparing
  // the wrong one skips rows at a page boundary without any error.
  string snapshot_id = 2;
}

// SnapshotFilter mirrors the node's SnapshotListFilter field for field. Every
// field is a conjunct; all empty matches everything the query's own predicates
// allow.
message SnapshotFilter {
  // `template`, `sandbox`, or both. Empty means no restriction.
  repeated string source_kinds = 1;
  optional string alias_prefix = 2;
  repeated string snapshot_ids = 3;
  // A single id or an exact alias.
  optional string snapshot_id_or_alias = 4;
  // Matches sandbox rows only, by construction: template rows have no source
  // sandbox and the table's CHECK enforces it.
  optional string source_sandbox_id = 5;
  // Template build statuses to keep. Matches template rows only.
  //
  // 🔴 Meaningful only when allow_any_status is true. Asking for `building`
  // rows under the ready predicate is a filter that can never match, and a
  // caller that does it is reading an empty page as "there are none".
  repeated string template_statuses = 6;
}

message ListSnapshotsRequest {
  string cluster_id = 1;
  SnapshotFilter filter = 2;
  // Absent starts at the newest row. The server does not need a sentinel for
  // that case; the node's own open-ended cursor is one and it does not travel.
  optional SnapshotCursor cursor = 3;
  // 🔴 Capped by the server, and a request for none is not a request for all.
  // The node's HTTP layer treats a missing limit as "every row", which is how a
  // single request comes to pull ten thousand rows into memory. Here zero means
  // "the server's default".
  uint32 limit = 4;
  // See GetSnapshotRequest.allow_any_status. The listing endpoints leave it
  // false; the one that reports build status sets it.
  bool allow_any_status = 5;
  bool with_build = 6;
}

message ListSnapshotsResponse {
  repeated SnapshotRow rows = 1;
  // Absent on the last page. Rendered into the public token by the node.
  optional SnapshotCursor next_cursor = 2;
}

message DeleteSnapshotRequest {
  string cluster_id = 1;
  // Id or alias, as on GetSnapshotRequest.
  string id_or_alias = 2;
  int64 deleted_at_unix_ms = 3;
}

message DeleteSnapshotResponse {
  // False when there was nothing to delete. Idempotent by contract, so that is
  // a success and not a rejection.
  bool deleted = 1;
  // The row that was deleted, so the caller can find the artifacts to collect.
  // Absent when `deleted` is false.
  optional SnapshotRow row = 2;
}

message ResolveAliasRequest {
  string cluster_id = 1;
  string alias = 2;
  // See GetSnapshotRequest.allow_any_status. Resolving in order to run means
  // leaving it false, which is also what forgetting it does.
  bool allow_any_status = 3;
}

message ResolveAliasResponse {
  // Empty when the alias names nothing — or names a row the ready predicate
  // excluded, which is the same answer to the caller and deliberately so.
  string snapshot_id = 1;
  // 🔴 Projected, never filtered on. Present so a resume can be pinned without
  // a second read; see the note on SnapshotRow's origin block.
  bool published = 100;
  string origin_node_id = 101;
}

message StartBuildRequest {
  string cluster_id = 1;
  string node_id = 2;
  // Today the API forces these equal. Sent separately anyway; see BuildRow.
  string build_id = 3;
  string template_id = 4;
  int64 started_at_unix_ms = 5;
  // The first heartbeat, stamped by the same statement that admits the build.
  //
  // 🔴 Not optional in practice: the reaper only acts on rows carrying one, so
  // a build admitted without a heartbeat is a build nothing can ever clean up —
  // and the partial unique index would then block that template forever.
  int64 heartbeat_at_unix_ms = 6;
}

message StartBuildResponse {
  oneof outcome {
    StartedBuild started = 1;
    CatalogRejected rejected = 2;
  }
}

message StartedBuild {
  BuildRow build = 1;
  // The template row as the transition left it: `building`.
  SnapshotRow snapshot = 2;
}

message RenewBuildLeaseRequest {
  string cluster_id = 1;
  string node_id = 2;
  string build_id = 3;
  int64 heartbeat_at_unix_ms = 4;
}

message RenewBuildLeaseResponse {
  // 🔴 False means this build is no longer the live one — reaped for a lapsed
  // heartbeat, or finished by somebody else. The builder must stop, because the
  // template it holds has already been handed to whoever asked next.
  //
  // Nothing else tells it. Without this the reaper frees the row, a second
  // build starts, and two builders publish into the same template.
  bool live = 1;
}

message GetBuildRequest {
  string cluster_id = 1;
  string build_id = 2;
}

message GetBuildResponse {
  // Absent when there is no such build. 🔴 No ready predicate on this path: it
  // is the one endpoint whose whole purpose is to see a build that is still
  // running or has failed.
  optional BuildRow build = 1;
}
