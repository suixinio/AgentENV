[package]
name = "uvm-nbd"
version = "0.1.0"
edition = "2021"

[lib]
name = "uvm_nbd"
path = "src/lib.rs"

[[bin]]
name = "uvm-nbd"
path = "src/main.rs"

[dependencies]
storage-util = { path = "../util" }
overlaybd = { path = "../overlaybd" }

anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1.88"
clap = { version = "4.5.38", features = ["derive"] }
libc = "0.2.174"
nix = { version = "0.30.1", features = ["ioctl", "socket"] }
parking_lot = "0.12.5"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
