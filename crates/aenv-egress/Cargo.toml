[package]
name = "aenv-egress"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "aenv_egress"
path = "src/lib.rs"

[[bin]]
name = "aenv-egress"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = ["core"]
# The contract, framing, dispatch and the embedded transport. This is all
# `aenv-node` needs to run the broker in-process; nothing under it terminates
# or originates TLS.
core = []
# The node-local Unix socket, both ends: the runtime's transport to the broker
# on this same machine and the broker's accept loop. No TLS, and the peer's
# uid is the identity.
local = ["dep:metrics"]
# Leaf certificate signing, the upstream TLS client and the `http` handler,
# openssl only. The broker binary enables it; `make check-crate-boundaries`
# fails if `aenv-node` does.
tls = [
    "dep:openssl",
    "dep:native-tls",
    "dep:tokio-native-tls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:http",
    "dep:metrics",
]
# The broker's only credential source: an HTTP resolve endpoint, served by
# the api half or by an operator's own service.
resolver = ["dep:reqwest"]
# Everything the `aenv-egress` binary needs on top of the library features.
bin = [
    "tls",
    "resolver",
    "local",
    "dep:clap",
    "dep:confique",
    "dep:tracing-subscriber",
    "dep:metrics-exporter-prometheus",
]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
hmac = "0.12"
ipnetwork = "0.21"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
zeroize = "1"
anyhow = "1.0.100"
openssl = { version = "0.10", optional = true }
native-tls = { version = "0.2", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
hyper = { version = "1", features = ["http1", "server", "client"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
http = { version = "1", optional = true }
metrics = { version = "0.24", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2"], optional = true }
# The binary only.
clap = { version = "4", features = ["derive"], optional = true }
confique = { version = "0.4.0", features = ["toml"], optional = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"], optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"], optional = true }

[dev-dependencies]
axum = "0.8"
# `getuid`, so a test can say which uid this process is; nothing the broker
# ships asks that question.
libc = "0.2"
tempfile = "3.22.0"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
