apiVersion: v1
kind: Service
metadata:
  name: agentenv-scheduler
  labels:
    app.kubernetes.io/name: agentenv-scheduler
spec:
  selector:
    app.kubernetes.io/name: agentenv-scheduler
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    # The scheduler has always served Prometheus metrics on its own listener;
    # without a Service port nothing could scrape them.
    - name: metrics
      port: 9101
      targetPort: metrics
