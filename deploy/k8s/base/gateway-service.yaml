# The sandbox data-plane entry point.
#
# 🔴 `http` below is the address a client's `proxy_url` names: Host-routed
# (`{port}-{sandboxID}.<domain>`) and routing-header
# (`x-agentenv-sandbox-id` / `x-agentenv-target-port`) traffic. REST belongs to
# `agentenv-api`, which is the client's `url`.
apiVersion: v1
kind: Service
metadata:
  name: agentenv-gateway
  labels:
    app.kubernetes.io/name: agentenv-gateway
spec:
  selector:
    app.kubernetes.io/name: agentenv-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Same reason as the scheduler's: the metrics listener is separate from the
    # proxied HTTP port, so it needs a Service port of its own to be scraped.
    - name: metrics
      port: 9102
      targetPort: metrics
