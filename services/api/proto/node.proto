syntax = "proto3";

package agentenv.node.v1;

// The commands one AgentENV node accepts from the API half of the split, and
// the one question it answers about itself.
//
// 🔴 **This service is the whole remoteable surface, and `SandboxBackend` is
// not part of it.** Three of that trait's return types hold live local state —
// `PausedSandboxCapture`, `CapturedSandboxSnapshot` and `RuntimeArtifactSet` —
// and two of them keep a temporary directory alive. Nothing here returns a
// handle: every reply is an identifier or a fact, and where the local trait
// hands back something that owns bytes, this one hands back where the bytes
// already are.
//
// 🔴 **No Go consumer, on purpose.** `services/Makefile` compiles an explicit
// list of protos for Go and this file is deliberately not on it: both ends of
// this service are Rust, so generating a `.pb.go` nobody imports would only add
// a second artifact to keep in step. That is also what makes it defensible for
// a few fields here to carry Rust serde encodings rather than mirrored proto
// messages — see `SerializedValue`.
service NodeSandboxService {
  // Builds one sandbox and starts it, in one call.
  //
  // 🔴 `SandboxBackend` splits this into `build` + `start`/`start_nowait` +
  // `wait_for_ready`, and that split does not cross a process boundary:
  // "constructed but not started" is an in-process intermediate state, and
  // exposing it here would mean giving it a remote lifetime — an owner, a
  // timeout, and a way to be abandoned — that nothing needs.
  rpc Create (SandboxCreateRequest) returns (SandboxCreateResponse);

  // Tears the sandbox down on this node and forgets it.
  rpc Delete (SandboxDeleteRequest) returns (SandboxDeleteResponse);

  // Pauses the sandbox, stops it, and returns what is needed to bring it back
  // — here or, when it was published, anywhere.
  //
  // 🔴 **Every failure on this call carries a capture classification**, and
  // not only the ones that come from a capture. The caller reads an
  // unclassified failure as terminal — meaning "the runtime was mutated past
  // safe resume, tear it down" — so a refusal that never reached the runtime
  // has to say so, or a fence check arriving a moment late deletes a running
  // sandbox.
  rpc Pause (SandboxPauseRequest) returns (SandboxPauseResponse);

  // Captures a snapshot of a running sandbox and leaves it running.
  rpc Checkpoint (SandboxCheckpointRequest) returns (SandboxCheckpointResponse);

  // Reopens the capture this node is holding, under the incarnation the
  // caller's resume claim allocated.
  //
  // 🔴 **Nothing about the capture travels on this call, and that is the
  // point.** `Pause` hands the API half a `PausedState`, and the API half
  // stores it — but what it stores is a path on *this* node's disk plus this
  // node's own encoding of its backend state. The bytes never moved, so
  // reopening them is not a matter of sending them back; it is a matter of
  // asking the machine they are on. What crosses is therefore an identity, a
  // fence, and the run to start.
  //
  // 🔴 **This is the pinned arm of the two a paused sandbox has, and only that
  // one.** A sandbox whose capture was published to shared storage can be
  // rebuilt anywhere, and that is a `Create` with a `SnapshotSource` — a
  // different call, answered by a node that has never seen this sandbox. This
  // one is for the sandbox whose only copy is on one machine's disk, and it is
  // addressed to that machine or to nobody.
  //
  // 🔴 A node that does not hold the capture answers `NOT_FOUND`, and a node
  // that could not look answers something else. The caller acts on the
  // difference: the first means the only copy is gone and the sandbox has to
  // be rebuilt from a published snapshot or given up on, the second means ask
  // again. Collapsing them destroys a sandbox whose bytes are fine.
  rpc Resume (SandboxResumeRequest) returns (SandboxResumeResponse);

  // Forks one running sandbox into running children on this same node.
  rpc Fork (SandboxForkRequest) returns (SandboxForkResponse);

  // Replaces a running sandbox's egress policy.
  rpc UpdateNetwork (SandboxNetworkRequest) returns (SandboxNetworkResponse);

  // Assigns already-approved custom extension params to a running sandbox.
  rpc UpdateParams (SandboxParamsRequest) returns (SandboxParamsResponse);

  // What this node is running for one sandbox, named by id.
  //
  // 🔴 A point lookup, and deliberately not `ListSandboxes` with a filter.
  // That listing answers *which of the control plane's sandboxes are on this
  // node*, and to answer it it drops every sandbox carrying no ownership
  // marker. A fork child started through the API half carries none, so a
  // listing is the one shape guaranteed to be missing exactly the sandboxes
  // this call exists for. The question here is a different one: the caller
  // already holds the record for this id and is asking the machine what it is
  // running under it.
  //
  // 🔴 Three answers, and they stay three. The facts; `NOT_FOUND`, which means
  // the node looked and is running nothing under that id; and any other status
  // — or no answer at all — which means the node could not be asked. Only the
  // first two are claims about the sandbox, and a caller that folded the third
  // into the second would read a slow network as a sandbox that had gone.
  rpc Describe (SandboxDescribeRequest) returns (SandboxDescribeResponse);

  // What this node is actually running, of the sandboxes the control plane
  // owns.
  //
  // 🔴 The membership of the answer comes from the node's table of live
  // sandbox handles and not from its metadata store. The store is what the
  // node *claims* to hold; the handle table is what it *holds*. Reconciling a
  // claim against a claim is how a discrepancy stays invisible.
  //
  // 🔴 A node that cannot answer must fail the call. There is no reply that
  // means "I could not look": an empty list means this node is running none of
  // the control plane's sandboxes, and it is consumed as evidence for deciding
  // that a sandbox is an orphan.
  rpc ListSandboxes (ListSandboxesRequest) returns (SandboxListResponse);

  // Runs one template build — a throwaway sandbox driven through RUN/ENV/...
  // steps and captured at the end — entirely on this node, and stages the
  // result for the caller to announce.
  //
  // 🔴 **Not a sandbox, and not on the `ListSandboxes` roster.** The build VM
  // this spins up never goes through `Create`, carries no
  // `control_plane_config`, and is torn down before this call returns either
  // way. It exists so `aenv-api`, which has no `/dev/kvm`, no `regctl` and
  // no Firecracker binary of its own, can still build templates — see
  // `TemplateBuildRunner` (`src/template/runner.rs`), which is what actually
  // runs on this node and is otherwise reached only from the pre-split single process.
  //
  // 🔴 **Stages, and does not commit.** The same split as `Pause`'s `staged`
  // arm and `Checkpoint`: the bytes are durable on this node's repository
  // backend the moment this call returns successfully, but no catalog row
  // exists until the caller announces `TemplateBuildResponse.staged`. See
  // `NodeSandboxService::build_template` for how that reuses
  // `SnapshotManager::stage_captured`'s `adopt_staged` path rather than
  // inventing a second "remote commit" mechanism.
  //
  // 🔴 **This is the long call on this service.** A build can legitimately
  // run for most of `TemplateBuildRunner::READY_TIMEOUT` (ten minutes) with
  // nothing on the wire in either direction, which is nothing like this
  // service's other RPCs. The caller (`src/node_client/build.rs`) dials a
  // dedicated connection carrying its own generous call timeout and HTTP/2
  // keepalive, precisely so a connection this quiet is never mistaken for
  // idle by whatever sits between the two Pods, and so a genuinely dead peer
  // is still noticed well inside that timeout.
  rpc BuildTemplate (TemplateBuildRequest) returns (TemplateBuildResponse);
}

// ---------------------------------------------------------------------------
// Shared shapes
// ---------------------------------------------------------------------------

// A Rust value carried as its serde encoding, with the version of the schema
// that produced it.
//
// 🔴 A deliberate, bounded exception to "model it in proto". It is used only
// for values that are already defined as serialisable Rust types with their own
// compatibility rules, where a mirrored proto message would be a second
// definition of the same schema that has to be kept in step by hand. Both ends
// of this service are Rust.
//
// 🔴 They are no longer deployed from one image, and that changed what this
// exception costs.
//
// This doc used to say "deployed from one image", and while that was true it
// made the exception nearly free: one binary served both roles, so the two
// sides of every field below were compiled from one commit and could not
// disagree. The crate split ended that. `aenv-node` links a sandbox runtime and
// `aenv-api` does not, so they are two binaries in two images, and an operator
// can now roll one without the other.
//
// What did *not* change is the failure mode, and that is the part worth being
// precise about. `schema_version` is enforced in both directions
// (`src/node_server/convert.rs`, `src/node_client/wire.rs`, each with its own
// `a_blob_from_another_schema_version_is_refused` test), so a skew is a loud
// refusal with the two versions named in the error — never a silent decode of
// a document written by a different schema.
//
// What it costs instead is an operational rule, and it is a blunt one: there is
// a *single* `SERIALIZED_VALUE_SCHEMA_VERSION` covering all eleven fields
// below, so bumping it for any one of them makes every cross-half RPC fail
// while the two tags disagree — creates, pauses, resumes, template builds, all
// of it. So:
//
//   1. the two images MUST be built from one commit and deployed on one tag
//      (`deploy/k8s/base/kustomization.yaml`, `agentenv-api-deployment.yaml`,
//      and `.github/workflows/release.yml` all say so where an operator reads
//      them); and
//   2. a change to any Rust type carried below is a change to the wire
//      contract of *all* of them. Treat bumping the counter as a coordinated
//      release, not a field-level edit.
//
// 🔴 The alternative — per-field version counters, so a bump quarantines one
// field — is deliberately not taken here. Eleven counters make eleven ways to
// get the pairing wrong, and the failure they would buy (some RPCs work, some
// do not, during a roll) is harder to diagnose than the one they replace (a
// roll where nothing crosses the seam until both halves are on the same tag).
// If a rolling upgrade across a schema bump ever has to work, the thing to add
// is a node that accepts *two* adjacent versions for a bounded window, not a
// counter per field.
//
// 🔴 `schema_version` is not decoration. A receiver that does not recognise it
// must refuse the message rather than attempt the decode: serde is perfectly
// happy to decode a document that has lost a field it has a default for, and a
// silent partial decode of a sandbox's paused state is a sandbox that resumes
// wrong.
message SerializedValue {
  uint32 schema_version = 1;
  // JSON, as `serde_json` writes it.
  bytes json = 2;
}

// What a sandbox is worth in scheduling terms.
message SandboxResources {
  uint32 cpu_count = 1;
  uint32 memory_mib = 2;
  uint32 disk_size_mib = 3;
}

// What should happen when a sandbox's timeout elapses.
enum TimeoutAction {
  // 🔴 Not a default anyone should get by omission: proto3 gives every enum a
  // zero value, so this one names the mistake rather than picking a policy.
  // The node refuses a request carrying it.
  TIMEOUT_ACTION_UNSPECIFIED = 0;
  TIMEOUT_ACTION_PAUSE = 1;
  TIMEOUT_ACTION_DELETE = 2;
}

// One snapshot whose bytes are durable on the node and whose catalog row has
// not been announced.
//
// 🔴 The payload is the `StagedSnapshot` value itself, not a summary of it.
// An earlier design carried three fields — id, manifest digest, repository —
// and that is not enough to commit a row: the value also carries the commit
// payload, the staging clock, the node the bytes are on, and the incarnation
// that staged them. A proto that shipped the summary would have had to be
// changed after the first commit was attempted, and this one cannot be changed
// after it ships.
message StagedSnapshot {
  SerializedValue value = 1;
}

// The paused state of one sandbox, as the pausing node encoded it.
//
// 🔴 Two fields and both are needed. `artifact_root` is a path on the *node*
// that produced it, so it is meaningless to the API half on its own — which is
// exactly why the API half must also record which node that was. Handing this
// back to a different machine reopens nothing.
message PausedState {
  // The directory on the origin node holding the paused sandbox's artifacts.
  //
  // 🔴 Empty when that node's persister allocated none — a node configured
  // without paused-sandbox persistence captured into temporaries it manages
  // itself, and there is no directory to name. Empty is therefore "no
  // directory", never "the node did not say": a node that could not read where
  // the capture went fails the call instead.
  string artifact_root = 1;
  // The backend's own encoding of its paused state.
  SerializedValue state = 2;
}

// ---------------------------------------------------------------------------
// Create
// ---------------------------------------------------------------------------

// A sandbox to start from a committed snapshot.
//
// 🔴 The id, and not a *resolved runtime*. Resolving a snapshot into runnable
// state yields local artifact paths and an open image, and both belong to the
// machine that will run the VM — the node still does that part, from
// `resolved_record` when it is set or from `snapshot_id` through its own
// catalog access when it is not. The API half decides *which* snapshot; the
// node decides what running it means on its disk.
message SnapshotSource {
  string snapshot_id = 1;
  // The catalog row for `snapshot_id`, resolved by the API half at dispatch
  // time and carried as `SerializedValue` (`crate::snapshot::SnapshotRecord`,
  // JSON) rather than mirrored as proto fields — same reasoning as
  // `TemplateBuildRequest.steps` below: both ends of this call are Rust and
  // `SnapshotRecord` already has exactly one schema, which serde owns.
  //
  // 🔴 Not "deployed from one image" any more. The two halves are two images
  // since the crate split, and what keeps this field safe is
  // `SerializedValue.schema_version`'s two-way enforcement plus the
  // deploy-on-one-tag rule — see `SerializedValue`'s own doc for both.
  //
  // 🔴 Why this exists at all: `aenv-node` has no catalog access of its own
  // once the central catalog moves behind `[pg]` (see
  // `docs/proposals/_sd-phase4-open-questions-resolved.md` Q3) — every write
  // it could make already goes through bytes-only paths, and node must never
  // hold `[pg].dsn`. Rather than stand up a new node<->api RPC face for two
  // read-only lookups, the API half forwards the row it already read out of
  // the catalog in order to answer the request at all.
  //
  // 🔴 The row, and *only* the row — the same rule `ImageSource` states below.
  // The API half used to resolve this snapshot into local bytes before
  // dispatch (downloading `vm_state.bin`, materializing overlaybd image
  // configs, leasing them) and then send this field out of the result; it no
  // longer does, and nothing on the wire changed, because the row was always
  // the whole of what this message carried. The node resolves it on its own
  // disk, which is the disk its VM actually reads.
  //
  // 🔴 Absent is not an error. A node built before this field existed ignores
  // it (proto3 forward compatibility); a node built after it exists, talking
  // to an API replica built before this field existed, sees it unset and
  // falls back to resolving `snapshot_id` itself through its own
  // `SnapshotManager` — the pre-existing path, kept for exactly this rolling
  // upgrade window. See `NodeSandboxService::create`'s own fallback for the
  // other half of that contract.
  SerializedValue resolved_record = 2;
}

// A sandbox to start from an OCI image, cold.
//
// 🔴 Same rule as SnapshotSource: this is the user's reference, before
// resolution. The node resolves it into overlaybd on its own disk.
message ImageSource {
  string image_ref = 1;
  SandboxResources resources = 2;
  repeated AttachedDrive attached_drives = 3;
  // Appended to the kernel command line, subject to the node's allowlist.
  string extra_boot_args = 4;
}

message AttachedDrive {
  string image_ref = 1;
  string mount_path = 2;
  string drive_id = 3;
  bool read_only = 4;
  // Sub-path inside the drive root to bind-mount onto mount_path, exactly as
  // `ExtraDrive::Overlaybd::sub_path` carries it once resolved. Empty means
  // none — the REST API's own `subPath` is optional and an absent one means
  // the same thing.
  string sub_path = 5;
  // The block device's requested virtual size in bytes, already converted
  // from the REST API's `diskSizeMB` (see `ExtraDrive::Overlaybd::virtual_size`).
  // Sent as bytes rather than megabytes so the node applies exactly the value
  // the caller validated, instead of re-deriving it from a rounder unit. 0
  // means unset: the node resolves the source image's own size while
  // materializing the runtime device, the same fallback a local cold create
  // already uses when the caller names no size.
  uint64 virtual_size_bytes = 6;
}

// Marker: the node keeps the deadline and the caller named none, so the node's
// configured default applies.
//
// 🔴 Empty on purpose. The value lives in the node's configuration and putting
// a copy of it on the wire would let a caller and a node disagree about what
// "the default" is while both believed they had said the same thing.
message NodeDefaultExpiry {}

// Marker: the caller keeps this sandbox's deadline, so the node keeps none.
//
// 🔴 Empty on purpose, and a message rather than a `bool`: what it carries is
// that it was sent at all, and a bool has a second value that would have to
// mean something.
message CallerKeptExpiry {}

message SandboxCreateRequest {
  // 🔴 Chosen by the API half, not by the node. The control plane's record of
  // the sandbox exists before the sandbox does — that record is what
  // `control_plane_config` carries — and a record cannot name a sandbox whose
  // id has not been decided yet.
  string sandbox_id = 1;

  // The single run of the sandbox this call starts.
  //
  // 🔴 Sent by the caller, and not because a create needs fencing — there is
  // nothing yet to fence against. It is here because the caller is itself an
  // orchestrator: by the time it asks a node to create a sandbox it has already
  // minted the incarnation and written it into its own record, and a node that
  // minted a second one would leave two records of one sandbox naming two
  // different runs. Fencing compares exactly that value.
  //
  // 🔴 Empty means "you choose", which is what a caller that keeps no record of
  // its own sends. A node that cannot run under the incarnation it was given
  // must fail the call rather than substitute its own: the substitution is
  // silent, and the failure is not.
  string execution_id = 2;

  oneof source {
    SnapshotSource snapshot = 3;
    ImageSource image = 4;
  }

  // 🔴 Was `uint64 timeout_ms`, whose zero meant two different things. See
  // `expiry` below for what went wrong and why the replacement took new
  // numbers instead of this one: a build that still speaks the old field must
  // fail to be understood rather than be understood as one of the three.
  reserved 5;
  reserved "timeout_ms";

  // 🔴 **Who keeps this sandbox's deadline is a three-answer question, which
  // is why it is a oneof and not a number.**
  //
  // The three answers are "keep one this long", "keep one, and the caller
  // named none so use yours" and "keep none: the caller keeps this sandbox's
  // deadline in its own ledger". The first two are the node's to act on; the
  // third forbids it to act at all.
  //
  // 🔴 The middle and the last one used to be the same value — a `0` in a
  // `uint64 timeout_ms` — and that is what field 5 is reserved for having
  // been. The API half sent 0 meaning the last and the node read it as the
  // middle, so `[orchestrator].default_sandbox_timeout_secs` gave a sandbox
  // the API half believed it owned a deadline nobody had agreed to, and the
  // node's eviction loop paused the VM while the API half went on reporting it
  // running. Nothing about that failure is loud: the two halves disagree in
  // silence, and every later call on the sandbox fails for a reason that names
  // something else.
  //
  // 🔴 An unset oneof is refused rather than defaulted. A sender that says
  // nothing about expiry is a sender that has not been taught to, and picking
  // one of the three on its behalf is exactly the guess that went wrong.
  oneof expiry {
    // The node keeps the deadline, and it is this many milliseconds from the
    // start of the sandbox.
    //
    // 🔴 Zero is refused here, and is not a spelling of either of the other
    // two arms: a sender that meant the node's default has `node_kept_default`
    // to say so, and one that meant no deadline has `caller_kept`.
    uint64 node_kept_timeout_ms = 14;
    // The node keeps the deadline and the caller named none, so the node's own
    // `default_sandbox_timeout_secs` is the answer.
    NodeDefaultExpiry node_kept_default = 15;
    // 🔴 The **caller** keeps this sandbox's deadline. The node records none,
    // reports none, and never evicts the sandbox on its own initiative — the
    // half that asked for it is the half that decides when its time is up, and
    // a second deadline on the node would be a second ledger for one sandbox.
    CallerKeptExpiry caller_kept = 16;
  }
  // 🔴 Read only when the node keeps the deadline, and still required: the
  // caller that keeps expiry itself is the caller that will one day hand the
  // sandbox back, and what it does then is not this node's to guess.
  TimeoutAction timeout_action = 6;
  bool auto_resume = 7;
  // Whether envd requires this sandbox's derived access token.
  bool secure = 8;
  map<string, string> user_metadata = 9;
  map<string, string> env_vars = 10;
  // The sandbox's egress policy, as `SandboxNetworkPolicy` serialises.
  SerializedValue network_policy = 11;
  // Opaque user JSON for the custom extension hooks. Absent and empty mean the
  // same thing, as they do everywhere else this value appears.
  SerializedValue custom_extension_params = 12;

  // 🔴 **The ownership marker.** Its presence — and nothing else — is what
  // makes this sandbox one the control plane owns, and therefore one that
  // `ListSandboxes` reports.
  //
  // Opaque to the node: it is stored exactly as sent and handed back exactly as
  // stored. The node does not parse, validate, re-encode or generate it, and
  // nothing on the node may come to depend on its shape. That makes it a
  // contract between the API half and its future self rather than a wire
  // contract between two languages.
  //
  // 🔴 A marker, not a backup. It answers *whose is this* and should stay
  // small. Rebuilding a control plane's records after its store is lost is a
  // different problem wanting a different, larger object under a different
  // name; one field must not carry both.
  //
  // 🔴 Zero bytes means *no marker*, not an empty one: proto3 `bytes` cannot
  // tell those apart, so the node collapses them into "not owned by the
  // control plane". Sending an empty marker therefore produces a sandbox the
  // control plane will not see in its own listing — which is the safe
  // direction, because the unsafe one is a listing that reports a sandbox
  // something else then deletes.
  bytes control_plane_config = 13;
}

// What the node knows about a sandbox once it is running.
message SandboxCreateResponse {
  string sandbox_id = 1;
  string execution_id = 2;
  // The address the sandbox reaches the host on, empty when it has none.
  string host_interaction_ip = 3;
  // 0 when the backend does not report one.
  uint64 rootfs_virtual_size = 4;
  SandboxResources resources = 5;
  int64 started_at_ms = 6;
  // 0 means the sandbox has no expiry.
  int64 expires_at_ms = 7;

  // The sandbox's context and image configs, as this node's own record of the
  // now-running sandbox has them — `SandboxMetadata::context` /
  // `::image_configs`, as `CommandContext` / `ImageConfigs` serialise. Sent
  // unconditionally, for every source, so one field is one answer rather than
  // two depending on which oneof arm asked.
  //
  // 🔴 Read only by a `Source::Image` caller in practice. A `Source::Snapshot`
  // caller already resolved the committed snapshot itself before sending this
  // request, so its own transitional record already carries the same values
  // and applying these again is a no-op. `Source::Image` is the caller that
  // needs them: resolving an unresolved reference is what *this call* just
  // did, on a different machine than the caller, so the caller had nothing of
  // its own to put in its transitional record until this reply arrived. See
  // `SandboxRuntimeInfo::resolved_image_facts`.
  SerializedValue context = 8;
  SerializedValue image_configs = 9;
}

// ---------------------------------------------------------------------------
// Delete / Pause / Checkpoint
// ---------------------------------------------------------------------------

message SandboxDeleteRequest {
  string sandbox_id = 1;
  // 🔴 The incarnation the caller believes it is deleting. A delete that
  // arrives after the sandbox has been resumed elsewhere names the run it was
  // written for, and the node refuses it rather than tearing down a run the
  // caller has never seen.
  string execution_id = 2;
}

message SandboxDeleteResponse {}

message SandboxPauseRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  // Whether the capture should also be staged for publication, so that a node
  // other than this one can rebuild the sandbox.
  //
  // 🔴 Not served yet, and **refused** rather than answered with an absent
  // `staged`. A node that quietly returned nothing here would be
  // indistinguishable from a node whose backend had nothing publishable to
  // offer, and the difference is whether the sandbox has a copy anywhere but
  // one machine's disk. The refusal is classified as non-terminal and is taken
  // before the sandbox is touched, so asking for something this build cannot do
  // costs nothing.
  bool publish = 3;
}

message SandboxPauseResponse {
  PausedState paused_state = 1;
  // Present only when `publish` was asked for and the backend could offer a
  // publishable capture.
  StagedSnapshot staged = 2;
  // Why `staged` is absent, when `publish` was asked for and the staging was
  // attempted and failed. Empty otherwise.
  //
  // 🔴 A field rather than a failed call, and this is the one place on this
  // service where a failure is reported inside a success. By the time staging
  // runs the sandbox is already paused, persisted and stopped, and the
  // classification the caller reads off a failed pause has only two answers:
  // *recoverable*, which it acts on by putting the sandbox back to running, and
  // *terminal*, which it acts on by tearing it down. Neither is true here. A
  // recoverable answer would leave the caller believing a sandbox is running
  // that this node has stopped; a terminal one would destroy a pause that
  // worked. So the pause succeeds, and what failed is named.
  //
  // 🔴 It is also what keeps an absent `staged` unambiguous. Without it, a
  // caller that asked to publish and got nothing could not tell a pause that
  // had nothing to stage — an idempotent re-pause, whose capture belongs to the
  // pause that made it — from a staging that broke. The first is normal and the
  // second means this sandbox now exists on one machine's disk and nowhere
  // else.
  string staging_error = 3;
}

message SandboxCheckpointRequest {
  string sandbox_id = 1;
  string execution_id = 2;
}

message SandboxCheckpointResponse {
  StagedSnapshot staged = 1;
}

// ---------------------------------------------------------------------------
// Resume
// ---------------------------------------------------------------------------

message SandboxResumeRequest {
  string sandbox_id = 1;

  // 🔴 The incarnation the sandbox was **paused** under — the fence, spelled
  // the same way as on every other call here.
  //
  // It is what tells a capture this caller means from a capture this node
  // happens to still be holding. A node keeps its paused record until
  // something tells it the cluster has moved on, so a sandbox that was paused
  // here, resumed elsewhere and paused there leaves a stale record on this
  // machine — and a resume that named only the sandbox would reopen a run the
  // user abandoned two runs ago, with their newer work still sitting on
  // another disk.
  string execution_id = 2;

  // 🔴 The incarnation this resume must run under: the one the caller's resume
  // claim allocated.
  //
  // Required, and never defaulted to "you choose" the way a create's is. A
  // create with no incarnation is a caller that keeps no record; a resume with
  // no incarnation is a resume nobody licensed, because the only way to obtain
  // one is the arbitration that decides a paused sandbox may come back at all.
  // A node that minted its own here would start a run the cluster's record of
  // the sandbox does not name, and fencing compares exactly that value.
  //
  // 🔴 It must differ from `execution_id`. A resume starts a new run; one that
  // reused the paused run's identity would leave commands written before the
  // pause indistinguishable from commands written after it.
  string resumed_execution_id = 3;

  // 0 means the sandbox keeps the timeout it was paused with — never "no
  // timeout", and never the node's default.
  uint64 timeout_ms = 4;
}

// 🔴 The same facts a create reports, in a message of its own rather than
// `SandboxCreateResponse` reused directly. A resume and a create both end with
// a running sandbox, so today the two answers are the same; what differs is
// what each may later need to say — how long the capture had been paused, say
// — and a shared reply would have no place to put it that did not also appear
// on the other call.
message SandboxResumeResponse {
  SandboxCreateResponse started = 1;
}

// Why a capture failed, told apart the way the node's own code tells it apart.
//
// 🔴 Carried in the gRPC `Status` details and **not** in its code: `Internal`
// is used by both kinds and by the transport itself, so a caller reading the
// code alone cannot tell them apart. Getting the direction wrong costs a user's
// workspace one way and leaves a zombie VM the other:
//
//   - not terminal — the runtime was restored before the error was returned,
//     so the caller rolls the sandbox back to running;
//   - terminal — the capture mutated the live runtime past safe resume, so the
//     caller must tear the sandbox down.
//
// 🔴 A missing detail is read as *terminal*. An error whose classification did
// not arrive is an error whose classification is unknown, and the safe reading
// of "unknown" is the one that does not keep running a VM that may have been
// mutated out from under itself.
message SandboxCaptureFailure {
  bool terminal = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------------
// Fork
// ---------------------------------------------------------------------------

// One child a fork is asked to produce.
//
// 🔴 The id is decided by the caller, for the same reason it is on `Create`:
// the child's `control_plane_config` is the control plane's record of the
// child, and a record names the sandbox it describes. A node that minted the
// id would be handing back a record written before anyone knew which sandbox it
// was about.
message ForkChildSpec {
  string sandbox_id = 1;
  // The incarnation this child must run under, or empty for "you choose".
  // Same rule as SandboxCreateRequest.execution_id.
  string execution_id = 2;
  // The ownership marker for this child. Zero bytes means the child is not
  // owned by the control plane; see SandboxCreateRequest.control_plane_config.
  //
  // 🔴 Never inherited from the source sandbox. The source's marker is the
  // control plane's record *of the source*, and a child carrying it would
  // report itself under its parent's identity.
  bytes control_plane_config = 3;
}

message SandboxForkRequest {
  string source_sandbox_id = 1;
  string source_execution_id = 2;
  repeated ForkChildSpec children = 3;
  // 0 means the children keep the source's timeout.
  uint64 timeout_ms = 4;
}

message SandboxForkResponse {
  // 🔴 One result per requested child, in request order, whatever happened to
  // any of them. That is the contract the node's own fork already states, and
  // a caller pairing markers with children depends on it.
  repeated ForkChildResult children = 1;
}

message ForkChildResult {
  string sandbox_id = 1;
  string execution_id = 2;
  oneof outcome {
    SandboxCreateResponse started = 3;
    string error = 4;
  }
}

// ---------------------------------------------------------------------------
// Updates
// ---------------------------------------------------------------------------

message SandboxNetworkRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  // The replacement policy, as `SandboxNetworkPolicy` serialises. Absent
  // clears the policy.
  SerializedValue network_policy = 3;
}

message SandboxNetworkResponse {}

message SandboxParamsRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  // 🔴 The *approved* value, already agreed with the custom extension by the
  // caller. The node assigns it; it does not run the hook and cannot refuse.
  SerializedValue custom_extension_params = 3;
}

message SandboxParamsResponse {}

// ---------------------------------------------------------------------------
// Describe
// ---------------------------------------------------------------------------

message SandboxDescribeRequest {
  string sandbox_id = 1;
}

// The two things about a running sandbox that only its live handle knows,
// plus the run they were read from.
//
// 🔴 No incarnation on the request, matching the rest of this service's reads:
// every *command* the caller goes on to send carries `execution_id` and the
// node refuses one that names a run it is not running. What travels back is
// the run the node is running, so a caller that wants to compare can, and one
// that does not has not been handed a fence it might forget to check.
message SandboxDescribeResponse {
  // The run this node is running under that id.
  string execution_id = 1;
  // Empty means this sandbox has no host interaction address — and it means
  // that only when `facts_from_handle` is true.
  string host_interaction_ip = 2;
  // 0 means the same thing, under the same condition.
  uint64 rootfs_virtual_size = 3;
  // 🔴 Whether the two fields above were read from the live handle.
  //
  // `false` means the handle was mid-operation and was not waited on, so the
  // node answered from its record — which holds neither field. Both are then
  // blanks rather than facts. Without this bit a caller could not tell *this
  // sandbox has no address* from *nobody looked*, and the whole point of this
  // call is that the caller has no other way to learn the difference.
  bool facts_from_handle = 4;
}

// ---------------------------------------------------------------------------
// ListSandboxes
// ---------------------------------------------------------------------------

// 🔴 A message of its own rather than `google.protobuf.Empty`. Empty has no
// fields and never will, so a surface that used it could never grow a filter,
// a cursor or a scope — and this one is a listing, which is the shape that
// grows all three.
message ListSandboxesRequest {}

message SandboxListResponse {
  // Every sandbox this node is running that carries an ownership marker.
  //
  // 🔴 An empty list is an answer, and it is the answer that lets a caller
  // conclude a sandbox is gone. It is only ever produced by a node that looked.
  repeated NodeSandbox sandboxes = 1;
}

// One live sandbox, as the node that is running it sees it.
message NodeSandbox {
  string sandbox_id = 1;
  // 🔴 Required, and taken from the live handle rather than from the node's
  // record: an orphan is decided by comparing incarnations, and the point of
  // this listing is to report what is running rather than what is filed.
  string execution_id = 2;
  string node_id = 3;
  int64 started_at_ms = 4;
  // 0 means the sandbox has no expiry.
  int64 expires_at_ms = 5;
  uint32 vcpu = 6;
  uint64 ram_mb = 7;
  string host_interaction_ip = 8;
  uint64 rootfs_virtual_size = 9;
  // 🔴 Never empty in a response. A sandbox whose marker is absent is not the
  // control plane's, and is left out of the listing entirely rather than
  // reported with an empty one.
  bytes control_plane_config = 10;
}

// ---------------------------------------------------------------------------
// BuildTemplate
// ---------------------------------------------------------------------------

// A rootfs to resolve from an OCI image reference, node-side.
//
// 🔴 The reference, and not a resolved path — same rule as `SnapshotSource`
// and `ImageSource` above. Resolving an image reaches a registry through
// `regctl` and writes local overlaybd artifacts, both of which are this
// node's to do; the caller only ever gets to name what it wants.
message TemplateBuildImageBase {
  // Empty means this node's own configured default
  // (`[image.resolver].default_image`), matching `ImageResolver::resolve`'s
  // existing reading of an absent image reference.
  string image_ref = 1;
}

message TemplateBuildRequest {
  // The snapshot id the built template will be staged under and, once the
  // caller commits `TemplateBuildResponse.staged`, committed under.
  //
  // 🔴 Chosen by the caller, not minted here — same rule as `Create`'s
  // `sandbox_id`. The caller's own catalog row already names this id before
  // this call is made (`SnapshotManager::try_start_build`), and a node that
  // minted its own would stage bytes that row can never point at.
  string build_snapshot_id = 1;

  // 🔴 Never a resolved snapshot, matching `SnapshotSource` above and for the
  // same reason: resolving one opens local artifacts that belong to whichever
  // machine boots the build sandbox, which after this call exists is this
  // node and not the caller.
  oneof base {
    TemplateBuildImageBase image = 2;
    // A committed snapshot to build on top of, by id or alias. Resolved
    // node-side through the same `SnapshotManager::load_runnable` a `Create`
    // with a `SnapshotSource` resolves its base through — unless
    // `base_snapshot_resolved` below is set, in which case the node resolves
    // the *row* it already has instead of asking its own catalog for it.
    string base_snapshot_ref = 3;
  }

  // Build steps (RUN/ENV/WORKDIR/USER/EXPOSE/VOLUME/LABEL), as
  // `Vec<TemplateBuildStep>` (`src/template/build_spec.rs`) serialises.
  //
  // 🔴 `SerializedValue`, not one proto message per step kind. Both ends of
  // this call are Rust — and since the crate split they are two images, so the
  // precondition `SerializedValue`'s own doc now names is *deployed on one
  // tag*, not built into one binary — and `TemplateBuildStep`/
  // `TemplateBuildStepKind` are already a closed, internal, serialisable Rust
  // enum with no representation outside this process: the public HTTP
  // surface speaks its own DTOs (`models::TemplateStep` and friends) and
  // never this type. Mirroring seven step kinds as a second oneof here would
  // be a second schema for a type that already has one, kept in step by
  // hand, to serve a caller this type was never going to reach.
  SerializedValue steps = 4;

  SandboxResources resources = 5;

  // Empty means "no override": the build ends running whatever the base
  // image or base snapshot already runs. Same rule as
  // `TemplateBuildSpec::start_cmd`/`ready_cmd` apply to these same two
  // strings locally — this call does not restate it as a separate bool,
  // because the node applies the identical rule to the identical input.
  string start_cmd = 6;
  string ready_cmd = 7;

  // 🔴 **No alias field, on purpose.** Staging never applies one — see
  // `capture_publish_metadata(metadata, None)` and `stage_for_caller`'s note
  // that alias is "the single field staging never reads, so it stays the
  // committer's to apply" — and a template build follows the same rule
  // rather than a new one: the caller's `adopt_staged` overwrites
  // `staged.commit.alias` unconditionally at commit time regardless of what
  // this node wrote, so sending one here would be a value nobody reads.

  // The catalog row for `base_snapshot_ref`, resolved by the API half at
  // dispatch time — meaningful only when `base` is `base_snapshot_ref`,
  // ignored otherwise. Same shape, same reasoning and the same rolling-
  // upgrade fallback contract as `SnapshotSource.resolved_record` above: see
  // that field's doc. A field number of its own (not folded into the `base`
  // oneof) because a oneof variant's shape cannot grow a second value without
  // breaking every existing reader of `base_snapshot_ref` as a bare string.
  SerializedValue base_snapshot_resolved = 8;
}

message TemplateBuildResponse {
  // 🔴 Always present on success: a build's whole product is the staged row,
  // matching `SandboxCheckpointResponse` above. A failed build fails the
  // call — see `TemplateBuildFailureDetail` — there is no third answer to
  // encode here the way a pause's `staging_error` needs one for.
  StagedSnapshot staged = 1;
}

// Which build step a failed `BuildTemplate` call failed on, carried in the
// gRPC `Status` details so it survives the hop back to the caller.
//
// 🔴 In details and not folded into the status message string, matching
// `SandboxCaptureFailure` above: a template's build-status API answers with
// this value verbatim (`TemplateBuildErrorReason.step` /
// `models::BuildStatusReason.step`), and a caller that had to re-parse prose
// to recover it would be one string-format change away from losing it.
message TemplateBuildFailureDetail {
  // Empty means the failure was not scoped to one step — resolving the base
  // image or base snapshot, or staging the built artifacts, rather than a
  // RUN/ENV/... step failing.
  string step = 1;
}
