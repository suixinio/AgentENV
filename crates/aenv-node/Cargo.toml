[package]
name = "aenv-node"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
name = "aenv_node"
path = "src/lib.rs"

[[bin]]
name = "aenv-node"
path = "src/bin/aenv-node.rs"

[features]
vendored-openssl = ["aenv-core/vendored-openssl"]

[dependencies]
aenv-core = { path = "../.." }
aenv-egress = { path = "../aenv-egress", features = ["local"] }
agentenv-observability = { path = "../observability" }
agentenv_http_server = { path = "../../src/api/generated" }
anyhow = "1.0.100"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6.1.0"
envd = { version = "0.1.0", path = "../../thirdparty/envd" }
firecracker_client = { version = "1.15.1", path = "../../thirdparty/firecracker-client" }
flate2 = "1"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
index-set = "0.2"
ipnetwork = "0.21"
libc = "0.2"
metrics = "0.24"
netlink-packet-route = "0.28"
nix = { version = "0.31", features = ["sched", "mount", "fs", "signal", "user", "resource", "uio", "socket"] }
object-store-operator = { path = "../object-store-operator" }
overlaybd = { path = "../../storage/overlaybd" }
prost = "0.14.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
rtnetlink = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
shell-util = { path = "../shell-util" }
tar = "0.4"
tempfile = "3.22.0"
thiserror = "2.0.18"
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
toml = "0.9.11"
tonic = "0.14.2"
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1", features = ["serde", "v7"] }
uvm-ublk = { path = "../../storage/ublk" }
uvm-ublk-daemon = { path = "../../storage/ublk-daemon" }
warm-pool = { path = "../warm-pool" }
semver = "1"
which = "8.0.0"

[dev-dependencies]
aenv-core = { path = "../..", features = ["test-support"] }
agentenv-test-support = { path = "../test-support" }
axum-extra = { version = "0.12", features = ["cookie", "query", "typed-header"] }
headers = "0.4"
# Test-only: `snapshot/p2p.rs`'s `#[cfg(test)]` module spins up an io_uring
# worker to build a real overlaybd layer. Nothing in this crate's production
# code touches either -- ublk and the io_uring rings live in the daemon
# process, which `aenv-node` drives over its Unix socket.
io-uring = "0.7.9"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
storage-util = { path = "../../storage/util" }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "orchestrator_integration"
path = "tests/orchestrator_integration.rs"
