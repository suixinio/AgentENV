[package]
name = "uvm-uffd"
version = "0.1.0"
edition = "2021"
description = "userfaultfd page-fault serving for Firecracker memory snapshot restore"

[[bin]]
name = "uvm-uffd"
path = "src/main.rs"

[dependencies]
storage-util = { path = "../util" }
overlaybd = { path = "../overlaybd" }

anyhow = "1.0"
clap = { version = "4.5.38", features = ["derive"] }
libc = "0.2.174"
nix = { version = "0.30.1", features = ["socket", "uio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
