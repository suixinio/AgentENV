apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentenv-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - redis.yaml
  - gateway-service.yaml
  - gateway-deployment.yaml
  - agentenv-headless-service.yaml
  - agentenv-ublk-daemon-metrics-service.yaml
  - agentenv-daemonset.yaml
  # The deciding half (阶段 3a). Listed here so it is part of what `kustomize
  # build` renders and therefore part of any drift baseline — but 🔴 introduced
  # to a live cluster with `kubectl apply -f` on these three files alone
  # (`_sd-impl-phase3-role.md` §10.2 step 3). They are pure additions and
  # intersect none of the cluster's known drift; a full `apply -k` does, and
  # silently.
  - agentenv-api-deployment.yaml
  - agentenv-api-service.yaml
  - agentenv-api-pdb.yaml

configMapGenerator:
  # 🔴 The cluster's own name, in one place because two sides have to agree on
  # it and neither can tell that they do not. The node stamps this id on every
  # paused-sandbox row it writes; the scheduler scopes every registry read,
  # every registry write and the reclamation timer to it. Set them apart and
  # nothing fails: the scheduler simply serves a cluster that has no rows, and
  # the rows the nodes are writing are reclaimed by nobody.
  #
  # It is not a credential — it is a name — so it belongs here rather than in
  # the Secret it used to be read from, where nothing created it and the write
  # surface came up cold on every fresh cluster with one error line to say so.
  #
  # Keep it in step with `[node_identity].cluster_id` in config/default.toml,
  # which is what a node falls back to if this ConfigMap is ever missing.
  # `services/shared/config` has a test that fails if the two drift apart.
  - name: cluster-identity-config
    literals:
      - CLUSTER_ID=00000000-0000-0000-0000-000000000000
  # 🔴 config/agentenv.toml is NOT in this repository, and that is deliberate.
  # `deploy/k8s/run.sh` copies the whole of deploy/k8s into a temp directory and
  # writes it there from config/default.toml (run.sh:30) before invoking
  # kustomize, so the node's TOML and the repo's own default can never be two
  # different files. That is also why editing this ConfigMap in a live cluster
  # is undone by the next apply — see the note on [orchestrator.paused_registry]
  # in config/default.toml.
  #
  # Consequence: `kubectl kustomize deploy/k8s/base` fails on a clean checkout,
  # and always has — this tree is not a kustomize entry point. Render or apply
  # through `make k8s-render` / `make k8s-apply` (or `bash deploy/k8s/run.sh
  # render|apply|delete`), which also selects an overlay; base is only ever
  # consumed as `resources: [../../base]` from one of them.
  - name: agentenv-k8s-config
    files:
      - config/agentenv.toml
      # 🔴 config/oss-overlay.toml *is* in this repository, and that is the
      # difference between the two files in this generator. agentenv.toml is
      # written by run.sh from config/default.toml on every apply, so nothing a
      # cluster says there survives; this one is tracked, reviewed, and layered
      # on top by AENV_CONFIG_OVERLAY_PATH below. It carries the endpoint, the
      # bucket, the region and the cache budget — never a credential.
      - config/oss-overlay.toml
      # 🔴 Same reasoning as config/oss-overlay.toml just above, for `[pg]`
      # instead of `[backend.oss]`: config/default.toml ships an empty `[pg]`
      # (dsn can never be a real value there — see its own comment), and this
      # tracked file is the credential-free half. See the note on
      # AENV_API_CONFIG_OVERLAY_PATH under snapshot-storage-config below for
      # the second, Secret-projected half and why this one key cannot simply
      # be appended to AENV_CONFIG_OVERLAY_PATH itself. Read only by
      # agentenv-api-deployment.yaml — never mounted onto the DaemonSet,
      # which must never hold `[pg].dsn` at all (`refuse_configured_pg_dsn`,
      # in `crates/aenv-node/src/bin/aenv-node.rs`, refuses startup outright if
      # it is configured — and that binary cannot link a PostgreSQL client
      # anyway).
      - config/pg-overlay.toml
  - name: gateway-k8s-config
    files:
      # 🔴 阶段四 E4: `gateway.scheduler_addr` inside this file is
      # `agentenv-api:8002`, not `agentenv-scheduler:9090` — the gateway's
      # `schedulerv1.SchedulerClient` (`services/gateway/cmd/main.go`) is a
      # plain generated gRPC client over `services/api/proto/scheduler.proto`,
      # the same schema `src/node_registry/grpc_service.rs`'s
      # `NodeRegistryGrpcService` implements, so pointing it at the api
      # Deployment's own gRPC listener answers `ListNodes`/
      # `ListObservedNodes`/`GetNode`/`Schedule`/`RecordAssignment`/
      # `LookupNode`/`ListRegistrySandboxes` for real with no scheduler
      # process running. `ListRegistrySandboxes`
      # (`services/gateway/internal/registry_list.go`) was the last gap --
      # `src/node_registry/grpc_service.rs`'s `list_registry_sandboxes` now
      # answers it against `PausedSandboxRegistry::list_all`, so every
      # gateway-to-scheduler RPC this endpoint sends is covered.
      # `gateway.query_only_scheduler_addr`, which used to name a second,
      # separately dialled address for the cold-path LookupNode call below, is
      # deleted from `services/shared/config` outright along with the client
      # selection it configured — there is no longer a second address to
      # leave unset here.
      - config/gateway.json
  - name: sandbox-proxy-config
    literals:
      - SANDBOX_PROXY_DOMAINS=
  # Where every node's heartbeat reporter dials its primary heartbeat target
  # — one value, consumed two ways by `agentenv-daemonset.yaml`: as the env
  # var read once at process start, and as a mounted file the reporter
  # re-reads once per heartbeat while the process runs.
  #
  # 🔴 阶段四 E1 (task's own label): this now points at `agentenv-api`, not
  # `agentenv-scheduler`. `NodeRegistryGrpcService`
  # (`src/node_registry/grpc_service.rs`) implements the same
  # `scheduler.v1.Scheduler.Heartbeat` RPC the real scheduler does —
  # including the cluster CPU-config bitwise-AND intersection
  # (`src/node_registry/cpu_template.rs`, byte-for-byte golden-tested against
  # the Go algorithm) — over the api Deployment's gRPC listener
  # (`AENV_API_GRPC_ADDR`, port 8002, fronted by the `agentenv-api` Service
  # the same way `agentenv-scheduler` fronted the real one). That RPC only
  # answers unconditionally now — the api Deployment
  # (`agentenv-api-deployment.yaml`) always builds its own node registry,
  # with no switch left to gate it on.
  #
  # 🔴 Rollback: `http://agentenv-scheduler:9090` no longer resolves to
  # anything — the Go scheduler's Deployment/Service/PDB and the
  # `services/scheduler` source itself were deleted outright (`e2734fd`),
  # not merely commented out of `resources:`. Changing this key back to
  # that address would only turn heartbeats (and, since P2P peer discovery
  # shares this same `[cluster].scheduler_endpoint`,
  # `src/p2p/mod.rs::peer_discovery_from_config` — P2P discovery too) into
  # DNS failures. The only real rollback is checking out a commit from
  # before `e2734fd` (or restoring the scheduler Deployment/Service/PDB
  # manifests and a compatible scheduler image from git history) and
  # rolling both this key and the api Deployment's
  # `AENV_PAUSED_REGISTRY_BACKEND` back together — see that file's own
  # comments.
  #
  # 🔴 It used to be a bare literal in that file, with not even the
  # indirection every other cluster-specific value here already gets — so
  # changing where a node heartbeats meant editing the DaemonSet inline and
  # rolling it: exactly the "phase four rollback is a serial, hour-long
  # DaemonSet roll" trap
  # `docs/proposals/2026-08-20-service-decomposition.md`'s phase four section
  # says a rollback must not depend on. 阶段四切片 0 closes that gap for the
  # value itself: the DaemonSet mounts this ConfigMap **without** `subPath`
  # (`subPath` mounts — `agentenv-config`'s two uses of it in that file — are
  # never refreshed by kubelet; a whole-ConfigMap mount like this one is, on
  # kubelet's ordinary sync period), so `SchedulerEndpointSource`
  # (`src/scheduler_endpoint.rs`, formerly a private type inside
  # `src/observability/reporter.rs`) notices an edit here within one
  # heartbeat interval and dials the new address on the very next heartbeat —
  # no `kubectl set env`, no Pod restart, no DaemonSet roll.
  #
  # 🔴 One key, read two ways, deliberately — not an "env" ConfigMap and a
  # separate "file" ConfigMap. A process whose bootstrap value (env, read once
  # at startup) and hot-reloadable value (file, re-read forever) named two
  # different targets would dial one of them by accident depending on
  # timing, and keeping them as one key removes that possibility rather than
  # relying on an operator to edit both in step.
  #
  # 🔴 Both references in the DaemonSet are `optional: true`, matching every
  # other generated ConfigMap here. Losing this one does not fail the Pod —
  # it silently stops heartbeat reporting instead:
  # `AENV_OBSERVABILITY_SCHEDULER_REPORT_ENABLED` stays `true`, but
  # `ReporterConfig::resolve` (`src/observability/reporter.rs`) sees an empty
  # `[cluster].scheduler_endpoint`, logs a `warn!` naming exactly that, and
  # never starts the reporter rather than failing to start the process. That
  # is a real degradation — the node stops appearing in api's observed-node
  # list (and the cluster CPU-config intersection stops propagating to new
  # VMs) — but it is a *loud*, discoverable one rather than a crash, the same
  # trade `cluster-identity-config` above makes for `AENV_CLUSTER_ID`.
  #
  # `http://agentenv-api:8002` is this cluster's real, running value —
  # tracked here the same way `api-upstream-config`'s addresses are, not a
  # placeholder.
  - name: node-heartbeat-config
    literals:
      - AENV_OBSERVABILITY_SCHEDULER_ENDPOINT=http://agentenv-api:8002
  # The incarnation work's gateway-side switch.
  #
  # 🔴 This ConfigMap used to carry three settings, not one:
  # SCHEDULER_REGISTRY_WRITE_FENCING (the registry's SQL predicates) and
  # SCHEDULER_ROUTING_EXECUTION_ARBITRATION (binding arbitration) were the
  # scheduler's own half. Both are gone along with `services/scheduler` —
  # deleted in full, not merely commented out of `resources:` — and neither
  # has a reader left anywhere to protect: `55b8411` confirmed
  # SCHEDULER_ROUTING_EXECUTION_ARBITRATION parsed into a field the gateway
  # never read even before that, and the Go registry it guarded is gone with
  # the scheduler. Only GATEWAY_ROUTING_EXECUTION_FENCING still has a reader.
  #
  # 🔴 This value is the release's *end* state, because the release has
  # finished. It started at `off`, and the cluster was walked forward through
  # it by hand (`kubectl patch`, 08-20); the manifest was never caught up, so
  # every `apply -k` since had been a silent rollback of the flip — a gateway
  # that stops refusing simply forwards, and reports nothing when it does.
  #
  # It now agrees with the code default in `services/shared/config`. That is
  # not redundancy — it is what makes losing this ConfigMap safe rather than a
  # quiet downgrade, and the literal stays named here because naming it is
  # what keeps a rollback a value change instead of a manifest edit under
  # incident pressure. `execution_switches_manifest_test.go` fails if it is
  # put back to `off`.
  #
  # 🔴 `observe` is no longer merely an old *value* to avoid going back to —
  # the release having finished was judged proof enough of that to delete the
  # mode from the code (R10, task's own numbering).
  # `GATEWAY_ROUTING_EXECUTION_FENCING=observe` now fails the process outright
  # at start-up (`ParseGatewayExecutionFencing` in
  # `services/shared/config/config.go`) rather than being silently read as
  # `enforce` or falling back to anything else — so a stale manifest that
  # still names `observe` is a startup crash, not a quiet downgrade, which is
  # the loudest failure mode available and therefore the intended one. `off`
  # is unaffected: it remains a fully supported value, kept deliberately as
  # the rollback target (`execution_fencing.go`'s own "the rollback is this
  # line and nothing else" comment).
  - name: execution-fencing-config
    literals:
      # Flipped after the node-side gate was switched on and verified. The
      # gateway injects the control-plane token and refuses what fails it.
      - GATEWAY_ROUTING_EXECUTION_FENCING=enforce
  # The routing projection's three switches — two logical ones, split across two
  # processes, so three environment variables. Kept apart from the fencing
  # ConfigMap above because they belong to a different change and are flipped on
  # a different day; an operator reading either one should see one release.
  #
  # 🔴 All three are `on` here and `off` in the code, and that disagreement is
  # the entire point of this ConfigMap. `off` remains the only safe code
  # default — switching the write side on gives ReportSandboxEvent, which every
  # node is already sending, the power to delete routing records, and a cluster
  # that merely rolled the image must not acquire that at the next pod restart.
  # So the projection is switched on *here*, per cluster, deliberately.
  #
  # These three were flipped on the live cluster by hand (`kubectl patch`,
  # 08-20) and left out of this file, which made every `apply -k` a silent
  # rollback to `off`: the gateway would go back to reading routes it no longer
  # writes, and nothing would report the change. Written at the running state
  # for the same reason `execution-fencing-config` is — `off` here would not
  # be the cautious choice, it would perform the regression.
  #
  # Order to flip them in: the two write-side switches first, in either order,
  # then the read switch. Rolling back is `kubectl set env` on the Deployment,
  # which rolls it and is loud — editing this ConfigMap in a live cluster does
  # nothing until something restarts the pods, and is undone by the next apply.
  #
  # 🔴 GATEWAY_ROUTING_PROJECTION_READ additionally requires
  # GATEWAY_REDIS_ADDR to be set on the gateway Deployment (it is, from the
  # start). It used to also require the scheduler's own
  # SCHEDULER_ROUTING_EXECUTION_ARBITRATION to be anything other than `off` —
  # that pairing is moot now that `services/scheduler` and the switch it
  # guarded are both deleted; see the note on `execution-fencing-config`
  # above.
  - name: routing-projection-config
    literals:
      - GATEWAY_ROUTING_PROJECTION_AUTHORITATIVE=on
      - GATEWAY_ROUTING_PROJECTION_READ=on
      # 🔴 The write-side switch again, for the half that now owns the
      # registry. This ConfigMap used to also declare
      # SCHEDULER_ROUTING_PROJECTION_AUTHORITATIVE, the scheduler process's own
      # half of this same logical switch — but that key never reached anything
      # once `services/scheduler` (the workload it was scoped to) was deleted
      # outright, not merely removed from `resources:`, and it was never
      # consumed by any Deployment even before that (`55b8411` confirmed it
      # parsed into a field the gateway never read). It is deleted here rather
      # than kept as a documented no-op. See the long note on this key in
      # `agentenv-api-deployment.yaml` for what the api half's own half of the
      # write-side switch costs when off.
      #
      # 🔴 `true`, not `on`. confique's env deserializer accepts
      # `1`/`true`/`yes` and `0`/`false`/`no` (case-insensitively) and errors
      # on anything else, so `on` here would fail api startup rather than
      # read as a quiet `false` — loud, but only if you spell it right in the
      # first place.
      - AENV_BINDING_STORE_PROJECTION_AUTHORITATIVE=true
  # 阶段 3a, in two keys: which upstream the gateway sends user-facing REST to,
  # and who wakes a paused sandbox the routing projection has no answer for.
  #
  # 🔴 This ConfigMap *is* 3a's switch, and 3a is **on**, permanently now. Both
  # keys carry real addresses because the cluster has been running them since
  # 08-24: the gateway sends user-facing REST to the api half and wakes paused
  # sandboxes through it, rather than fanning out to whichever node the
  # scheduler names.
  #
  # 🔴 Emptying either key is no longer a rollback, and no longer possible at
  # all. The DaemonSet has since moved to `aenv-node` (3b, see
  # agentenv-daemonset.yaml), so the nodes answer 404 on the sandboxes routes
  # and have no wake-up surface of their own — the shape of rollback this
  # ConfigMap used to offer (empty the two keys, roll the gateway, leave the
  # DaemonSet alone) would point the gateway at a target that cannot serve
  # either call. `services/shared/config`'s `Config.Validate` now refuses to
  # load a gateway config with either key empty, from the file or the
  # environment, so an `apply -k` that emptied one is a CrashLoopBackOff at
  # the next gateway restart rather than the silent REST/wake-up outage —
  # discoverable only as 404s — that it used to be. The only rollback left for
  # this half is the image-tag rollback in `services/README.md`'s "Rolling the
  # node half back" section: a pre-阶段3a gateway image tag alongside the
  # pre-split DaemonSet image tag, in the same apply, because a current
  # gateway image can no longer run with these two empty at all.
  #
  # `config/gateway.json` still mounts both keys empty, and that stays
  # deliberate: it is what makes losing this ConfigMap a loud, fail-fast
  # refusal to start rather than a fallback to a value nobody meant.
  # `services/shared/config` has tests that pin both halves of this.
  - name: api-upstream-config
    literals:
      - GATEWAY_REST_UPSTREAM_ADDR=http://agentenv-api:8000
      - GATEWAY_RESUME_ADDR=agentenv-api:8002
  # The cold LookupNode path a projection miss and an undecided wake-up both
  # fall through to — declared here at the code default (3s) so losing this
  # ConfigMap is safe rather than a quiet change, the same reasoning
  # `execution-fencing-config` above gives for doing this instead of leaving
  # the key undeclared.
  #
  # 🔴 This ConfigMap used to be named `scheduler-fallback-config` and to also
  # carry GATEWAY_SCHEDULER_FALLBACK_DISABLED, a switch that could skip this
  # call entirely — billed at the time as "阶段四 slice 1's decommissioning
  # lever," which turned out to be the wrong lever for that job:
  # decommissioning the scheduler process was `gateway.scheduler_addr` itself
  # moving off it (`gateway-k8s-config` above), not skipping this call. That
  # switch (and the client-selection field it worked alongside,
  # `QueryOnlySchedulerClient`) is deleted from `services/shared/config`
  # outright, not merely defaulted off — the call is unconditional again,
  # exactly as it was before either existed.
  #
  # GATEWAY_COLD_LOOKUP_TIMEOUT — this ConfigMap's one remaining key — is not
  # decommissioning scaffolding: it bounds this one RPC on its own, separately
  # from GATEWAY_REQUEST_TIMEOUT, so a slow or unreachable target on this path
  # (a bad rollout, a brief outage on whichever api replica answers) cannot
  # hold it open for gRPC's own connection backoff. It is the same setting
  # that used to be named GATEWAY_SCHEDULER_FALLBACK_TIMEOUT — renamed, not
  # removed, once the call it bounds stopped being a fallback to a process
  # that might not exist. Safe to lower once this cluster's real LookupNode
  # p99 is known; 3s is deliberately far above it and far below
  # GATEWAY_REQUEST_TIMEOUT's 30s.
  #
  # `gateway-deployment.yaml` references this key with `optional: true`, so
  # retuning it later is one literal edited here and a restart, never a
  # Deployment edit.
  - name: cold-lookup-config
    literals:
      - GATEWAY_COLD_LOOKUP_TIMEOUT=3s
  # 🔴 There was a third switch here — node-service-config, carrying
  # AENV_NODE_SERVICE_ENABLED — and it is gone rather than set to `false`. It
  # was meant to let the pre-split single process serve the node sandbox
  # service, but nothing in the Rust tree ever read the variable, and the design
  # went the other way: the node sandbox service is bound unconditionally by
  # `aenv-node`, which is the only binary that could bind it. Because it was
  # read by every node in the fleet, the
  # runbooks costed flipping it at a serial DaemonSet roll with a drain per
  # machine — paid for a behaviour change that could not happen. Its absence is
  # scanned for by `no_manifest_sets_a_node_service_gate_nothing_reads`
  # (`src/cfg.rs`); `deploy/k8s/base/agentenv-daemonset.yaml` carries the long
  # form of why. Giving the api half a machine to drive is a `aenv-node`
  # DaemonSet, not a ConfigMap key.

  # 🔴 `paused-registry-config` is GONE. It carried one key,
  # AENV_PAUSED_REGISTRY_BACKEND=central, read only by the node DaemonSet —
  # and reading it there never did anything. `assemble_node`
  # (`crates/aenv-node/src/bin/aenv-node.rs`) treats any backend other than
  # `local` the same way: it logs a `warn!` naming the configured value
  # ("aenv-node ignores the configured paused-sandbox registry: cluster-wide
  # records belong to the API half") and wires in
  # `DisabledPausedSandboxRegistry` regardless, because cluster-wide
  # paused-sandbox state belongs to the api half alone now (see
  # AENV_PAUSED_REGISTRY_BACKEND=postgres, a literal on
  # `agentenv-api-deployment.yaml` rather than a reference to this
  # ConfigMap — that asymmetry is what `snapshot_catalog_manifest_test.go`
  # leans on as a control).
  #
  # Deleting the ConfigMap and the DaemonSet's reference to it is not a
  # behaviour change: the node already ignored `central` and fell through to
  # the same `DisabledPausedSandboxRegistry` wiring it uses with nothing set
  # at all — the code default in config/default.toml (`local`) produces the
  # identical outcome. What changes is that the node no longer logs a startup
  # warning about a value it was always going to ignore.
  # 🔴 `snapshot-catalog-config` is GONE, and so are the two keys it carried.
  #
  # 阶段 2c / Stage B moved the snapshot catalog out of object storage and into
  # PostgreSQL in three steps, steered by AENV_SNAPSHOT_CATALOG_WRITE and
  # AENV_SNAPSHOT_CATALOG_READ:
  #
  #     object_store/object_store → both/object_store → both/postgres
  #                               → postgres/postgres
  #
  # This cluster reached the last of those and stayed there. The switches, the
  # double write behind them, the mirror backlog, the read-side confirmation
  # table and the object-storage catalog itself have all been deleted from the
  # code: PostgreSQL is the catalog, `[pg]` is where it is configured, and
  # object storage holds byte artifacts and no rows.
  #
  # 🔴 Both binaries now REFUSE TO START if either variable is set — see
  # `refuse_removed_catalog_env_vars` (src/cfg.rs), called from both
  # entrypoints before the configuration is read. That is deliberate and it is
  # the reason this ConfigMap is deleted rather than left behind harmlessly:
  # confique ignores an environment variable no field declares, so a manifest
  # that kept them would have started a process that looked entirely healthy
  # while its operator believed the catalog was double-written.
  #
  # 🔴 One-time cost on a cluster that still has this ConfigMap and these
  # references: apply the new manifests and roll BOTH workloads. A Pod that
  # keeps the old environment exits at startup with an error naming the
  # variable — loud, and recoverable by rolling. Deleting the ConfigMap alone
  # is not enough while the Deployment/DaemonSet still reference it, but it is
  # also not harmful: `optional: true` meant an absent ConfigMap already left
  # the variables unset, which is exactly what the new build wants.
  #
  # 🔴 There is no way back to an object-storage catalog. Rows written since the
  # cutover live in PostgreSQL alone; no code has ever replayed them the other
  # way, and the code that could have has been deleted. Rolling back is an image
  # tag on both workloads plus restoring this ConfigMap — and it lands on a
  # cluster whose object-storage catalog is still frozen at the cutover.
  # Which durable snapshot repository this cluster keeps, and where the half of
  # its configuration that cannot be in this repository is read from.
  #
  # 🔴 `[backend.oss]` is the one section no environment variable can reach.
  # confique descends into a struct only through `#[config(nested)]`, `nested`
  # may not be `Option<_>`, and `backend.oss` is `Option<OssBackendConfig>` — so
  # the endpoint, the bucket and the credentials are read from a *file* and from
  # nothing else. Until AENV_CONFIG_OVERLAY_PATH existed, the only file was the
  # one run.sh overwrites, which is why this cluster's OSS settings — plaintext
  # credentials and all — were sitting in the `agentenv-k8s-config` ConfigMap
  # with no tracked copy anywhere.
  #
  # AENV_CONFIG_OVERLAY_PATH names extra TOML files layered over
  # `config/agentenv.toml`, applied left to right, merged deeply table by table.
  # Two of them here, and the split is the whole point:
  #   · config/oss-overlay.toml — tracked in this repository, no credentials;
  #   · backend-oss.toml — projected from the `rustfs-credentials` Secret,
  #     credentials only, listed last so it wins where they overlap.
  #
  # 🔴 A file that is named and not on disk is a *startup error*, deliberately:
  # the alternative is a node that quietly starts on `posix_fs` with an empty
  # snapshot store. So this key and the Secret below must move together.
  #
  # 🔴 The Secret needs one key that is not there on a fresh cluster, and it is
  # not created from this repository because it holds credentials. The cluster
  # already keeps the same pair under RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY;
  # add the TOML form beside them once, before rolling either workload:
  #
  #   NS=agentenv-system
  #   AK=$(kubectl -n $NS get secret rustfs-credentials \
  #        -o jsonpath='{.data.RUSTFS_ACCESS_KEY}' | base64 -d)
  #   SK=$(kubectl -n $NS get secret rustfs-credentials \
  #        -o jsonpath='{.data.RUSTFS_SECRET_KEY}' | base64 -d)
  #   T=$(mktemp) && printf '[backend.oss]\naccess_key_id = "%s"\naccess_key_secret = "%s"\n' \
  #        "$AK" "$SK" > "$T"
  #   kubectl -n $NS patch secret rustfs-credentials --type merge \
  #     -p "{\"data\":{\"backend-oss-credentials.toml\":\"$(base64 -w0 "$T")\"}}"
  #   shred -u "$T"
  #
  # 🔴 And the pods have to be rolled for any of it to take effect: both files
  # are `subPath` mounts, which kubelet never refreshes. Order matters — add the
  # Secret key first, then apply, then roll. Rolling before the key exists is a
  # node that will not start.
  #
  # Turning it off is one command and does not touch a manifest:
  #   kubectl -n agentenv-system set env daemonset/agentenv-node \
  #     deploy/agentenv-api AENV_CONFIG_OVERLAY_PATH=
  # An environment variable set to the empty string is read as unset, so that
  # clears it. It also lands the cluster on `posix_fs` unless
  # AENV_SNAPSHOT_REPOSITORY_BACKEND is cleared too — which is why that one is
  # separate, and why clearing only this key fails loudly instead of quietly
  # serving an empty snapshot store.
  - name: snapshot-storage-config
    literals:
      - AENV_SNAPSHOT_REPOSITORY_BACKEND=oss
      - AENV_CONFIG_OVERLAY_PATH=/workspace/config/oss-overlay.toml:/etc/agentenv/backend/backend-oss.toml
      # 🔴 Not AENV_CONFIG_OVERLAY_PATH itself, deliberately, even though it is
      # read into that exact environment variable by
      # agentenv-api-deployment.yaml alone. `aenv-api` is the
      # only half that may ever hold `[pg]` — `aenv-node`
      # (agentenv-daemonset.yaml) reads AENV_CONFIG_OVERLAY_PATH from the key
      # right above this one, unchanged, and must keep reading exactly that
      # two-file list forever: `refuse_configured_pg_dsn` refuses `aenv-node`
      # startup outright if `[pg].dsn` is configured at all, and a node
      # Pod named a pg overlay file it never has mounted would simply fail to
      # start on a missing file. A plain ConfigMap value cannot be
      # concatenated declaratively, so api gets its own key with the full
      # four-file list — including the two the DaemonSet also uses, repeated
      # here rather than composed, so nothing has to reach across two
      # ConfigMap keys to know api's actual overlay chain.
      #
      # The two new segments, in the same tracked-file-then-Secret order
      # config/oss-overlay.toml's own comment explains:
      #   · config/pg-overlay.toml — tracked, no credentials (see its own
      #     comment in the generator above);
      #   · pg-dsn.toml — projected from the `agentenv-postgres` Secret,
      #     the credential alone, listed last so it wins where they overlap.
      #
      # 🔴 The Secret needs one key that is not there on a fresh cluster
      # (same shape of gap as `rustfs-credentials`'s `backend-oss-credentials.toml`
      # documented above): `agentenv-postgres` already carries the DSN as a
      # plain string, under `dsn` — `SCHEDULER_REGISTRY_DSN` reads it that
      # way. `[pg].dsn` needs the *same* value wrapped in TOML, because
      # AENV_CONFIG_OVERLAY_PATH's files are parsed as config, not read as raw
      # strings. Add it once, before rolling agentenv-api:
      #
      #   NS=agentenv-system
      #   DSN=$(kubectl -n $NS get secret agentenv-postgres \
      #        -o jsonpath='{.data.dsn}' | base64 -d)
      #   T=$(mktemp) && printf '[pg]\ndsn = "%s"\n' "$DSN" > "$T"
      #   kubectl -n $NS patch secret agentenv-postgres --type merge \
      #     -p "{\"data\":{\"pg-dsn.toml\":\"$(base64 -w0 "$T")\"}}"
      #   shred -u "$T"
      #
      # Same rollout rule as backend-oss.toml: both new mounts are `subPath`,
      # so add the Secret key first, then apply, then roll agentenv-api.
      # Rolling before the key exists fails the Pod at startup (`[pg]` maps
      # onto a file this manifest names but the Secret does not yet hold —
      # `optional: true` on the volume means an *absent Secret* mounts an
      # empty directory and the named file is then missing; the process
      # refuses to start naming it, which is the loud failure this needs).
      #
      # Turning it off is one command and does not touch a manifest:
      #   kubectl -n agentenv-system set env deploy/agentenv-api \
      #     AENV_CONFIG_OVERLAY_PATH=
      # which lands `aenv-api` back on `config/agentenv.toml` alone —
      # `[pg]` absent, `[backend.oss]` absent too (the same rollback the
      # unmodified key above documents), so pair this with re-adding
      # AENV_SNAPSHOT_REPOSITORY_BACKEND/AENV_CONFIG_OVERLAY_PATH by hand if
      # only the pg half should go.
      - AENV_API_CONFIG_OVERLAY_PATH=/workspace/config/oss-overlay.toml:/etc/agentenv/backend/backend-oss.toml:/workspace/config/pg-overlay.toml:/etc/agentenv/pg/pg-dsn.toml
  # The two node-local image-cache budgets, in GiB, sized for the *smaller*
  # machine in the fleet.
  #
  # 🔴 These are the third thing `deploy/k8s/run.sh` overwrites, and the only
  # one whose loss is completely silent. run.sh copies config/default.toml over
  # config/agentenv.toml on every apply (run.sh:30), and default.toml ships
  # `capacity_gb = 100` / `remote_blocks.max_size_gb = 100`. This cluster runs
  # 24 / 12, set by hand in the live ConfigMap with a note explaining why — so
  # every `make k8s-apply` has been raising both budgets by roughly 4x and 8x
  # with nothing to report it.
  #
  # 🔴 Raising them is not a no-op that merely wastes disk, it *disables the
  # eviction*. What a node may put on its root disk is capacity_gb +
  # remote_blocks.max_size_gb + [backend.oss].cache_max_size_gb, and capacity
  # eviction only starts at `capacity_gb * high_watermark_ratio` (0.95). At
  # 100/100/8 that ceiling is 208 GiB and the trip point is 95 GiB of commits —
  # on aenv-master-01, which has a 96 GiB root disk, neither is reachable: the
  # disk fills first and the budget never trips. A budget that cannot be
  # reached reports nothing at all. At 24/12/8 the ceiling is 44 GiB and the
  # trip point is 22.8 GiB, both comfortably inside the smaller disk.
  #
  # 🔴 Sized for master, not worker, because both nodes mount one ConfigMap and
  # `image.cache.*` has no per-node override. aenv-master-01 has 96 GiB total
  # (~82 GiB free); aenv-worker-01 has 290 GiB (~99 GiB free). 44 GiB is safe on
  # both; 208 GiB is safe on neither.
  #
  # 🔴 Environment, not `config/agentenv.toml`, for the reason
  # AENV_PAUSED_REGISTRY_BACKEND and the catalog pair are — that file does not
  # survive an apply. `src/cfg/image.rs` carries the same note on both
  # `#[config(env = …)]` attributes, which is what makes this reachable at all.
  #
  # 🔴 A separate ConfigMap from snapshot-storage-config on purpose. That one is
  # built so that losing a key fails startup loudly; losing these two falls back
  # to default.toml's 100/100 and starts fine. Mixing the two rollbacks into one
  # object would mean an operator clearing the overlay path could not avoid also
  # resetting the disk budgets. Both references are `optional: true`, so losing
  # this ConfigMap is the same old 100/100 regression rather than an outage —
  # which is exactly why `image_cache_manifest_test.go` pins the values here.
  - name: image-cache-config
    literals:
      - AENV_IMAGE_CACHE_CAPACITY_GB=24
      - AENV_IMAGE_CACHE_REMOTE_BLOCKS_MAX_SIZE_GB=12
  # Which registries `regctl` may reach over plain HTTP — tracked the same way
  # `config/oss-overlay.toml` above is: a credential-free, cluster-specific
  # infrastructure fact, not a secret, so it belongs in a file in this
  # repository rather than only in a live object.
  #
  # 🔴 `regctl` is the only tool every registry call in this tree shells out
  # through (`src/setup/deps.rs::ensure_regctl`/`extract_ext4_from_ghcr`,
  # `src/image/oci_image.rs::fetch_oci_manifest`), and AgentENV's own code
  # passes it no `--tls-insecure` or equivalent flag. The only place `regctl`
  # itself looks for "this host speaks plain HTTP" is `$HOME/.regctl/config.json`
  # — absent that file entirely, it defaults to TLS for every registry,
  # including whichever plain-HTTP registry an overlay's own `regctl-config`
  # override names, and every manifest fetch, blob/layer download and
  # tools-drive pull against that registry fails at the TLS handshake before
  # anything else runs.
  #
  # 🔴 This ConfigMap, the volume mounting it at `/root/.regctl/config.json`
  # (`subPath: config.json`) and the `HOME=/root` env var that makes `regctl`
  # look there were all real, working objects on the live cluster —
  # `ds/agentenv-node`'s own
  # `kubectl.kubernetes.io/last-applied-configuration` names all three — and
  # none of the three were ever in this repository. That combination is not
  # merely undocumented, it is scheduled for deletion: a field present in
  # `last-applied` and in the live object but absent from a new render is
  # exactly what three-way merge removes on the next apply (`kubectl diff -k`
  # already renders it as a `-` line). `deploy/k8s/run.sh` applies with
  # `kubectl apply -k` and no `--prune`, so the ConfigMap object itself would
  # survive as an orphan while the volume and env var vanished from the
  # DaemonSet on the same apply — silently reintroducing the TLS failure above.
  #
  # `config/regctl.json` here in base carries an empty `hosts` map — the
  # do-nothing-safe default this same reasoning already argued for: a
  # deployment whose registries all speak real TLS needs none of this, so
  # base should not force one specific cluster's plain-HTTP registry on every
  # overlay. There is no longer a single "the" live cluster's registry to
  # hardcode at this layer anyway: the pve-sg cluster this value used to name
  # (`10.10.10.204:5000`) was decommissioned, and `deploy/k8s/overlays/pve-mf`
  # is where the current live cluster's real, plain-HTTP registry
  # (`10.1.0.201:5000`) is tracked instead, via its own `regctl-config`
  # `configMapGenerator` override (`behavior: replace`, sourcing
  # `overlays/pve-mf/regctl.json`) — the same file-tracked-not-secret
  # reasoning as `oss-overlay.toml`'s endpoint, just scoped to the overlay
  # that actually needs it. A cluster that needs a plain-HTTP registry should
  # add its own overlay following `overlays/pve-mf`'s pattern rather than
  # editing this file.
  #
  # 🔴 Only the node reads it. `assemble_api` in `src/bin/aenv-api.rs` states
  # outright that `aenv-api` "installs no regctl — by design, that is a
  # node's tooling", and neither call site that would otherwise reach for one
  # resolves an image in this process. `POST /sandboxes-cold` does not refuse:
  # it validates the request and ships the *unresolved* reference to a node,
  # which resolves it inside the same `Create`
  # (`SandboxLaunchSource::UnresolvedImage`, `src/api/impls/sandbox.rs`). A
  # template build dispatches to a node as well (`run_the_build_on_a_node`);
  # its refusal is narrower than it reads. It is two conjuncts, not one:
  # `!self.runs_sandbox_runtime() && self.node_placement().is_none()`
  # (`src/api/impls/template.rs`), so it fires only for an `aenv-api` with no
  # node to forward to at all. So
  # `agentenv-api-deployment.yaml` carries neither this ConfigMap nor the env
  # var; see the note on its `volumes:` block for the paired absence.
  # `regctl_config_manifest_test.go` pins the generator, the DaemonSet's mount
  # and env var, and that the api half carries none of it.
  - name: regctl-config
    files:
      - config.json=config/regctl.json

images:
  - name: agentenv-gateway
    newName: agentenv-gateway
    newTag: latest
  # 🔴 Two images, one tag. The node half and the api half are separate
  # binaries now (`aenv-node` links overlaybd/ublk/Firecracker; `aenv-api`
  # links none of it), so they are separate images — and the tag has to move on
  # both together. `services/api/proto/node.proto`'s eleven `SerializedValue`
  # fields carry Rust `serde` encodings behind a single
  # `SERIALIZED_VALUE_SCHEMA_VERSION` that both sides enforce, so a skew fails
  # loudly on *every* cross-half RPC rather than quietly on one field. See
  # `agentenv-api-deployment.yaml`'s own note.
  - name: agentenv-runtime
    newName: agentenv-runtime
    newTag: latest
  - name: agentenv-api
    newName: agentenv-api
    newTag: latest

generatorOptions:
  disableNameSuffixHash: true
