apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agentenv-node
  labels:
    app.kubernetes.io/name: agentenv-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-node
  # 🔴 maxSurge must stay 0 (the DaemonSet default, made explicit here because
  # correctness depends on it). A node releases the sandboxes its previous
  # process died holding by node identity, at startup, on the premise that the
  # previous process on this machine is gone — which is exactly what "old pod
  # fully terminated before the new one starts" guarantees. Surging the two
  # pods together breaks that premise: the new pod would hand the old pod's
  # still-running sandboxes to whoever resumes them next, and both copies would
  # then diverge from the same snapshot.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-node
    spec:
      terminationGracePeriodSeconds: 3600
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: agentenv
          image: agentenv-runtime:latest
          imagePullPolicy: IfNotPresent
          # 阶段 3b: this machine serves the node sandbox service and nothing
          # else. The user-facing REST routes answer 404 here
          # (`src/api/role_gate.rs`); the gateway reaches them through the api
          # half instead, which is what `api-upstream-config` in
          # kustomization.yaml points at.
          #
          # 🔴 The order of those two is load-bearing. `api-upstream-config`
          # must carry real addresses *before* this argument is applied, and
          # must not be emptied while it stands: a gateway still fanning REST
          # out to nodes that have taken `--role node` gets 404 from every one
          # of them. The two live in different files, so an apply that reverted
          # one and not the other is exactly that outage — which is why both are
          # pinned together by `execution_switches_manifest_test.go`.
          #
          # 🔴 Rolling back is `--role all`, and it is a serial DaemonSet roll
          # with an hour of grace per machine, not a value change. `all` is
          # defined as the pre-split process verbatim
          # (`only_the_split_roles_bind_a_second_listener` in
          # `src/bin/server.rs`), so it re-serves REST on every node — point the
          # gateway back at the nodes in the same step, or the 404s simply move.
          args: ["--role", "node"]
          env:
            - name: AENV_CONFIG_PATH
              value: /workspace/config/agentenv.toml
            - name: AENV_SANDBOX_ACCESS_TOKEN_HASH_SEED
              valueFrom:
                secretKeyRef:
                  name: agentenv-runtime-secrets
                  key: sandbox-access-token-hash-seed
                  optional: true
            # Both halves of the cluster-wide paused-sandbox registry are
            # optional so a cluster that has not set it up still starts: with
            # neither of them the node keeps the `local` backend from
            # config/default.toml and pauses stay node-local.
            #
            # 🔴 The backend is selected here rather than in the ConfigMap.
            # `deploy/k8s/run.sh` overwrites config/agentenv.toml from
            # config/default.toml on every apply, so a ConfigMap edit would be
            # undone by the next `make k8s-apply` — silently, and in the
            # direction that loses cross-node recovery. Set this key to
            # "central" in an overlay patch; the scheduler endpoint below is the
            # only other thing that backend needs, and the node carries no
            # database credentials of its own.
            - name: AENV_PAUSED_REGISTRY_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: paused-registry-config
                  key: AENV_PAUSED_REGISTRY_BACKEND
                  optional: true
            # 阶段 2c: which catalog this node writes, and which one it reads.
            # See the note on snapshot-catalog-config in kustomization.yaml for
            # the values and why they are not `off`.
            #
            # 🔴 Both halves of the cluster read the same two keys from the same
            # ConfigMap, and a test in `services/shared/config` fails if they
            # stop doing so. The node and the api Deployment answering
            # snapshot lookups out of two different catalogs is the split this
            # is here to prevent, and neither process can detect it: a read of
            # the catalog that lacks a row does not fail, it answers "no such
            # snapshot", and callers delete artifacts and refuse resumes on
            # absence.
            #
            # 🔴 These were `kubectl set env` on the live DaemonSet before they
            # were here, so the drift ran in the quiet direction: an `apply -k`
            # dropped them, this node fell back to object_store/object_store
            # (src/cfg.rs), and the scheduler went on treating PostgreSQL as
            # authoritative. Optional on both, because the pair falls back
            # together — and because losing only the write key produces the one
            # combination `AppConfig::validate_snapshot_catalog` refuses at
            # startup rather than a quieter wrong answer.
            - name: AENV_SNAPSHOT_CATALOG_WRITE
              valueFrom:
                configMapKeyRef:
                  name: snapshot-catalog-config
                  key: AENV_SNAPSHOT_CATALOG_WRITE
                  optional: true
            - name: AENV_SNAPSHOT_CATALOG_READ
              valueFrom:
                configMapKeyRef:
                  name: snapshot-catalog-config
                  key: AENV_SNAPSHOT_CATALOG_READ
                  optional: true
            # Which durable snapshot repository this node keeps, and where the
            # half of its configuration that cannot be in this repository comes
            # from. See the note on snapshot-storage-config in
            # kustomization.yaml.
            #
            # 🔴 The same two keys the api Deployment reads, from the same
            # ConfigMap, because the two halves must resolve snapshots out of
            # the same bucket. A node on `posix_fs` while the api half is on
            # `oss` reports nothing: it starts, serves an empty local store, and
            # answers "no such snapshot" for artifacts sitting in the bucket.
            #
            # 🔴 This is also where the object-storage credentials stop being an
            # environment variable's business. `[backend.oss]` cannot be reached
            # from the environment at all — confique descends into a struct only
            # through `#[config(nested)]` and `nested` may not be `Option<_>` —
            # so the endpoint, bucket and credentials arrive as files listed in
            # AENV_CONFIG_OVERLAY_PATH, the second of which is projected from
            # the `rustfs-credentials` Secret.
            - name: AENV_SNAPSHOT_REPOSITORY_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: snapshot-storage-config
                  key: AENV_SNAPSHOT_REPOSITORY_BACKEND
                  optional: true
            - name: AENV_CONFIG_OVERLAY_PATH
              valueFrom:
                configMapKeyRef:
                  name: snapshot-storage-config
                  key: AENV_CONFIG_OVERLAY_PATH
                  optional: true
            # The two node-local disk budgets, in GiB, read from a ConfigMap
            # because `config/agentenv.toml` does not survive an apply and
            # because they are sized for the smallest root disk in the fleet
            # (96 GiB on aenv-master-01), not for this machine. Losing them
            # falls back to config/default.toml's 100/100, which on that disk is
            # a budget the GC can never reach — see the note on
            # image-cache-config in kustomization.yaml.
            - name: AENV_IMAGE_CACHE_CAPACITY_GB
              valueFrom:
                configMapKeyRef:
                  name: image-cache-config
                  key: AENV_IMAGE_CACHE_CAPACITY_GB
                  optional: true
            - name: AENV_IMAGE_CACHE_REMOTE_BLOCKS_MAX_SIZE_GB
              valueFrom:
                configMapKeyRef:
                  name: image-cache-config
                  key: AENV_IMAGE_CACHE_REMOTE_BLOCKS_MAX_SIZE_GB
                  optional: true
            - name: AENV_VIRTUALIZATION_MODE
              value: "kvm"
            - name: API_ADDR
              value: "0.0.0.0:8000"
            - name: AENV_UBLK_DAEMON_BINARY_PATH
              value: /usr/local/bin/uvm-ublk-daemon
            - name: AENV_UBLK_DAEMON_METRICS_LISTEN_ADDR
              value: "0.0.0.0:9103"
            # The cluster's name for the machine, not the pod's. This ID is
            # what a paused sandbox's registry row records as its holder and
            # what the node must still match to renew that row's lease; a pod
            # name changes on every pod recreation, so a restarted node would
            # stop matching its own rows and the leases on every sandbox parked
            # on it would lapse for good. Must stay in step with the scheduler's
            # discovery, which names nodes the same way.
            - name: AENV_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The cluster this node's registry rows belong to, read from the
            # same ConfigMap key the scheduler scopes its registry to. A node
            # stamping one cluster id while the scheduler serves and reclaims
            # another is not an error anywhere: the rows are written, and then
            # nobody the node talks to can see them.
            #
            # Optional because a node falls back to `[node_identity].cluster_id`
            # in config/default.toml, which carries the same value — the
            # ConfigMap is where a deployment changes it, the file is what it
            # changes from.
            - name: AENV_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: cluster-identity-config
                  key: CLUSTER_ID
                  optional: true
            - name: AENV_OBSERVABILITY_SCHEDULER_REPORT_ENABLED
              value: "true"
            - name: AENV_OBSERVABILITY_SCHEDULER_ENDPOINT
              value: http://agentenv-scheduler:9090
            # 🔴 There is deliberately no AENV_NODE_SERVICE_ENABLED here, and no
            # ConfigMap generating one. It was a seam for a design that was not
            # taken: letting `--role all` serve the node sandbox service too, so
            # the api half had a machine to drive while the DaemonSet stayed on
            # `--role all`. HEAD decides the other way and asserts it —
            # `only_the_split_roles_bind_a_second_listener` in `src/bin/server.rs`
            # fails if `assemble_all` ever grows `spawn_grpc_surface`, and
            # `config/default.toml` says the same over `node_service_addr`. The
            # node sandbox service belongs to `--role node`, which is what
            # this DaemonSet now passes above; `--role all` is the rollback
            # target and is the pre-split process verbatim.
            #
            # 🔴 So the switch was never read by anything: no Rust code has ever
            # looked the variable up. Setting it changed nothing while costing a
            # serial DaemonSet roll with a drain per machine — a price two
            # runbooks told operators to pay for a no-op. Naming it here is what
            # stops it being reintroduced from those runbooks; the scan in
            # `no_manifest_sets_a_node_service_gate_nothing_reads`
            # (`src/cfg.rs`) skips comment lines so this explanation can live in
            # the file it is about. Giving the api half a machine to drive was
            # done the way it had to be — moving the DaemonSet to `--role node`,
            # a roll that buys something — and not by reviving this key.
            #
            # Where that listener sits on a `--role node` machine. Set
            # explicitly at its own default so the container port declared below
            # has a visible source, and so the api half's
            # AENV_NODE_SERVICE_PORT has something in this file to be compared
            # against — a mismatch there is the api half dialling a closed port
            # on every machine, and the symptom arrives at the moment the
            # DaemonSet moves to `--role node`.
            - name: AENV_NODE_SERVICE_ADDR
              value: "0.0.0.0:8001"
            # Where the control-plane credential is read from, re-read while
            # the process runs. 🔴 Mounted as a volume, never as a
            # secretKeyRef environment variable: kubelet refreshes volumes and
            # does not refresh env, and this node's graceful shutdown pauses
            # every sandbox it holds — so a rollback that needs a restart is a
            # rollback nobody will reach for.
            - name: AENV_API_CONTROL_PLANE_TOKEN_FILE
              value: /etc/agentenv/control-plane/token
            - name: AENV_SANDBOX_PROXY_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: sandbox-proxy-config
                  key: SANDBOX_PROXY_DOMAINS
                  optional: true
            # Not read by AgentENV's own code — it is what makes `regctl`, shelled
            # out to by every registry call this process makes, look under
            # `/root/.regctl/config.json` for the `regctl-config` volume mounted
            # below rather than finding no config and defaulting to TLS for every
            # registry, including this cluster's own plain-HTTP one. The image
            # runs as root and sets no HOME of its own, so without this line
            # `regctl` has nothing to resolve `$HOME` to. See the note on
            # `regctl-config` in kustomization.yaml.
            - name: HOME
              value: /root
          ports:
            - name: http
              containerPort: 8000
            # The node sandbox service. Declared before this DaemonSet took
            # `--role node`, which is what made that move an argument change
            # rather than that plus a YAML edit on a live cluster; now that the
            # argument is set, the process actually binds it.
            #
            # 🔴 No Service fronts this port, deliberately. The api half reaches
            # a machine by substituting its own AENV_NODE_SERVICE_PORT into the
            # address the scheduler gave it, and that address is this Pod's own
            # IP (the scheduler builds it from the agentenv-nodes EndpointSlice,
            # `kubernetes_discovery.go`), so the dial is Pod to Pod with nothing
            # in between. A ClusterIP Service here would be worse than
            # redundant: it would load-balance, and every one of these calls is
            # addressed to one named machine.
            - name: node-grpc
              containerPort: 8001
            - name: ublk-metrics
              containerPort: 9103
          resources:
            requests:
              # Kubernetes derives oom_score_adj from requests.memory:
              #   oom_score_adj = 1000 - 1000 * (requests.memory / node_capacity)
              # Without this, requests.memory defaults to 0 and oom_score_adj is
              # set to 1000, the same as firecracker child processes, offering no
              # protection. Setting some value ensures the agentenv container gets an
              # oom_score_adj well below 1000, so it is killed after firecracker
              # child processes (whose oom_score_adj we explicitly set to 1000) when
              # the host runs out of memory. Change this value accordingly.
              memory: 8Gi
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - "-c"
                  - |
                    # Stop taking new sandboxes first. The pod is already
                    # Terminating, so the scheduler's discovery will drop it
                    # too, but that is an outside signal on its own clock —
                    # this one is immediate, and it is the one the node itself
                    # acts on when deciding whether to serve a resume.
                    # X-Admin-Token, not X-API-Key: the node status endpoint is
                    # declared with AdminApiKeyAuth, and a key sent under the
                    # wrong header is a 401 that the || below would swallow.
                    # 🔴 The control-plane credential travels with it. This
                    # script is itself a caller of the node's REST API, and its
                    # failures are swallowed by the || below — so a missing
                    # header here does not fail loudly, it just silently stops
                    # draining, and sandboxes keep landing on a node that is
                    # going away.
                    CONTROL_PLANE_TOKEN="$(cat /etc/agentenv/control-plane/token 2>/dev/null | head -n1)"
                    curl -sf -X POST -H 'X-Admin-Token: preStop' \
                      -H "x-agentenv-control-plane: ${CONTROL_PLANE_TOKEN}" \
                      -H 'Content-Type: application/json' \
                      -d '{"status":"draining"}' \
                      "http://localhost:8000/nodes/${AENV_NODE_ID}" \
                      && echo "preStop: node set to draining" \
                      || echo "preStop: failed to drain node, continuing"
                    echo "preStop: waiting for sandboxes to drain..."
                    # 🔴 Bounded, and the bound is the whole point of this
                    # loop's shape. kubelet does not send SIGTERM until preStop
                    # returns, so a hook that never returns is not a hook that
                    # waits patiently — it is a hook that stops the server's own
                    # graceful shutdown from ever starting. That shutdown is
                    # what *pauses and persists* every sandbox still here; with
                    # it skipped, the grace period simply expires and everything
                    # is SIGKILLed. An unbounded wait does not protect
                    # sandboxes, it destroys them, and it does so on every
                    # single pod deletion: set image, rollout restart, delete
                    # pod, drain, node reboot.
                    #
                    # 🔴 Reads /nodes, not /sandboxes. Under `--role node` the
                    # sandboxes routes answer 404 (src/api/role_gate.rs), so the
                    # old `curl -sf … /sandboxes` would fail every time,
                    # `continue` forever, and hang the pod in Terminating for
                    # the full 3600s grace.
                    #
                    # 🔴 /nodes and not /nodes/{id}, which is what one would
                    # reach for first. Three disjoint counters have to be summed
                    # to answer "is anything still here" — sandboxCount covers
                    # only the states where the VM is up (Running, Pausing,
                    # Snapshotting, Forking, Killing), sandboxStartingCount
                    # covers Creating and Resuming, sandboxPausedCount covers
                    # Paused — and the NodeDetail schema that /nodes/{id}
                    # returns **has no sandboxStartingCount field at all**. A
                    # node polled through /nodes/{id} therefore cannot see a
                    # sandbox that is being created on it, and would call itself
                    # drained while one was starting. /nodes returns this node
                    # as a one-element array of Node, which carries all three.
                    #
                    # 🔴 X-Admin-Token, not X-API-Key: both node endpoints are
                    # declared with AdminApiKeyAuth and the wrong header is a
                    # 401, which `-f` turns into the same silent failure.
                    #
                    # 🔴 And a non-number is never a zero. `jq -e` exits
                    # non-zero on a missing field, a non-numeric one, or an
                    # empty array — which is what this endpoint returns when
                    # observability is switched off — so "the server did not
                    # answer" and "the server said none" stay different answers.
                    # The first retries and then gives up loudly; only the
                    # second ends the wait.
                    DRAIN_DEADLINE=$(( $(date +%s) + ${AENV_PRESTOP_DRAIN_TIMEOUT_SECONDS:-900} ))
                    DRAIN_READ_FAILURES=0
                    while true; do
                      count=$(curl -sf -H 'X-Admin-Token: preStop' \
                        -H "x-agentenv-control-plane: ${CONTROL_PLANE_TOKEN}" \
                        "http://localhost:8000/nodes" \
                        | jq -e 'if length == 1 then .[0] else null end | if . != null and (.sandboxCount|type)=="number" and (.sandboxStartingCount|type)=="number" and (.sandboxPausedCount|type)=="number" then .sandboxCount + .sandboxStartingCount + .sandboxPausedCount else null end') || count=""
                      case "$count" in ''|*[!0-9]*) count="" ;; esac
                      if [ -z "$count" ]; then
                        DRAIN_READ_FAILURES=$(( DRAIN_READ_FAILURES + 1 ))
                        if [ "$DRAIN_READ_FAILURES" -ge 10 ]; then
                          echo "preStop: cannot read this node's sandbox count after $DRAIN_READ_FAILURES tries; handing over to the server's own shutdown, which pauses what is still here"
                          break
                        fi
                        echo "preStop: failed to read sandbox count ($DRAIN_READ_FAILURES), retrying..."
                        sleep 3
                        continue
                      fi
                      DRAIN_READ_FAILURES=0
                      echo "preStop: $count sandbox(es) remaining (running + starting + paused)"
                      if [ "$count" = "0" ]; then
                        echo "preStop: all sandboxes drained, exiting"
                        break
                      fi
                      if [ "$(date +%s)" -ge "$DRAIN_DEADLINE" ]; then
                        echo "preStop: drain deadline reached with $count sandbox(es) still here; handing over to the server's own shutdown, which pauses them"
                        break
                      fi
                      sleep 3
                    done
            postStart:
              exec:
                command:
                  - /bin/sh
                  - "-c"
                  - |
                    # cgroup v2: disable group OOM kill for this container's cgroup.
                    # By default Kubernetes sets memory.oom.group=1, which means
                    # the entire cgroup (including the agentenv server) is killed
                    # whenever any process inside it is OOM-killed. Setting it to 0
                    # makes the OOM killer target individual processes, so a
                    # firecracker child being killed does not take down the server.
                    CGROUP="$(awk -F: '/^0::/{print $3}' /proc/self/cgroup)"
                    echo 0 > /sys/fs/cgroup/$CGROUP/memory.oom.group
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: agentenv-config
              mountPath: /workspace/config/agentenv.toml
              subPath: agentenv.toml
              readOnly: true
            # The tracked, credential-free half of `[backend.oss]`, from the
            # same ConfigMap as the file above. 🔴 A `subPath` mount, which
            # kubelet never refreshes — editing the ConfigMap changes nothing
            # until the Pod is replaced, and replacing a node Pod pauses every
            # sandbox on the machine.
            - name: agentenv-config
              mountPath: /workspace/config/oss-overlay.toml
              subPath: oss-overlay.toml
              readOnly: true
            # The credentials, and the only place in this tree they come from.
            - name: backend-credentials
              mountPath: /etc/agentenv/backend
              readOnly: true
            # Where `regctl` (`$HOME/.regctl/config.json`, `HOME=/root` above)
            # finds which registries speak plain HTTP. Another `subPath`
            # mount, so it shares the oss-overlay.toml mount's rollback
            # property above it: kubelet does not refresh it, only a Pod
            # replacement does. See the note on `regctl-config` in
            # kustomization.yaml.
            - name: regctl-config
              mountPath: /root/.regctl/config.json
              subPath: config.json
              readOnly: true
            - name: host-dev
              mountPath: /dev
            - name: control-plane-token
              mountPath: /etc/agentenv/control-plane
              readOnly: true
      volumes:
        - name: workspace
          hostPath:
            path: /var/lib/aenv
            type: DirectoryOrCreate
        - name: agentenv-config
          configMap:
            name: agentenv-k8s-config
        # Which registries `regctl` may reach over plain HTTP. Not optional,
        # unlike most of the other generated ConfigMaps here: `regctl-config`
        # is generated by this kustomization from a tracked file
        # (`config/regctl.json`), so it always exists once this base layer is
        # applied — there is no "ConfigMap was never created" case for it to
        # fall back from, only the file's own content, which is this cluster's
        # real, tracked value (see the note on `regctl-config` in
        # kustomization.yaml), the same way `oss-overlay.toml`'s endpoint is.
        - name: regctl-config
          configMap:
            name: regctl-config
        # 🔴 The object-storage credentials, as a mounted file rather than a
        # `secretKeyRef` — not for refresh, but because no environment form of
        # them exists: `[backend.oss]` is `Option<OssBackendConfig>` and
        # confique reads a non-`nested` `Option` from a file and nothing else.
        #
        # Until this existed they were plaintext in the `agentenv-k8s-config`
        # ConfigMap, which `deploy/k8s/run.sh` regenerates from
        # `config/default.toml` on every apply — so they were simultaneously in
        # the cluster and nowhere in this repository, and one apply from a clean
        # tree would have taken them out from under every node.
        #
        # `optional: true` is not a way to run without them: an absent Secret
        # mounts an empty directory, the file AENV_CONFIG_OVERLAY_PATH names is
        # then missing, and the process refuses to start naming it. What it buys
        # is that clearing AENV_CONFIG_OVERLAY_PATH is a complete rollback
        # rather than leaving the Pod stuck at ContainerCreating.
        - name: backend-credentials
          secret:
            secretName: rustfs-credentials
            optional: true
            items:
              - key: backend-oss-credentials.toml
                path: backend-oss.toml
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        # optional: an absent Secret mounts nothing, the node reads no
        # credential, and the gate stays off — which is the state this ships in.
        # Enabling the gate is writing this Secret; rolling it back is emptying
        # it. Neither restarts the pod.
        #
        # 🔴 `items` is what makes the release order real. One Secret carries
        # both halves of this credential, and the gateway reads its half as an
        # environment variable (`token`) while this node reads its half as a
        # file (`node-gate-token`). Projecting the whole Secret instead would
        # mean the single act of creating it — the step that starts the
        # gateway stamping — also drops the file that opens this node's gate,
        # in the one order the rollout must never happen in: a node refusing
        # everything the gateway has not yet been rolled to stamp. With the
        # projection named, creating the Secret with only `token` lights the
        # gateway alone; the node's file appears when `node-gate-token` is
        # added, one step later, and not before.
        #
        # A listed key that the Secret does not have is skipped rather than
        # failing the mount, because the volume is `optional` — "optional
        # specifies whether the Secret *or its keys* must be defined". The file
        # is simply absent, which the gate reads as "never read successfully",
        # which is off. 🔴 That is only true of a key that has *never* arrived:
        # once the file has been read once, taking the key away again makes the
        # read fail, and a failed read deliberately keeps the last credential
        # (see `src/api/control_plane_gate.rs`). Rolling the gate back is
        # therefore setting `node-gate-token` to the empty string — a
        # successful read of zero credentials — never deleting the key.
        - name: control-plane-token
          secret:
            secretName: agentenv-control-plane-token
            optional: true
            items:
              - key: node-gate-token
                path: token
