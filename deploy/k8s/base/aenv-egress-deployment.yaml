# The egress broker: sandboxes with `network.rules` reach their upstreams
# through it. Stateless, multi-replica, unprivileged. It holds the leaf-signing
# CA key, the HMAC key runtimes sign identity headers with, and the bearer it
# presents at the api half's resolve endpoint; none of those ever reach a node,
# and the bearer reads one granted credential at a time rather than a store.
#
# Every Secret volume is `optional: true` so the object applies on a cluster
# that has not created the Secrets yet; the process then refuses to start
# naming the missing file, which is the loud failure this wants. Creating the
# four Secrets is the release step, and `aenv-egress-secrets.example.yaml`
# says how.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aenv-egress
  labels:
    app.kubernetes.io/name: aenv-egress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aenv-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aenv-egress
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: aenv-egress
          image: agentenv-egress:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AENV_EGRESS_CONFIG_PATH
              value: /etc/aenv-egress/config.toml
            - name: RUST_LOG
              value: info
          ports:
            - name: broker
              containerPort: 8443
            - name: metrics
              containerPort: 9103
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/aenv-egress/config.toml
              subPath: aenv-egress.toml
              readOnly: true
            - name: egress-ca
              mountPath: /etc/aenv-egress/ca
              readOnly: true
            - name: egress-server
              mountPath: /etc/aenv-egress/server
              readOnly: true
            - name: egress-hmac
              mountPath: /etc/aenv-egress/hmac
              readOnly: true
            - name: egress-resolver
              mountPath: /etc/aenv-egress/resolver
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aenv-egress-config
        # CA certificate and key that sign leaf certificates for intercepted
        # names. The certificate half is also what nodes hand to guests.
        - name: egress-ca
          secret:
            secretName: egress-ca
            optional: true
        # The broker's own server certificate, signed by the same CA so a
        # node's one trust anchor verifies it.
        - name: egress-server
          secret:
            secretName: egress-server
            optional: true
        # The shared secret runtimes sign identity headers with. Nodes read
        # the same Secret as an environment variable.
        - name: egress-hmac
          secret:
            secretName: egress-hmac
            optional: true
        # The bearer the broker presents at the resolve endpoint. Named by
        # [resolver].token_file; an unset [resolver].url leaves it unread.
        - name: egress-resolver
          secret:
            secretName: egress-resolver
            optional: true
