name: Services CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/**"
      - "deploy/**"
      - "tests/fixtures/**"
      - ".github/workflows/services-ci.yml"
  push:
    paths:
      - "services/**"
      - "deploy/**"
      - "tests/fixtures/**"
      - ".github/workflows/services-ci.yml"

jobs:
  go-services:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: |
            services/go.sum
            services/go.mod
      - name: Build services
        run: make build
      - name: Install Redis server for the routing-reader tests
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Test services
        env:
          # shared/routing's reader tests fall back to looking `redis-server`
          # up on PATH and skip when it is absent, so naming the binary is
          # what makes a failed install fail the job instead of reporting a
          # green skip.
          REDIS_SERVER_BIN: /usr/bin/redis-server
          # And the belt to that brace. Naming the binary only helps while the
          # path is right; this turns a skip inside the suite into a failure
          # however it was reached. The routing-reader tests are the only
          # coverage the Redis routing projection has on this side, and a key
          # or record-format change made on the Rust side — aenv-api writes
          # every one of those keys — and forgotten here passes every other
          # test in the module.
          #
          # Named AENV_REDIS_TEST_REQUIRED, the same variable ci.yml sets for
          # the Rust half: one contract, two languages, one switch. It was
          # SCHEDULER_REDIS_TEST_REQUIRED, from when services/scheduler owned
          # the write side; there is no alias, so a workflow still setting the
          # old name arms nothing and this suite goes back to skipping green.
          AENV_REDIS_TEST_REQUIRED: "1"
        run: make test
      - name: Go format check
        run: make fmt-check
      - name: Go vet
        run: make vet
